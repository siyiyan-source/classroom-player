<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>课堂录音与逐字稿</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      --ink: #222b29;
      --muted: #68736f;
      --border: #e5e9e5;
      --accent: #216d5d;
      --accent-soft: #eaf5f0;
      --surface: #fff;
      --page: #f7f9f7;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 260px; margin: 0; }
    body { background: var(--page); color: var(--ink); line-height: 1.6; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .shell { width: 100%; max-width: 960px; margin: 0 auto; padding: clamp(12px, 3vw, 28px); }
    .card { overflow: hidden; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 28px rgba(27, 53, 43, .05); }
    .top { padding: clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--border); }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(18px, 2.8vw, 25px); line-height: 1.4; overflow-wrap: anywhere; }
    .subline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 6px; color: var(--muted); font-size: 13px; }
    .time-readout { font-variant-numeric: tabular-nums; }
    .audio-error { margin: 9px 0 0; color: #9b3f35; font-size: 13px; }
    audio { display: block; width: 100%; height: 42px; margin-top: 17px; accent-color: var(--accent); }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 13px clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--border); }
    .search-wrap { position: relative; flex: 1 1 220px; }
    .search-wrap svg { position: absolute; top: 50%; left: 12px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #search { display: block; width: 100%; height: 38px; padding: 0 13px 0 38px; border: 1px solid #d9e1dc; border-radius: 9px; outline: none; background: #fff; color: var(--ink); }
    #search:focus-visible, .quiet-button:focus-visible, .segment:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #search::placeholder { color: #8a948f; }
    .quiet-button { min-height: 38px; padding: 6px 11px; border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--accent); font-size: 13px; font-weight: 600; white-space: nowrap; }
    .quiet-button:hover { background: var(--accent-soft); }
    .quiet-button[aria-pressed="true"] { border-color: #b9d6c9; background: var(--accent-soft); }
    .result-count { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .transcript { max-height: min(62vh, 650px); min-height: 160px; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .segment { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; width: 100%; margin: 0; padding: 15px clamp(16px, 3vw, 28px); border: 0; border-bottom: 1px solid #f0f2ef; border-left: 3px solid transparent; border-radius: 0; background: transparent; color: inherit; text-align: left; }
    .segment:hover { background: #f7faf8; }
    .segment.active { border-left-color: var(--accent); background: var(--accent-soft); }
    .segment time { padding-top: 1px; color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
    .segment-body { min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
    .speaker { display: inline-block; margin-right: 7px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .word { border-radius: 3px; }
    .word:hover { background: #d1e8dc; }
    .word.word-active { background: #c4e5d4; box-shadow: 0 0 0 2px #c4e5d4; }
    .empty { padding: 44px 18px; color: var(--muted); text-align: center; font-size: 14px; }
    .state { padding: 54px 24px; text-align: center; }
    .state h2 { margin: 0 0 6px; font-size: 17px; }
    .state p { margin: 0 auto 18px; max-width: 35em; color: var(--muted); font-size: 14px; }
    .state .quiet-button { padding: 8px 18px; }
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      .shell { padding: 0; }
      .card { border-radius: 0; box-shadow: none; }
      .segment { grid-template-columns: 62px minmax(0, 1fr); gap: 5px; }
      .result-count { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="card">
      <section id="loading" class="state" role="status">
        <h2>正在打开课堂录音…</h2>
        <p>逐字稿加载后就可以点击文字回听。</p>
      </section>

      <section id="error" class="state" role="alert" hidden>
        <h2>暂时无法打开这份录音</h2>
        <p id="error-message">请稍后重试。</p>
        <button id="retry" class="quiet-button" type="button">重新加载</button>
      </section>

      <div id="player" hidden>
        <header class="top">
          <p class="eyebrow">课堂录音 · 逐字稿</p>
          <h1 id="title">课堂录音</h1>
          <div class="subline">
            <span id="duration">录音时长加载中</span>
            <span class="time-readout" id="clock">00:00 / 00:00</span>
            <span>点击逐字稿可从对应位置播放</span>
          </div>
          <audio id="audio" controls preload="metadata" aria-label="课堂录音播放器"></audio>
          <p id="audio-error" class="audio-error" role="alert" hidden>录音暂时无法播放，请稍后重新打开课程页面。</p>
        </header>

        <div class="toolbar">
          <label class="search-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg>
            <input id="search" type="search" placeholder="搜索逐字稿" aria-label="搜索逐字稿" autocomplete="off">
          </label>
          <button id="follow" class="quiet-button" type="button" aria-pressed="true" title="播放时自动定位当前句">跟随播放</button>
          <span id="result-count" class="result-count"></span>
        </div>

        <div id="transcript" class="transcript" role="region" aria-label="逐字稿"></div>
        <div id="empty" class="empty" hidden>没有找到匹配的内容。试试其他关键词。</div>
      </div>
    </div>
  </main>

  <script>window.RECORDING_DATA={"title":"无代码零基础软件制作--第四节课","duration_ms":4833067,"segments":[{"start_ms":0,"end_ms":7543,"text":"助教们已经批完作业，我们还是发现了不少问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":7543,"end_ms":17486,"text":"有的同学好像没有成功做出视频。 如果不会做视频，可以问助教，","speaker":"","sentence_id":null,"words":[]},{"start_ms":17486,"end_ms":23314,"text":"也欢迎来 office hour。","speaker":"","sentence_id":null,"words":[]},{"start_ms":23314,"end_ms":33257,"text":"今天先给大家看一些助教选出的 比较不错的作品，大家感受一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":33257,"end_ms":43886,"text":"这些作品里有的也有一些小问题， 我们一起看看，之后可以怎么改进。","speaker":"","sentence_id":null,"words":[]},{"start_ms":43886,"end_ms":48000,"text":"我先把作品放出来，谢谢。","speaker":"","sentence_id":null,"words":[]},{"start_ms":48000,"end_ms":55220,"text":"这次作业要求做一个小视频，再加一个简单的小网页。","speaker":"","sentence_id":null,"words":[]},{"start_ms":55220,"end_ms":62439,"text":"有的同学做得稍微多一点，但其实不需要卷网页数量，","speaker":"","sentence_id":null,"words":[]},{"start_ms":62439,"end_ms":72667,"text":"因为这本来只是一个简单的例子。 我还发现很多同学没有讲解，也没有字幕，","speaker":"","sentence_id":null,"words":[]},{"start_ms":72667,"end_ms":83195,"text":"这样助教批阅和课堂展示都不太方便。 这个作品虽然做得比较唯美，也很可爱，","speaker":"","sentence_id":null,"words":[]},{"start_ms":83195,"end_ms":85000,"text":"但没有声音。","speaker":"","sentence_id":null,"words":[]},{"start_ms":85000,"end_ms":93171,"text":"这个好像是日记，不同版本、不同心情会有不同的小东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":93171,"end_ms":100400,"text":"这次作业里，很多同学都做了专注、自习类的工具。","speaker":"","sentence_id":null,"words":[]},{"start_ms":100400,"end_ms":106686,"text":"为什么？是因为大家生活中需要这种工具吗？","speaker":"","sentence_id":null,"words":[]},{"start_ms":106686,"end_ms":114857,"text":"我布置作业时没有要求做这个，还是说这是最容易想到的？","speaker":"","sentence_id":null,"words":[]},{"start_ms":114857,"end_ms":124286,"text":"好多同学都在做，让我很吃惊， 看来现在大学生的注意力是个问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":124286,"end_ms":129000,"text":"这个好像是吃星球的作品，是吗？","speaker":"","sentence_id":null,"words":[]},{"start_ms":129000,"end_ms":142382,"text":"这是一个星球相关的东西。因为没有讲解， 虽然很特别，但不知道是什么意思。","speaker":"","sentence_id":null,"words":[]},{"start_ms":142382,"end_ms":154235,"text":"你有一个星球，可以吃饭还是什么。 相对来说做得还不错，很有特点。","speaker":"","sentence_id":null,"words":[]},{"start_ms":154235,"end_ms":162647,"text":"这个好像是可以玩宠物猫的作品，还可以摇尾巴。","speaker":"","sentence_id":null,"words":[]},{"start_ms":162647,"end_ms":176412,"text":"等学期结束，大家就会知道， 我们其实可以做复杂得多的东西，每个人都可以做；","speaker":"","sentence_id":null,"words":[]},{"start_ms":176412,"end_ms":181000,"text":"现在可能只是一些小玩意。","speaker":"","sentence_id":null,"words":[]},{"start_ms":181000,"end_ms":201769,"text":"这个好像也跟日记相关，有个小日历。 大家都是默声展示，其实这里可以放声音。","speaker":"","sentence_id":null,"words":[]},{"start_ms":201769,"end_ms":211000,"text":"以后交作业，尽量加上讲解和字幕。","speaker":"","sentence_id":null,"words":[]},{"start_ms":211000,"end_ms":224529,"text":"很漂亮，也是一个小日记本。 我们展示的基本都是打了五分的作品。","speaker":"","sentence_id":null,"words":[]},{"start_ms":224529,"end_ms":234000,"text":"这个写小日记的作品很特别，大家可以看一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":234000,"end_ms":244046,"text":"好像不同的石头代表不同的 Agent， 点击就可以聊天，这种交互很特别，","speaker":"","sentence_id":null,"words":[]},{"start_ms":244046,"end_ms":250648,"text":"也很漂亮。不过现在好像还没有连上 Agent。","speaker":"","sentence_id":null,"words":[]},{"start_ms":250648,"end_ms":257824,"text":"之后会讲怎么连大模型、怎么连云端，连接其实很容易。","speaker":"","sentence_id":null,"words":[]},{"start_ms":257824,"end_ms":265000,"text":"连上之后，就可以跟不同类型的心理咨询师聊天，是吗？","speaker":"","sentence_id":null,"words":[]},{"start_ms":265000,"end_ms":291917,"text":"是这个意思吗？我不知道，挺可爱的。 这个也是日常相关的，好像可以导入。","speaker":"","sentence_id":null,"words":[]},{"start_ms":291917,"end_ms":303000,"text":"导入……好，那我们开始上课。","speaker":"","sentence_id":null,"words":[]},{"start_ms":303000,"end_ms":315847,"text":"接着上次的内容，下面开始讲微服务。 之后做软件系统，除了刚才看到的那些前端，","speaker":"","sentence_id":null,"words":[]},{"start_ms":315847,"end_ms":328000,"text":"也会需要后端。现在大模型做前端做得非常漂亮， 但做后端还是会有不少问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":328000,"end_ms":338618,"text":"复杂后端会负责各种计算、数据存储，以及调用模型等任务。","speaker":"","sentence_id":null,"words":[]},{"start_ms":338618,"end_ms":350022,"text":"后端代码量可能很大， 比如一个十万行代码的项目，可能有一半，","speaker":"","sentence_id":null,"words":[]},{"start_ms":350022,"end_ms":363000,"text":"也就是五万行是后端。前端会有很多页面， 我们已经尝试做过不少页面了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":363000,"end_ms":373216,"text":"后端一定要有微服务的概念。 如果系统太复杂，一定要推动模型拆分。","speaker":"","sentence_id":null,"words":[]},{"start_ms":373216,"end_ms":383102,"text":"有时候模型不主动拆， 你就要明确要求拆成若干模块、实现模块化，","speaker":"","sentence_id":null,"words":[]},{"start_ms":383102,"end_ms":392000,"text":"也就是按功能一块块划分。怎么拆，非常体现一个人的水平。","speaker":"","sentence_id":null,"words":[]},{"start_ms":392000,"end_ms":399895,"text":"一般程序员日常工作是写代码，领导让写什么就写什么。","speaker":"","sentence_id":null,"words":[]},{"start_ms":399895,"end_ms":406526,"text":"但 CTO，也就是技术负责人，日常做什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":406526,"end_ms":416316,"text":"他可能也要解决技术难题，但称职的 CTO 核心工作是架构设计。","speaker":"","sentence_id":null,"words":[]},{"start_ms":416316,"end_ms":426105,"text":"他不一定写代码，或者说主要工作不是写代码， 而是做更抽象的设计。","speaker":"","sentence_id":null,"words":[]},{"start_ms":426105,"end_ms":434000,"text":"所以任务怎么设计非常重要，即使有模型参与也是如此。","speaker":"","sentence_id":null,"words":[]},{"start_ms":434000,"end_ms":442500,"text":"复杂项目里，你作为项目所有人，也得做好设计。","speaker":"","sentence_id":null,"words":[]},{"start_ms":442500,"end_ms":452545,"text":"原则是高内聚、低耦合，也就是解耦。划分很多微服务后，","speaker":"","sentence_id":null,"words":[]},{"start_ms":452545,"end_ms":462205,"text":"每个微服务负责自己的事情，彼此尽量不要有太多联系。","speaker":"","sentence_id":null,"words":[]},{"start_ms":462205,"end_ms":474568,"text":"这个问题很复杂，跟冒泡排序、 加减乘除这类有标准答案的问题不一样。","speaker":"","sentence_id":null,"words":[]},{"start_ms":474568,"end_ms":485000,"text":"那些可以明确判断对错，而微服务设计更像整理自己的房间。","speaker":"","sentence_id":null,"words":[]},{"start_ms":485000,"end_ms":493404,"text":"我们现在学的叫“衣柜收纳”。 衣柜里的东西到底这样整理，还是那样整理？","speaker":"","sentence_id":null,"words":[]},{"start_ms":493404,"end_ms":499337,"text":"衬衫和裤子到底要不要放在一起，其实没有绝对对错。","speaker":"","sentence_id":null,"words":[]},{"start_ms":499337,"end_ms":507000,"text":"最终会体现在系统的可维护性、 性能和代码复杂度上，这些非常重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":507000,"end_ms":514674,"text":"我的理解是，大家做微服务拆分时， 先不要太纠结这次做得好不好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":514674,"end_ms":522605,"text":"如果之前没做过，基本上不会做得很好， 需要通过实际锻炼不断学习。","speaker":"","sentence_id":null,"words":[]},{"start_ms":522605,"end_ms":530791,"text":"多做几个十万行规模的项目， 就会慢慢积累经验、形成习惯，越做越好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":530791,"end_ms":536674,"text":"我们课程最终希望大家至少做一个五万行的小软件。","speaker":"","sentence_id":null,"words":[]},{"start_ms":536674,"end_ms":540000,"text":"开始时不要太纠结、太内耗。","speaker":"","sentence_id":null,"words":[]},{"start_ms":540000,"end_ms":547643,"text":"即使如此，设计不同微服务时，有一些基本点仍要掌握。","speaker":"","sentence_id":null,"words":[]},{"start_ms":547643,"end_ms":557121,"text":"首先是名字，名字非常重要。 大家有没有听说过，做了多年程序员后，","speaker":"","sentence_id":null,"words":[]},{"start_ms":557121,"end_ms":565682,"text":"花时间最多的是给变量取名？一个东西有了名字，就有了灵魂。","speaker":"","sentence_id":null,"words":[]},{"start_ms":565682,"end_ms":574854,"text":"微服务到底做什么、 在整个系统中是什么定位，由它的名字来界定。","speaker":"","sentence_id":null,"words":[]},{"start_ms":574854,"end_ms":585248,"text":"比如用户信息微服务，用户信息都应在这里， 不属于它的内容就不该放进来，","speaker":"","sentence_id":null,"words":[]},{"start_ms":585248,"end_ms":588000,"text":"例如课程相关信息。","speaker":"","sentence_id":null,"words":[]},{"start_ms":588000,"end_ms":596322,"text":"取好名字，再怎么强调都不为过。 Code Review 时，","speaker":"","sentence_id":null,"words":[]},{"start_ms":596322,"end_ms":604357,"text":"我们会检查微服务的名字，所以一定要想清楚为什么这样命名。","speaker":"","sentence_id":null,"words":[]},{"start_ms":604357,"end_ms":612965,"text":"取好名字后，要考虑数据库。 数据库具体怎么设计，不用过于关心。","speaker":"","sentence_id":null,"words":[]},{"start_ms":612965,"end_ms":621000,"text":"我们会快速过一遍大概内容，但这门课不是专门的数据库课程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":621000,"end_ms":627667,"text":"重要的是，微服务里应该存什么类型的信息。","speaker":"","sentence_id":null,"words":[]},{"start_ms":627667,"end_ms":637667,"text":"可以把数据库看作档案或一些纸： 这里应该记录什么、不记录什么，","speaker":"","sentence_id":null,"words":[]},{"start_ms":637667,"end_ms":650333,"text":"哪些内容应关联存放？即使 AI 帮你实现了全部代码，作为系统负责人、拥有者，","speaker":"","sentence_id":null,"words":[]},{"start_ms":650333,"end_ms":662000,"text":"你也应该关心。可以想象未来你是公司的董事长、 总经理，其他人都是智能体，","speaker":"","sentence_id":null,"words":[]},{"start_ms":662000,"end_ms":669000,"text":"你也得知道公司记录了哪些信息、记录在哪里。","speaker":"","sentence_id":null,"words":[]},{"start_ms":669000,"end_ms":676000,"text":"这不会因为代码由 AI 还是人编写而改变。","speaker":"","sentence_id":null,"words":[]},{"start_ms":676000,"end_ms":682571,"text":"数据库里有什么、放在哪个微服务下面，非常重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":682571,"end_ms":689429,"text":"数据库一定要与微服务定位相关，属于它的主职主业。","speaker":"","sentence_id":null,"words":[]},{"start_ms":689429,"end_ms":699429,"text":"比如用户信息微服务，就不该记录课程、 某张桌子的价格和重量等不相关内容。","speaker":"","sentence_id":null,"words":[]},{"start_ms":699429,"end_ms":702000,"text":"这些需要你来管理。","speaker":"","sentence_id":null,"words":[]},{"start_ms":702000,"end_ms":713937,"text":"第三个点比较容易理解， 大家可能反而觉得它最重要，它也确实很重要，","speaker":"","sentence_id":null,"words":[]},{"start_ms":713937,"end_ms":725500,"text":"就是 API 功能。微服务像商店、 学校食堂的窗口、饭卡充值处，","speaker":"","sentence_id":null,"words":[]},{"start_ms":725500,"end_ms":736690,"text":"或者卖书的书店。它是一个部门、 一家店，会提供不同功能和服务。","speaker":"","sentence_id":null,"words":[]},{"start_ms":736690,"end_ms":749000,"text":"原则上就这几件事：定位是什么、 做什么、记录什么、对外提供什么服务。","speaker":"","sentence_id":null,"words":[]},{"start_ms":749000,"end_ms":759248,"text":"API 就是对外提供的服务，这些服务可以并发、并行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":759248,"end_ms":771073,"text":"比如小卖部卖水、面包、本子和铅笔， 这些服务本身彼此关系不大，","speaker":"","sentence_id":null,"words":[]},{"start_ms":771073,"end_ms":776591,"text":"API 基本也是相互独立的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":776591,"end_ms":791175,"text":"高内聚要求微服务内部的数据和对外功能有相似性、 相关性，实现起来方便、自然。","speaker":"","sentence_id":null,"words":[]},{"start_ms":791175,"end_ms":803000,"text":"低耦合则要求外部联系比较弱， 不要实现一个功能就反复依赖外部。","speaker":"","sentence_id":null,"words":[]},{"start_ms":803000,"end_ms":817269,"text":"举个例子，你和室友合作做一个手工小车， 你负责后半部分，他负责前半部分。","speaker":"","sentence_id":null,"words":[]},{"start_ms":817269,"end_ms":831946,"text":"但只有一把剪刀，总在室友那边。 你每做一点事，都得借剪刀，剪一下又还回去，","speaker":"","sentence_id":null,"words":[]},{"start_ms":831946,"end_ms":845808,"text":"再借、再还。这样的过程就不是好的微服务设计， 因为剪刀在别的微服务里，","speaker":"","sentence_id":null,"words":[]},{"start_ms":845808,"end_ms":856000,"text":"而你做车的后半部分，几乎每件事都要用它，十分麻烦。","speaker":"","sentence_id":null,"words":[]},{"start_ms":856000,"end_ms":865071,"text":"或者你发现，后半部分必须跟前半部分连在一起， 不能最后用胶水一粘，","speaker":"","sentence_id":null,"words":[]},{"start_ms":865071,"end_ms":871874,"text":"中间有千丝万缕的联系，那就不该拆，应该合在一起。","speaker":"","sentence_id":null,"words":[]},{"start_ms":871874,"end_ms":882646,"text":"如果一个微服务的某些功能被其他微服务频繁、 大量调用，就要考虑把两个服务合并，","speaker":"","sentence_id":null,"words":[]},{"start_ms":882646,"end_ms":888315,"text":"或者把频繁调用的部分抽成独立的公共模块。","speaker":"","sentence_id":null,"words":[]},{"start_ms":888315,"end_ms":892000,"text":"总之，模块划分要尽量清晰。","speaker":"","sentence_id":null,"words":[]},{"start_ms":892000,"end_ms":901012,"text":"API 是微服务提供的服务，但并不是最重要的东西；","speaker":"","sentence_id":null,"words":[]},{"start_ms":901012,"end_ms":907140,"text":"最重要的是名字，因为名字决定定位。","speaker":"","sentence_id":null,"words":[]},{"start_ms":907140,"end_ms":919756,"text":"提供的服务通常无非是处理数据库中的数据、 做某些运算，或者调用模型能力，","speaker":"","sentence_id":null,"words":[]},{"start_ms":919756,"end_ms":923000,"text":"比如画画、聊天等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":923000,"end_ms":932928,"text":"最简单的例子是来清华报到： 第一天可能要去 A 楼拿学生卡，","speaker":"","sentence_id":null,"words":[]},{"start_ms":932928,"end_ms":943883,"text":"B 楼领新生欢迎礼包，C 楼登记住宿信息，D 楼激活图书馆权限。","speaker":"","sentence_id":null,"words":[]},{"start_ms":943883,"end_ms":953468,"text":"现在学校可能很方便，在一个地方一条龙办完，不用跑其他楼；","speaker":"","sentence_id":null,"words":[]},{"start_ms":953468,"end_ms":961000,"text":"但常见的分工方式，就是不同部门负责各自的事。","speaker":"","sentence_id":null,"words":[]},{"start_ms":961000,"end_ms":969000,"text":"A 楼专门管学生卡，B 楼负责欢迎礼包， C 楼负责住宿，D 楼负责图书馆。","speaker":"","sentence_id":null,"words":[]},{"start_ms":969000,"end_ms":976902,"text":"A、B、C、D 楼可以看作微服务， 它们提供的服务就是 API。","speaker":"","sentence_id":null,"words":[]},{"start_ms":976902,"end_ms":983275,"text":"API 不需要你亲手实现，但要知道它提供什么功能。","speaker":"","sentence_id":null,"words":[]},{"start_ms":983275,"end_ms":991176,"text":"我虽然讲得轻描淡写， 但根据过去五年的经验，大家遇到的最大困难，","speaker":"","sentence_id":null,"words":[]},{"start_ms":991176,"end_ms":995000,"text":"就是如何正确拆分、设计微服务。","speaker":"","sentence_id":null,"words":[]},{"start_ms":995000,"end_ms":1001607,"text":"API 设计、数据库对象设计是最难的，需要从实践中学习。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1001607,"end_ms":1006090,"text":"到 Code Review 时再展开。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1006090,"end_ms":1012933,"text":"简单来说，这些不好做， 需要多年积淀，大家要知道它们很重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1012933,"end_ms":1016000,"text":"下面讲第二个概念：序列化。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1016000,"end_ms":1024138,"text":"之前讲过函数式编程和 Monad。这里，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1024138,"end_ms":1036752,"text":"随着使用 Monad、 纯函数式编程和微服务，自然会遇到序列化。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1036752,"end_ms":1048552,"text":"比如前端、后端，后端又拆成很多微服务， 它们之间难免要交流。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1048552,"end_ms":1062386,"text":"我们用纯函数式编程，每个微服务模块 内部都是一个纯粹、优美的函数空间，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1062386,"end_ms":1069710,"text":"描述自己的对象和理想世界，没有污染。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1069710,"end_ms":1075000,"text":"另一个微服务内部也是这样。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1075000,"end_ms":1088750,"text":"设计系统时，会尽量用类似的对象描述概念， 比如这边有 Student，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1088750,"end_ms":1103713,"text":"那边也有 Student。 两个微服务可能需要通信：一个管宿舍，一个管饭卡，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1103713,"end_ms":1114632,"text":"宿舍服务有时可能也要查学生饭卡有没有丢、是否需要补办。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1114632,"end_ms":1130000,"text":"这样，微服务间传输就会产生问题。 如果用最朴素、经典的方式实现微服务，会怎样？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1130000,"end_ms":1134157,"text":"每个微服务是独立应用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1134157,"end_ms":1148142,"text":"Service 1、Service 2 是两个独立的、双击可以启动的程序，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1148142,"end_ms":1159480,"text":"各自在后端运行，它们不在一起。 内部是干净、纯粹的纯函数世界；","speaker":"","sentence_id":null,"words":[]},{"start_ms":1159480,"end_ms":1168551,"text":"但一旦要向外发消息，就碰到了“肮脏的真实世界”。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1168551,"end_ms":1178000,"text":"这个世界没有你定义的类型，无论你把类型定义得多好，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1178000,"end_ms":1188450,"text":"例如 Student 类， 一旦进入这个没有对应类型的世界，就得想办法处理。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1188450,"end_ms":1198901,"text":"这里只有一些基本对象。序列化的本质是： 你构建了自己的理想世界，做得很开心，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1198901,"end_ms":1205962,"text":"但有时不得不触碰真实世界。整个课程讲的函数式编程，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1205962,"end_ms":1215000,"text":"就是构建这样的理想世界〔原转写： 罗斯蒂克托普斯，理论名称待核〕。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1215000,"end_ms":1224930,"text":"比如微服务之间传信息，跟前端传信息， 或者跟数据库 DB 交互。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1224930,"end_ms":1235500,"text":"数据库记录各种信息，比如今天花了多少钱、 买了什么、写的作文是什么。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1235500,"end_ms":1247031,"text":"你要写信息进去，也要从中读取。 每一种操作，只要离开你喜欢的纯函数式世界，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1247031,"end_ms":1256000,"text":"就来到了真实世界，信息也不再保持原来的纯函数式类型形式。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1256000,"end_ms":1261815,"text":"到了真实世界，就没有你定义的那些复杂类型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1261815,"end_ms":1270954,"text":"函数式世界是基于 Scala、 Java 或其他语言构建的虚拟概念，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1270954,"end_ms":1274000,"text":"是一个数学世界的概念。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1274000,"end_ms":1282174,"text":"网络传输、数据库读写只有字符串、数字等基本表示。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1282174,"end_ms":1290348,"text":"序列化本质上是一种记录方式，也可以理解成密码本。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1290348,"end_ms":1300565,"text":"原来有一个抽象、纯粹的 Student 概念，要传到数据库，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1300565,"end_ms":1310442,"text":"就用一个字符串表示它的全部信息。 这个字符串不是原来的类型，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1310442,"end_ms":1321000,"text":"但包含 Student 的信息。 其他类也可以用同样的方法处理。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1321000,"end_ms":1333285,"text":"我自己是竞赛出身，一开始学竞赛时没有接触这些， 只要写代码解决问题就行，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1333285,"end_ms":1343464,"text":"所以最初觉得序列化很边缘。 但系统做得越多，越会发现它重要，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1343464,"end_ms":1350132,"text":"因为它是连接不同世界的协议，像电话线。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1350132,"end_ms":1361364,"text":"把一个东西传到另一空间， 必须保证能传过去、中间能传、对方能理解。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1361364,"end_ms":1374000,"text":"我们课程现在让 AI 写代码， 项目也不是那么复杂，通常几万行或十几万行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1374000,"end_ms":1385068,"text":"推荐框架里的后端微服务， 实际上不拆成独立应用，而是逻辑上的微服务。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1385068,"end_ms":1396472,"text":"之后看代码时会看到：比如 source 文件夹下面有 Student","speaker":"","sentence_id":null,"words":[]},{"start_ms":1396472,"end_ms":1409553,"text":"Service、Course Service、Teacher Service，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1409553,"end_ms":1418273,"text":"分别放在不同文件夹里，但整个项目运行在一个大服务中。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1418273,"end_ms":1428000,"text":"只启动一次，所有逻辑微服务都能正常运行， 大概就是这个意思。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1428000,"end_ms":1440429,"text":"几年前上课时，会要求学生做不同的微服务项目，分别启动。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1440429,"end_ms":1457000,"text":"这种方式更干净、更清楚， 容易知道各个服务在做什么，但坏处是比较消耗内存。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1457000,"end_ms":1465972,"text":"机器不够强，就跑不了几个微服务。 有同学做了十个微服务，启动所有项目，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1465972,"end_ms":1473097,"text":"其中一个就要半小时，很累。换成现在这种框架会简单一些。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1473097,"end_ms":1482333,"text":"代码反正由 AI 写， 只要把各服务的实现放在对应文件夹里，不互相干扰，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1482333,"end_ms":1487083,"text":"也能达到目的。但不能让 AI 乱来，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1487083,"end_ms":1495000,"text":"一不小心它就把一个微服务的代码 写到另一个里面，弄得乱七八糟。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1495000,"end_ms":1502095,"text":"上次有同学问，能否根据课程写一个 Skill，让模型自动满足所有要求？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1502095,"end_ms":1505946,"text":"我不知道可不可以，反正上学期没人做到。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1505946,"end_ms":1514054,"text":"如果今年用更强的 Astra、Opus 等模型〔原转写还有“babel5.5”，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1514054,"end_ms":1520338,"text":"型号待核〕做出来，我完全没意见。 我并不是要求大家背下所有内容，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1520338,"end_ms":1525000,"text":"只希望告诉大家，一个好的系统结构大概是什么样。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1525000,"end_ms":1534281,"text":"按课程推荐框架，后端最终是一个大服务，而不是不同工程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1534281,"end_ms":1545281,"text":"如果有同学电脑很强，又喜欢拆成独立应用， 觉得这样更干净，行不行？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1545281,"end_ms":1547000,"text":"当然可以。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1547000,"end_ms":1555400,"text":"但这样就要面对一个问题：调用另一服务的 API 时，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1555400,"end_ms":1562831,"text":"必须在本服务这边记录对方提供的 API 功能。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1562831,"end_ms":1570585,"text":"否则这边不知道那边提供什么服务，互相传输就乱了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1570585,"end_ms":1578338,"text":"有同学这样做时，我们再具体讲。推荐框架容易很多，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1578338,"end_ms":1589000,"text":"基本能直接看到每个逻辑微服务提供什么服务， 调用对应 API 就行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1589000,"end_ms":1601832,"text":"即使整个后端只是逻辑上拆成微服务， 也就是用文件夹区分，没有拆成独立应用，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1601832,"end_ms":1615020,"text":"也不意味着序列化没用了。你仍然要面对数据库、 前后端通信，所以总需要序列化。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1615020,"end_ms":1625000,"text":"如果框架把这些事处理得足够好，你就可能感觉不到这个过程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1625000,"end_ms":1633000,"text":"讲序列化，是想告诉大家，它复杂、重要，也很麻烦。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1633000,"end_ms":1644333,"text":"但框架会尽量把这些细节抹平， 让你专注最重要的业务逻辑、想实现的功能，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1644333,"end_ms":1647000,"text":"以及微服务拆分。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1647000,"end_ms":1655475,"text":"之后会讲强类型前端，以及前后端类型对齐。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1655475,"end_ms":1668186,"text":"为什么要对齐？前端有一个类型世界、 纯函数世界，后端也有一个。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1668186,"end_ms":1683017,"text":"虽然它们因网络传输而不是同一个世界， 但如果用序列化工具处理好传输细节，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1683017,"end_ms":1697000,"text":"让人感觉不到，写代码就会非常顺畅， 仿佛前后端都在同一个世界里工作。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1697000,"end_ms":1706927,"text":"前端的 Student 传到后端， 还是同一个 Student。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1706927,"end_ms":1713652,"text":"不要小看这件事，尤其学竞赛的同学可能觉得，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1713652,"end_ms":1721017,"text":"自己平时做平衡二叉树、斐波那契堆等深奥的东西，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1721017,"end_ms":1727101,"text":"两个 Student 一样有什么难的？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1727101,"end_ms":1733506,"text":"但现在 AI 写堆、平衡二叉树写得很好，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1733506,"end_ms":1745034,"text":"反而在前后端代码类型对齐、 保证它们属于同一个系统这件事上，仍有不少问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1745034,"end_ms":1754000,"text":"至少去年我花了两周，帮大家纠正前后端类型必须对齐的问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1754000,"end_ms":1762816,"text":"有些同学不重视，觉得前端写前端、后端写后端，不要对齐。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1762816,"end_ms":1772939,"text":"但不对齐一定会出 Bug。 现在大家谈 Vibe Coding，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1772939,"end_ms":1784041,"text":"觉得自己无所不能，算力、Token 给够就什么都能做，其实不是这样。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1784041,"end_ms":1791878,"text":"当然世界上可能有万里挑一的奇才，但我周围很少见。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1791878,"end_ms":1802000,"text":"大多数人用完 AI 会发现， 只要两边的类型有一点纰漏、没对上，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1802000,"end_ms":1813763,"text":"里面就会藏 Bug。如果只是课程 Demo，我不会要求大家部署给一万人用，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1813763,"end_ms":1822665,"text":"最后展示一下就行。但以后真想做商用软件，这件事极为重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1822665,"end_ms":1832202,"text":"只有保证前端、后端、数据库类型对齐， 才能借助强类型减少问题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1832202,"end_ms":1840150,"text":"尽量只留下逻辑上的 Bug，避免细微、奇怪的错误。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1840150,"end_ms":1850642,"text":"上学期经验告诉我，对很多同学来说， 前后端类型对齐是非常困难的问题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1850642,"end_ms":1857000,"text":"到 Code Review 时再具体看。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1857000,"end_ms":1866884,"text":"微服务即使只是逻辑拆分，也必须拆。 有同学可能想，既然只是逻辑上分开，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1866884,"end_ms":1875605,"text":"还不如不分。但大系统不拆， 代码就会像浆糊裹在一起，越写越多，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1875605,"end_ms":1884616,"text":"产生不必要的代码。原本五万行能写完， 揉在一起可能写出五十万行，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1884616,"end_ms":1895081,"text":"还不好检查 Bug。现在 AI 喜欢发现一个 Bug 就加一两百行修复，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1895081,"end_ms":1903512,"text":"又产生更多 Bug。 尽量把模块拆小、拆细，就更不容易出错，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1903512,"end_ms":1907000,"text":"这也是函数式的一个理念。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1907000,"end_ms":1919750,"text":"序列化处理前端到后端、后端到数据库的数据传输， 把复杂类型转换成基本表示。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1919750,"end_ms":1931083,"text":"这里有正变换和逆变换。 比如两个微服务间传 Student 对象，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1931083,"end_ms":1944188,"text":"要先变成 String，通过网络传输， 到另一边进入类型世界时，再变回对象。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1944188,"end_ms":1951271,"text":"所以有两步：序列化和反序列化，都很重要，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1951271,"end_ms":1958000,"text":"简单说就是对象变字符串、字符串变对象。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1958000,"end_ms":1966333,"text":"最终我们会套统一模板。 之后结合具体例子讲，现在只是简单介绍。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1966333,"end_ms":1973000,"text":"按照模板写代码时，大家完全不用自己处理这些细节。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1973000,"end_ms":1978591,"text":"你不用管序列化、反序列化具体怎么写。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1978591,"end_ms":1987288,"text":"我强调它，是因为不同类型世界之间沟通时，这个过程很重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1987288,"end_ms":1996606,"text":"必须保证前端、后端或其他地方说 的是同一件事，没有偏差、疏漏。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1996606,"end_ms":2002818,"text":"不对齐、没有用好序列化，就可能产生偏差。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2002818,"end_ms":2014000,"text":"但实现基本是模板化的，只要 AI 按固定方式写，你甚至感受不到它的存在。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2014000,"end_ms":2026153,"text":"简单讲，如果定义一个 case class，有 A、B、C 几个变量，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2026153,"end_ms":2035875,"text":"只要加上这两句，要求自动序列化和反序列化，基本就能实现。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2035875,"end_ms":2039000,"text":"通常都是这么简单。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2039000,"end_ms":2048220,"text":"比如对象里三个变量的值分别是 13、“qxqx”和 false，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2048220,"end_ms":2053695,"text":"调用 .json 就能转成 JSON。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2053695,"end_ms":2064644,"text":"之后会给更完整的模板，让 AI 在每个定义的类里加上那两句，就能自动序列化。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2064644,"end_ms":2073000,"text":"这样你几乎感受不到服务间的差别， 仿佛处在同一个完整世界里。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2073000,"end_ms":2082412,"text":"面向数据库的序列化再稍微讲一下。 这件事 AI 现在也能做得很好，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2082412,"end_ms":2093000,"text":"可以直接问它。这里先提一点： 在我们的系统里，直接存基础类型的情况很少见。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2093000,"end_ms":2101431,"text":"这里说的不是直接使用 String、 Int、Boolean，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2101431,"end_ms":2111549,"text":"而是取值为这些基础类型的对象。例如名字 Name 的值是 String，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2111549,"end_ms":2117451,"text":"但系统里会定义为 Username 类型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2117451,"end_ms":2124758,"text":"虽然存下来是基础类型，本质上却是 Username。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2124758,"end_ms":2133471,"text":"这样的类型可以直接存； 如果是复杂类型，就要序列化后写入数据库，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2133471,"end_ms":2136000,"text":"读出来再反序列化。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2136000,"end_ms":2144283,"text":"这个时候会有不同处理方法。先休息一下，下节课接着讲。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2144283,"end_ms":2155115,"text":"函数式可以实现这么优美的功能， 我们之后会给模板框架，大家在上面开发。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2155115,"end_ms":2166265,"text":"为什么现在没给？历史经验是， 先给了模板，大家就直接写，写完不符合规范，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2166265,"end_ms":2172000,"text":"我要求改时，同学们会用各种理由拒绝。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2172000,"end_ms":2178102,"text":"比如“老师，AI 已经写成这样了，我不想改”。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2178102,"end_ms":2184735,"text":"所以讲完再给模板，让大家没有借口。现在做得也很快，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2184735,"end_ms":2189776,"text":"AI 时代做个小软件可能就是一天的事。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2189776,"end_ms":2198000,"text":"用现在的工具，做一个五万行的小 系统可能只需几个小时，可以很快。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2198000,"end_ms":2203672,"text":"接着讲。大家要相信，这些信息都很重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2203672,"end_ms":2213522,"text":"你可能不用亲手写代码，但理解这些内容， 会对整个系统有更强的掌控感，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2213522,"end_ms":2218000,"text":"达到如数家珍的程度，这很重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2218000,"end_ms":2228294,"text":"比如 Scala 里的 List[Int]，也就是整数列表，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2228294,"end_ms":2234471,"text":"数据库里恰好也有对应的数字列表类型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2234471,"end_ms":2244422,"text":"我们用 PostgreSQL， 称它为世界上很高级的数据库。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2244422,"end_ms":2253000,"text":"它当然也有类型安全，但基本还是基础类型的类型安全。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2253000,"end_ms":2263470,"text":"一般不能直接在数据库里定义你的 Student、 Teacher、Name 等类型世界，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2263470,"end_ms":2272235,"text":"只能用 String、Int 这类基础类型，所以这里是比较基础的强类型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2272235,"end_ms":2281000,"text":"如果是 List[T]，T 是泛指类型的占位符，表示某种其他类型的列表。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2281000,"end_ms":2290600,"text":"比如 T 不是 Int。大家记得， 系统里尽量不用裸 Int，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2290600,"end_ms":2297320,"text":"而要用有语义的类型，比如老师、教室、课程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2297320,"end_ms":2307880,"text":"List[Course]、 List[Student] 这样的列表，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2307880,"end_ms":2319400,"text":"可以有多种存法。最后要存到数据库， 但数据库可以理解为 Excel 表格，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2319400,"end_ms":2329000,"text":"或者在白纸上一行行记录的东西， 只能用字符串、数字等形式记录。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2329000,"end_ms":2342458,"text":"要考虑的是，一串教室信息怎么放。 教室是自己定义的具体类，有很多存法，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2342458,"end_ms":2348000,"text":"比如用一个很长的字符串表示。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2348000,"end_ms":2365415,"text":"例如 Classroom 类有若干成员变量： Building 表示二教、三教；","speaker":"","sentence_id":null,"words":[]},{"start_ms":2365415,"end_ms":2378811,"text":"Room Number 表示房间号，比如我们这里是 117；","speaker":"","sentence_id":null,"words":[]},{"start_ms":2378811,"end_ms":2391761,"text":"Seat Number 表示座位数，比如能坐 120 人；","speaker":"","sentence_id":null,"words":[]},{"start_ms":2391761,"end_ms":2403818,"text":"还可能有 Name，比如校友捐款后命名为“张三教室”。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2403818,"end_ms":2419000,"text":"这是一个复合类，需要序列化， 因为数据库不能直接存我们的这个类型结构。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2419000,"end_ms":2423737,"text":"可以把它存成字符串，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2423737,"end_ms":2440316,"text":"例如“building: 二教, room number: 117”，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2440316,"end_ms":2456421,"text":"把相关信息记录下来。读的时候， 你知道这不是随意写在纸上的普通字符串，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2456421,"end_ms":2464000,"text":"而是有语义的，代表某个具体对象，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2464000,"end_ms":2469833,"text":"就让程序把它还原成 Classroom。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2469833,"end_ms":2478875,"text":"我反复强调类型的重要性， 是因为在类型世界里，它不只是孤立信息，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2478875,"end_ms":2486458,"text":"而是有结构、仿佛有生命的东西；存下来则是一团字符串。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2486458,"end_ms":2494042,"text":"结构变字符串、字符串还原结构，这个序列化过程很重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2494042,"end_ms":2499000,"text":"那么 List[T] 是什么意思？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2499000,"end_ms":2511131,"text":"如果想存一系列教室，比如六教有一百个教室， 可以把每个教室表示成一个字符串，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2511131,"end_ms":2519000,"text":"再用分隔符隔开。每个字符串都代表一个教室的信息。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2519000,"end_ms":2525341,"text":"最后把它们拼成一个大字符串存到数据库，可能便于阅读；","speaker":"","sentence_id":null,"words":[]},{"start_ms":2525341,"end_ms":2529976,"text":"也可以用 JSON 或其他格式。总之，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2529976,"end_ms":2537537,"text":"不能直接把纯类型对象原封不动放进数据库， 必须选择某种存储表示。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2537537,"end_ms":2539000,"text":"具体怎么存，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2539000,"end_ms":2543541,"text":"可以让 AI 推荐，但你需要知道这个过程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2543541,"end_ms":2548946,"text":"这里专门做了一个例子，涉及数据库，我们大概看一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2548946,"end_ms":2553919,"text":"这句表示创建一个叫 try_table 的表。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2553919,"end_ms":2560189,"text":"PRIMARY KEY 是主键，也就是唯一标识它的 ID。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2560189,"end_ms":2564514,"text":"这里还有记录时间的 timestamp，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2564514,"end_ms":2571000,"text":"以及 MyClass、 IDClass、List 等对应字段和","speaker":"","sentence_id":null,"words":[]},{"start_ms":2571000,"end_ms":2576405,"text":"LocationType〔部分字段名原转写不清〕，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2576405,"end_ms":2579000,"text":"下面分别写出它们的类型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2579000,"end_ms":2583704,"text":"比如 TEXT、INT、TEXT、INT、TEXT。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2583704,"end_ms":2590035,"text":"PostgreSQL 可直接使用的类型不如我们自己定义的领域类型丰富。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2590035,"end_ms":2594920,"text":"实际类型系统里会定义大量类型，与要实现的类型世界相关。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2594920,"end_ms":2601070,"text":"例如 DateTime 和数据库的 timestamp 都表示时间，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2601070,"end_ms":2605412,"text":"序列化时转换成数据库能理解的格式，信息保持一致。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2605412,"end_ms":2611925,"text":"这里还定义了 MyClass、 IDClass、List[MyClass]","speaker":"","sentence_id":null,"words":[]},{"start_ms":2611925,"end_ms":2615000,"text":"、List[IDClass] 等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2615000,"end_ms":2622241,"text":"LocationType 是枚举类型，也就是 enum。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2622241,"end_ms":2628448,"text":"系统里可以定义需要的各种类型，每种都有语义信息。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2628448,"end_ms":2633621,"text":"只有这些语义信息，才能描绘想实现的功能；","speaker":"","sentence_id":null,"words":[]},{"start_ms":2633621,"end_ms":2638017,"text":"而对应数据库中的存储类型相对简单，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2638017,"end_ms":2645000,"text":"比如 TEXT、BIGINT、BIGINT 的列表等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2645000,"end_ms":2656361,"text":"大家要理解，从后端优美的纯函数世 界把信息存到数据库，必须经过转换，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2656361,"end_ms":2666000,"text":"做一些不那么优美的工作。但 AI 能帮你做，不用太担心。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2666000,"end_ms":2674951,"text":"你需要知道，后端里的对象和数据库里的表示不是一回事。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2674951,"end_ms":2687000,"text":"有点像神笔马良画马，画上的马和出来 在自然界奔跑的马，并不是同一种东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2687000,"end_ms":2695886,"text":"数据库就简单讲到这里。数据库本来是一门要学一学期的课，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2695886,"end_ms":2702797,"text":"这里三页 PPT 就讲完了。大家有问题吗？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2702797,"end_ms":2713000,"text":"没有。之前页数更多，为了照顾大家， 我把一些不必要的内容删掉了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2713000,"end_ms":2718538,"text":"下面看 Git 版本管理，之前简单提过。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2718538,"end_ms":2723523,"text":"AI 时代，我觉得每个人仍应了解它。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2723523,"end_ms":2731000,"text":"Git 是代码管理工具。大家可能也听过一个很大的网站，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2731000,"end_ms":2736373,"text":"GitHub，被叫作程序员交友网站。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2736373,"end_ms":2744134,"text":"大家把代码放在那里，可以更好地做版本控制、版本管理。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2744134,"end_ms":2751000,"text":"它解决的需求，只要上这门课，大家一定都会遇到。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2751000,"end_ms":2760753,"text":"你让 AI 写代码， 写着写着发现还不如上一版，它把代码写坏了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2760753,"end_ms":2767989,"text":"AI 有时像脱缰野马，随手改了你不想改的东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2767989,"end_ms":2779000,"text":"这时让它改回去，它未必能原样恢复， 可能继续改得更乱，虽然它肯定会答应。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2779000,"end_ms":2788300,"text":"它会说“我努力改”， 但你指出想要上个版本，它又给你改个新版本。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2788300,"end_ms":2798800,"text":"不要指望 AI 总能原样改回去， 就像油画画上了一笔，不能简单要求擦掉。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2798800,"end_ms":2804200,"text":"至少根据我现在的观察，AI 做不好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2804200,"end_ms":2812000,"text":"应该用 Git，提醒它：“为了防止你把某些东西改了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2812000,"end_ms":2818946,"text":"我不喜欢，请使用 Git 管理我的代码。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2818946,"end_ms":2830060,"text":"”加上这句话很重要，我专门打给大家看， 就不打开 Codex 了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2830060,"end_ms":2841868,"text":"大家可以加上“为了防止你把代码改坏， 请使用 Git 管理我的代码”。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2841868,"end_ms":2847078,"text":"它就会理解，帮你加上版本管理。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2847078,"end_ms":2857150,"text":"还可以强调每次操作后 commit 一下、push 一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2857150,"end_ms":2863749,"text":"这样你想回到上一版时，它就能帮你回退。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2863749,"end_ms":2870000,"text":"下面可能有一点抽象，不理解也没关系。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2870000,"end_ms":2877902,"text":"可以让模型解释。重要的是刚才那句话， 这样遇到不喜欢的改动，可以让它回退，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2877902,"end_ms":2879000,"text":"非常重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2879000,"end_ms":2885107,"text":"Git 做版本控制，有几个核心概念。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2885107,"end_ms":2898000,"text":"我觉得它也有纯函数式设计的意味，是 Linux 的设计者做的，结构非常优美。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2898000,"end_ms":2903211,"text":"首先是 repository，也就是代码仓库，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2903211,"end_ms":2907742,"text":"整个项目就是一个 repository。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2907742,"end_ms":2914086,"text":"还有 commit：某个时刻仓库的样子，给它拍一张快照，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2914086,"end_ms":2920656,"text":"就是一次 commit。 在我的理解里，基本就是这两个概念，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2920656,"end_ms":2927000,"text":"其他概念从它们延伸出来，比如 branch，也就是分支。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2927000,"end_ms":2934147,"text":"这学期基本是一个人开发，没有很多人协作，不太需要分支。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2934147,"end_ms":2940500,"text":"如果多人合作，有人做这个功能、有人做另一个功能，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2940500,"end_ms":2945000,"text":"就可能在 Git 中产生不同分支。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2945000,"end_ms":2957097,"text":"比如做一个网页，让同学改顶部栏，你自己设计侧边栏。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2957097,"end_ms":2969194,"text":"你开一个分支，同学开一个分支，各自开发，最后合并。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2969194,"end_ms":2977903,"text":"这就是分支的好处，双方不会相互干扰。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2977903,"end_ms":2990000,"text":"合并时才需要处理彼此冲突的问题，该处理的仍要处理。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2990000,"end_ms":2995416,"text":"有矛盾或不好的地方，合并时需要解决。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2995416,"end_ms":3005646,"text":"Git 分支很优雅的一点是， 它只是一个名字，没有单独复制出一个实体。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3005646,"end_ms":3013469,"text":"整个 Git 由许多 commit 组成，所谓分支，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3013469,"end_ms":3024000,"text":"只是给某条提交链上的 commit 取名，本质上是一系列快照连接起来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3024000,"end_ms":3030866,"text":"Git 还有本地和远端的概念，我们课程可能用不到。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3030866,"end_ms":3038282,"text":"GitHub 是远端服务器，把 Git 仓库放在那里。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3038282,"end_ms":3047620,"text":"可以 git pull 拉取到本地， 修改后再 push 同步到远端。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3047620,"end_ms":3055310,"text":"这些常见操作不用手写，现在连我们工程师团队也常让模型做，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3055310,"end_ms":3063000,"text":"比如“帮我 push 一下”。但仍值得了解它有哪些功能。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3063000,"end_ms":3069548,"text":"git clone 是完整复制一个仓库。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3069548,"end_ms":3077732,"text":"git pull 则是在对方更新后，同步已有仓库。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3077732,"end_ms":3090173,"text":"比如 GitHub 上某个仓库是 v1.1，你复制下来，本地也是 v1.1；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3090173,"end_ms":3100976,"text":"后来作者更新成 v1.2 或 v1.5，就可以 git pull，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3100976,"end_ms":3105232,"text":"把本地也更新到 v1.5。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3105232,"end_ms":3114399,"text":"git status 可以看本地仓库状态、有没有修改等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3114399,"end_ms":3118000,"text":"这些交给模型执行就行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3118000,"end_ms":3122647,"text":"git add 把当前修改放进暂存区；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3122647,"end_ms":3128029,"text":"git commit 把暂存内容记录成快照；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3128029,"end_ms":3133410,"text":"git push 则把本地新提交同步到远端。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3133410,"end_ms":3141482,"text":"比如从 v1.5 改成 v1.6， 推送后远端也更新，前提是有权限。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3141482,"end_ms":3150043,"text":"checkout 可以切换分支， merge 把另一分支合并到当前分支。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3150043,"end_ms":3152000,"text":"这些是常用操作。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3152000,"end_ms":3157311,"text":"看一个图，刚才讲了半天可能有点抽象。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3157311,"end_ms":3167639,"text":"大家以后可能大多不会亲手执行这些操作， 但理解它是什么、能提供什么帮助，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3167639,"end_ms":3170000,"text":"我觉得非常重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3170000,"end_ms":3177208,"text":"图里每个点是一个 commit， 也就是某个时刻仓库的快照。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3177208,"end_ms":3182676,"text":"一开始可能有 master，图的前面截掉了；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3182676,"end_ms":3185908,"text":"按理说最初有一个共同起点，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3185908,"end_ms":3192370,"text":"之后出现 master、developer 等分支。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3192370,"end_ms":3201318,"text":"每次变更后，通过 commit 得到新快照，Git 记录快照之间的变化。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3201318,"end_ms":3208277,"text":"想从一个点回到前面的点，计算哪些文件变了，就能快速返回。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3208277,"end_ms":3213000,"text":"所以模型改了东西，你不满意，可以回退。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3213000,"end_ms":3223662,"text":"图里每一行表示一条分支。在 Git 中，分支是虚拟概念，没有单独实体，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3223662,"end_ms":3230669,"text":"说白了是给一些 commit 加上名字或标记。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3230669,"end_ms":3239808,"text":"图中有 release、 hotfix、master 等分支。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3239808,"end_ms":3247424,"text":"merge 是把一条分支的内容跟另一条合并到一起。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3247424,"end_ms":3259000,"text":"整个版本控制结构，就是把 commit 按一定关系连接起来，再加上分支名称。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3259000,"end_ms":3266096,"text":"对大家来说，告诉模型“用 Git 帮我管理”，它用得比你熟练。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3266096,"end_ms":3273651,"text":"只要记得每次修改后 git commit，版本控制就不会是大问题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3273651,"end_ms":3278000,"text":"也不用担心之前写好的某个功能被改没了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3278000,"end_ms":3283571,"text":"这里还有两页数据库内容，刚才跳过了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3283571,"end_ms":3292548,"text":"之前讲的是与数据库之间的序列化， 现在再简单讲数据库是什么。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3292548,"end_ms":3301524,"text":"它像 Excel 一样存放数据， 便于快速查找、分析、管理。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3301524,"end_ms":3310810,"text":"为什么不用 Excel？也可以用， 但数据量、并发量特别大时，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3310810,"end_ms":3321952,"text":"响应可能不如数据库。数据库能轻松处理千万行数据， 也支持很多用户同时读写；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3321952,"end_ms":3330000,"text":"Excel 不一定能做到。关系型数据库查询也更高效。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3330000,"end_ms":3335907,"text":"大多数需要永久存储的小型数据，推荐放数据库。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3335907,"end_ms":3345037,"text":"大文件，比如视频、游戏等， 要放到专门的存储里〔原转写为“main”，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3345037,"end_ms":3352019,"text":"工具名待核〕；一些访问特别高频的数据放 Redis。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3352019,"end_ms":3359000,"text":"之后给大家的模板项目已经接好数据库，用起来比较方便。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3359000,"end_ms":3363675,"text":"读数据库，无非看行和列。一行是一组数据，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3363675,"end_ms":3368818,"text":"比如一个学生的姓名、年龄、学号、身高、体重；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3368818,"end_ms":3377000,"text":"一列是一类信息，比如所有人的姓名、 所有人的年龄，跟 Excel 一样。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3377000,"end_ms":3383053,"text":"数据库每一列都有类型，比如整数、字符串、时间，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3383053,"end_ms":3388316,"text":"所以不能把字符串放到数字类型的价格列里。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3388316,"end_ms":3394895,"text":"但这里基本是基础类型，而不是我们自定义的复杂类型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3394895,"end_ms":3400947,"text":"主键是每一行独一无二的标识，推荐每张表都使用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3400947,"end_ms":3407263,"text":"即使不专门说，模型通常也会帮你写。主键的意义是，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3407263,"end_ms":3412000,"text":"同一张表里任意两行的主键值不能相同。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3412000,"end_ms":3420571,"text":"如果把学号当主键， 那么同一个学号只会对应一行，不会出现两行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3420571,"end_ms":3426000,"text":"这样可以通过主键快速定位、追踪这个人。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3426000,"end_ms":3431967,"text":"还有外键。我犹豫过要不要讲，觉得学不学不是特别关键，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3431967,"end_ms":3440000,"text":"但还是简单介绍：如果一个表的某一列 引用另一张表的主键，这一列就是外键。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3440000,"end_ms":3463143,"text":"比如学生信息表以学号为主键， 另一张表某一列也用这个学号，就可以作为外键，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3463143,"end_ms":3475357,"text":"通过它找到学生信息。有时候这也很重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3475357,"end_ms":3485000,"text":"下面开始签到，大家准备好了吗？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3485000,"end_ms":3498224,"text":"快一点。还有没准备好的可以举手。大家都准备好了？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3498224,"end_ms":3512000,"text":"有同学肯定想赌一赌，那我们不能选 A，选一个 B。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3512000,"end_ms":3531747,"text":"板上写的是 B。大家都填了吗？ 谁没填可以举手，课后来补一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3531747,"end_ms":3547544,"text":"数据库讲完了，后端的一些重要要求也大概过了一遍。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3547544,"end_ms":3564000,"text":"下面开始看前端。之前大概提过，前端更关注数据交互。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3564000,"end_ms":3571175,"text":"大家肯定听过 JavaScript。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3571175,"end_ms":3583930,"text":"现在模型能力很强，看最新 Demo， 可以用它做电影、酷炫的视频，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3583930,"end_ms":3597483,"text":"甚至整个游戏。有人说它像新时代的汇编， 我觉得很贴切：能做很底层的事，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3597483,"end_ms":3605853,"text":"但也有像汇编一样难读、容易绕在一起的问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3605853,"end_ms":3618210,"text":"对较大系统，这样就容易出问题， 所以有了 TypeScript。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3618210,"end_ms":3621000,"text":"它是什么意思？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3621000,"end_ms":3629169,"text":"可以把它理解成 type-safe JavaScript，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3629169,"end_ms":3634803,"text":"也就是类型安全的 JavaScript。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3634803,"end_ms":3644662,"text":"类型安全非常重要，希望 JavaScript 不仅强大，也拥有强类型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3644662,"end_ms":3648042,"text":"但它的“革命”并不彻底，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3648042,"end_ms":3656493,"text":"没有在 JavaScript 底层加入一个真正的强类型内核，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3656493,"end_ms":3661000,"text":"而是简单理解为在上面加类型标签。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3661000,"end_ms":3668233,"text":"最后 TypeScript 还是编译成 JavaScript，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3668233,"end_ms":3673833,"text":"所以转换不是特别彻底，仍有问题。但它现在很流行，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3673833,"end_ms":3678033,"text":"也是我们能使用的较好的前端底层语言。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3678033,"end_ms":3682233,"text":"代码由 AI 写，大家不一定自己看。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3682233,"end_ms":3688533,"text":"我们会在 TypeScript 基础上用 React。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3688533,"end_ms":3696000,"text":"TypeScript 像底层语言， 负责定义变量、循环等基本操作。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3696000,"end_ms":3706880,"text":"只用 TypeScript 这种有类型的语言实现前端，仍然不够。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3706880,"end_ms":3719460,"text":"不只是风格、样式、组件这些问题， 更重要的是前端要实现一个有时间概念的系统，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3719460,"end_ms":3730000,"text":"而 TypeScript 本身没有提供这里所说的时间变化模型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3730000,"end_ms":3735952,"text":"所以要用 React。名字很重要：先有 Java，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3735952,"end_ms":3744762,"text":"觉得它太慢、太啰嗦、太工整， JavaScript 就做得更灵活、更像汇编；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3744762,"end_ms":3751190,"text":"觉得它做得不好，就要类型安全的 JavaScript，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3751190,"end_ms":3758333,"text":"也就是 TypeScript。 那么 React 是什么意思？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3758333,"end_ms":3765952,"text":"响应式，reactive。 课程要求用 React，不用 Vue；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3765952,"end_ms":3774524,"text":"不是说 Vue 不好，而是我觉得 React 更函数式，用函数展示数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3774524,"end_ms":3781667,"text":"虽然现在 AI 做前端比较好， 也常说前端工程师工资比后端低，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3781667,"end_ms":3785000,"text":"但前端模型其实比后端更复杂。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3785000,"end_ms":3797974,"text":"至少多了一个时间维度： 后端这里看作纯函数计算，而前端东西会随时间改变。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3797974,"end_ms":3810578,"text":"比如肯德基“疯狂星期四”的鸡腿、 鸡翅库存，十点多少，十点零一分多少，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3810578,"end_ms":3817991,"text":"十点零二分多少，不断变化，不是固定数字。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3817991,"end_ms":3828000,"text":"我们这里讨论的后端纯函数计算，没有这个额外的时间维度。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3828000,"end_ms":3839446,"text":"后端服务把数据写入数据库，或者对数据做运算， 我们在这个模型里不引入时间概念；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3839446,"end_ms":3849386,"text":"前端则要考虑。当前端有了时间， 很多事情就不一样，例如怎么描绘库存，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3849386,"end_ms":3853000,"text":"就不能照原来的方式理解。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3853000,"end_ms":3862905,"text":"一般会说库存不就是变量吗，一开始是一，后来是二、三？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3862905,"end_ms":3869762,"text":"但它随时间改变，就不能只当普通变量。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3869762,"end_ms":3881190,"text":"变化原因很多：管理员手动修改、 进货、顾客买鸡翅、鸡翅坏掉等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3881190,"end_ms":3893000,"text":"不同时间、不同原因都可能改库存， 甚至很多事情同时修改，怎么办？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3893000,"end_ms":3895552,"text":"我们用 MVC，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3895552,"end_ms":3907991,"text":"也就是 Model、View、 Controller 的思路来理解 React。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3907991,"end_ms":3915647,"text":"虽然大家可能觉得 AI 能全做对，但实际上未必。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3915647,"end_ms":3927448,"text":"核心交互逻辑需要自己把握， 才能让关键前端内容符合心意，尤其要跟强类型结合，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3927448,"end_ms":3930000,"text":"实现想要的功能。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3930000,"end_ms":3944858,"text":"先看 MVC，分三个部分。 Controller 是用户修改数据的入口，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3944858,"end_ms":3950377,"text":"比如按某些按钮后修改数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3950377,"end_ms":3965660,"text":"View 是前端展示数据： 数据可能已在内存或服务器上，要以某种方式呈现。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3965660,"end_ms":3975000,"text":"前端关注数据展示和用户交互，但具体怎么展示？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3975000,"end_ms":3986758,"text":"要用纯函数的理念理解 React。课程一直强调纯函数，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3986758,"end_ms":3994597,"text":"React 也是用得很多的前端框架。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3994597,"end_ms":4009839,"text":"它展示数据时，尽量让展示结果是数据的纯函数： 数据不变，View 不变；","speaker":"","sentence_id":null,"words":[]},{"start_ms":4009839,"end_ms":4018548,"text":"数据变化，View 才变化。这点很重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4018548,"end_ms":4029000,"text":"我考虑的是从数据到展示的函数关系，其他先不考虑。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4029000,"end_ms":4037163,"text":"最后是 Data，也就是 MVC 的 Model。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4037163,"end_ms":4049571,"text":"接下来是我自己的理解，不是官方定义， 但这样理解有助于弄清 React 实现。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4049571,"end_ms":4061000,"text":"首先叫核心数据，是整个前端最重要的数据， 页面主要就是围绕这些数据展开。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4061000,"end_ms":4070121,"text":"装饰、修饰相对次要，重要的是想展示的核心数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4070121,"end_ms":4080034,"text":"它们往往是类型系统里的对象，比如学生、教室、课程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4080034,"end_ms":4094707,"text":"有时不能直接展示，可能不好看， 也可能需要二次修改、计算、融合之后才能展示。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4094707,"end_ms":4107000,"text":"这些基于核心数据通过函数式计算得到的东西， 我叫“展示型数据”。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4107000,"end_ms":4120455,"text":"比如有 Name、Height、 Weight，姓名、身高、体重是核心数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4120455,"end_ms":4131727,"text":"可以把 Name、Height、 Weight 拼成一个小标签，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4131727,"end_ms":4140818,"text":"表达这个人的信息；也可以用身高、体重计算一个比值，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4140818,"end_ms":4152455,"text":"再得到 healthy 或 not healthy 这两种分类。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4152455,"end_ms":4160455,"text":"也就是从基础数据出发，通过纯函数得到新数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4160455,"end_ms":4171000,"text":"这些新数据不是独立的核心， 而是随着基础数据变化的派生数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4171000,"end_ms":4183000,"text":"这就是展示型数据，可以衍生很多层。 核心数据多，就能一层层算，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4183000,"end_ms":4191400,"text":"最后才在前端页面决定某些内容放在什么位置，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4191400,"end_ms":4200200,"text":"比如今天几点小张来看病、身高多少、体重多少。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4200200,"end_ms":4213800,"text":"页面就变成一个纯粹的展示框。 看起来炫彩、多变，其实只是框里装着数据，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4213800,"end_ms":4227000,"text":"这些数据都是核心数据的函数计算结果， 也可以把中间某层的结果装进去。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4227000,"end_ms":4236545,"text":"当然，也可以直接展示核心数据。 但有时还想做一些小变换，最后呈现的内容，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4236545,"end_ms":4242000,"text":"总归是核心数据经过函数式计算得到的结果。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4242000,"end_ms":4255864,"text":"我经常用跳长绳打比方。甩一根长绳时，整条绳子其实很被动。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4255864,"end_ms":4267748,"text":"我控制绳头上下甩，运动就向前传，整条绳子跟着动。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4267748,"end_ms":4277155,"text":"这里什么是核心数据？绳头就是核心数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4277155,"end_ms":4293000,"text":"其他部分因为都在同一根绳上， 前面一动，后面只能跟着动，没有选择。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4293000,"end_ms":4302692,"text":"后面的绳子就像函数式里的展示型数据，跟着核心数据变化。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4302692,"end_ms":4309513,"text":"这大概是理解 React 的一个框架。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4309513,"end_ms":4317769,"text":"再看 Controller，用户可以修改数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4317769,"end_ms":4326026,"text":"比如页面这里有按钮、那里有文本框，能输入文字，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4326026,"end_ms":4335000,"text":"也可能有可以按、可以滑的小控件，这些都是交互入口。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4335000,"end_ms":4343000,"text":"每个交互控件，要么触发事件，这是最简单的；","speaker":"","sentence_id":null,"words":[]},{"start_ms":4343000,"end_ms":4353286,"text":"更复杂的是反过来修改核心数据。这是框架很有意思的地方。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4353286,"end_ms":4365476,"text":"核心数据可以通过后端、 网络传来的信息改变，也可以由用户交互改变。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4365476,"end_ms":4379952,"text":"中间的派生内容不能独立随意修改， 它们是“一根绳上的蚂蚱”，只有核心数据变了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4379952,"end_ms":4383000,"text":"后面才跟着变化。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4383000,"end_ms":4391795,"text":"所以叫响应式：派生数据跟着核心数据变化，再展示到前端。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4391795,"end_ms":4402220,"text":"用户继续按按钮、操作，又改变核心数据， 再一层层传下去，循环往复。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4402220,"end_ms":4409386,"text":"这些肯定让 AI 写，大家以后可能不会手写。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4409386,"end_ms":4417530,"text":"你可能觉得按按钮产生效果很神奇，其实就是这个框架。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4417530,"end_ms":4426000,"text":"之后会讲 Hooks，可以梳理出其中哪些是核心数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4426000,"end_ms":4434333,"text":"大家也许觉得没必要，那可能是因为现在做的应用简单。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4434333,"end_ms":4445000,"text":"如果做非常复杂、重要的前端， 比如金融数据展示、股票交易决策界面，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4445000,"end_ms":4455000,"text":"仍有必要梳理逻辑关系： 哪些是核心数据，哪些是根据它们派生的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4455000,"end_ms":4464470,"text":"用户每次按按钮，数据如何改变，整个链条可以很清楚。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4464470,"end_ms":4472424,"text":"前端可能漂亮、酷炫，但可以让模型分析逻辑。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4472424,"end_ms":4484167,"text":"纯函数的好处就是每层关系都能理清。 刚才同学们的作业已经很漂亮，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4484167,"end_ms":4497424,"text":"未来还会有更多设计，但在这里用 React，最终都可以按这个结构理解。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4497424,"end_ms":4505000,"text":"一旦定义好结构，页面其他内容都为它服务。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4505000,"end_ms":4513250,"text":"以前招前端工程师，我常出一道题，看设计水平。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4513250,"end_ms":4524500,"text":"现在可能不再这样招了。 其实很少有人答对，甚至资深前端工程师，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4524500,"end_ms":4535750,"text":"十个人里能答对两三个都不到。 这是个简单问题，但如果答不上来，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4535750,"end_ms":4541000,"text":"往往说明前端设计能力有问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4541000,"end_ms":4550192,"text":"假设要分页展示一千名学生的信息，比如某院系所有学生。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4550192,"end_ms":4562919,"text":"一千行一次展示，网页可能刷新太慢， 或者不想一次展示这么多，于是每页十行，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4562919,"end_ms":4576000,"text":"分一百页。这样可以，每次只给十条信息， 数据库和后端压力更小，分页处理也快。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4576000,"end_ms":4590371,"text":"还要支持上下翻页，以及按上键、下键调整当前选择的学生。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4590371,"end_ms":4609000,"text":"比如页面有十行，张三、李四、王五、 赵六等，旁边显示页码，从一到一百页。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4609000,"end_ms":4620765,"text":"这里支持的不是直接选页， 而是上一页、下一页、上一个、下一个。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4620765,"end_ms":4629392,"text":"比如当前选李四，按上键选张三，按下键选王五；","speaker":"","sentence_id":null,"words":[]},{"start_ms":4629392,"end_ms":4642725,"text":"按下一页，一下就跳到比如牛十八。 下一页整体往后十条，上一页往前十条。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4642725,"end_ms":4649000,"text":"小于零设成零，大于一千设成一千。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4649000,"end_ms":4666630,"text":"现在让大家实现，会怎么做？必须考虑 核心数据是什么、展示型数据是什么，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4666630,"end_ms":4678037,"text":"以及每个按钮怎样影响核心数据。不认真设计时，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4678037,"end_ms":4691000,"text":"可能把当前页面、页面信息、页码等全部设为核心数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4691000,"end_ms":4701387,"text":"这样想起来容易，全部一股脑显示， 但每次按按钮后就要复杂地更新很多状态。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4701387,"end_ms":4708213,"text":"其实很多都可以变成通过纯函数算出的展示型数据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4708213,"end_ms":4713258,"text":"除了学生信息本身是核心 Data，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4713258,"end_ms":4720084,"text":"这个页面特有的核心状态只需当前选择的学生序号。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4720084,"end_ms":4725426,"text":"比如张三是一号，李四二号，王五三号，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4725426,"end_ms":4735219,"text":"“牛十八”是另一个序号〔原转写举 为“1015号”，与总人数不一致，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4735219,"end_ms":4737000,"text":"保留待核〕。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4737000,"end_ms":4747620,"text":"不管按哪个按钮，都只改这个序号。 下一页加十，上一页减十，大于一千设成一千，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4747620,"end_ms":4758528,"text":"小于零设成零。根据序号，就能快速判断当前第几页， 因为用序号除以十就知道页码；","speaker":"","sentence_id":null,"words":[]},{"start_ms":4758528,"end_ms":4768000,"text":"通过取模，也能知道是第几行。 这就是 reactive 思路的优势。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4768000,"end_ms":4781437,"text":"核心数据可能比想象少得多。 用非常精简的核心数据，就能算出所需的其他信息，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4781437,"end_ms":4789648,"text":"再刷新页面。为什么要这样做，是不是玩小技巧？","speaker":"","sentence_id":null,"words":[]},{"start_ms":4789648,"end_ms":4802711,"text":"这个简单问题怎么实现都行，但很多情况下， 理顺交互逻辑、用更少核心数据，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4802711,"end_ms":4813535,"text":"前端就更不容易出 Bug。 尤其对复杂类型、复杂数据的前端，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4813535,"end_ms":4821000,"text":"大家可以尝试好好梳理整个 MVC 结构。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4821000,"end_ms":4826000,"text":"下面还有一些内容，下次课再讲。今天就讲到这里。","speaker":"","sentence_id":null,"words":[]}]};window.AUDIO_URL="https://cloud.tsinghua.edu.cn/f/00665df46385425fa2d1/?dl=1";</script>
  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const loading = $("loading");
      const error = $("error");
      const player = $("player");
      const audio = $("audio");
      const transcript = $("transcript");
      const search = $("search");
      const followButton = $("follow");
      const count = $("result-count");
      const empty = $("empty");
      const clock = $("clock");
      const durationLabel = $("duration");

      const params = new URLSearchParams(window.location.search);
      const key = params.get("key") || "";
      const id = decodeURIComponent(window.location.pathname.split("/").filter(Boolean).at(-1) || "");
      const recordingPath = `/api/recordings/${encodeURIComponent(id)}`;
      const query = `?key=${encodeURIComponent(key)}`;
      const embeddedData = window.RECORDING_DATA;
      const embeddedAudioUrl = window.AUDIO_URL;

      let segments = [];
      let rows = [];
      let activeIndex = -1;
      let activeWord = null;
      let followPlayback = true;
      let durationMs = 0;
      let filteredCount = 0;

      function formatTime(ms) {
        const seconds = Math.max(0, Math.floor(Number(ms) / 1000 || 0));
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainder = seconds % 60;
        return hours > 0
          ? `${hours}:${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`
          : `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
      }

      function normalizedText(value) {
        return String(value ?? "").normalize("NFKC").toLocaleLowerCase("zh-CN");
      }

      function showError(message) {
        loading.hidden = true;
        player.hidden = true;
        error.hidden = false;
        $("error-message").textContent = message;
      }

      function normalizeSegment(item) {
        const start = Number(item.start_ms);
        const end = Number(item.end_ms);
        if (!Number.isFinite(start) || start < 0 || !Number.isFinite(end) || end < start) return null;
        const words = Array.isArray(item.words)
          ? item.words.map((word) => ({
            start_ms: Number(word.start_ms),
            end_ms: Number(word.end_ms),
            text: String(word.text ?? "")
          })).filter((word) => Number.isFinite(word.start_ms) && word.start_ms >= 0 && Number.isFinite(word.end_ms) && word.end_ms >= word.start_ms && word.text)
          : [];
        return {
          start_ms: start,
          end_ms: end,
          text: String(item.text ?? ""),
          speaker: item.speaker == null ? "" : String(item.speaker),
          words
        };
      }

      // Align timestamped words with the original sentence so punctuation and spaces remain intact.
      function appendSentence(container, segment) {
        const fragment = document.createDocumentFragment();
        let cursor = 0;
        for (const word of segment.words) {
          const position = segment.text.indexOf(word.text, cursor);
          if (position < 0) {
            container.textContent = segment.text;
            return;
          }
          fragment.append(document.createTextNode(segment.text.slice(cursor, position)));
          const span = document.createElement("span");
          span.className = "word";
          span.dataset.wordStart = String(word.start_ms);
          span.dataset.wordEnd = String(word.end_ms);
          span.textContent = word.text;
          fragment.append(span);
          cursor = position + word.text.length;
        }
        fragment.append(document.createTextNode(segment.text.slice(cursor)));
        container.append(fragment);
      }

      function renderTranscript() {
        const fragment = document.createDocumentFragment();
        rows = segments.map((segment, index) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "segment";
          row.dataset.index = String(index);
          row.setAttribute("aria-label", `${formatTime(segment.start_ms)} ${segment.speaker ? `${segment.speaker}：` : ""}${segment.text}`);

          const time = document.createElement("time");
          time.textContent = formatTime(segment.start_ms);
          const body = document.createElement("span");
          body.className = "segment-body";
          if (segment.speaker) {
            const speaker = document.createElement("span");
            speaker.className = "speaker";
            speaker.textContent = segment.speaker;
            body.append(speaker);
          }
          const sentence = document.createElement("span");
          if (segment.words.length) appendSentence(sentence, segment);
          else sentence.textContent = segment.text;
          body.append(sentence);
          row.append(time, body);
          fragment.append(row);
          return row;
        });
        transcript.replaceChildren(fragment);
        filterTranscript();
      }

      function filterTranscript() {
        const term = normalizedText(search.value.trim());
        filteredCount = 0;
        rows.forEach((row, index) => {
          const segment = segments[index];
          const visible = !term || normalizedText(`${segment.speaker} ${segment.text}`).includes(term);
          row.hidden = !visible;
          if (visible) filteredCount += 1;
        });
        count.textContent = term ? `找到 ${filteredCount} 条 · 共 ${rows.length} 条` : `共 ${rows.length} 条`;
        empty.hidden = filteredCount !== 0;
        transcript.hidden = filteredCount === 0;
      }

      function indexAt(ms) {
        let low = 0;
        let high = segments.length - 1;
        let candidate = -1;
        while (low <= high) {
          const middle = (low + high) >> 1;
          if (segments[middle].start_ms <= ms) {
            candidate = middle;
            low = middle + 1;
          } else {
            high = middle - 1;
          }
        }
        return candidate >= 0 && ms <= segments[candidate].end_ms ? candidate : -1;
      }

      function scrollToRow(row) {
        if (!row || row.hidden) return;
        const upper = row.offsetTop - transcript.offsetTop;
        const lower = upper + row.offsetHeight;
        const currentUpper = transcript.scrollTop;
        const currentLower = currentUpper + transcript.clientHeight;
        if (upper < currentUpper || lower > currentLower) {
          transcript.scrollTo({ top: Math.max(0, upper - transcript.clientHeight * .35), behavior: "smooth" });
        }
      }

      function updateCurrent() {
        const ms = audio.currentTime * 1000;
        clock.textContent = `${formatTime(ms)} / ${formatTime(durationMs)}`;
        const index = indexAt(ms);
        if (index !== activeIndex) {
          if (activeIndex >= 0) {
            rows[activeIndex].classList.remove("active");
            rows[activeIndex].removeAttribute("aria-current");
          }
          activeIndex = index;
          if (index >= 0) {
            rows[index].classList.add("active");
            rows[index].setAttribute("aria-current", "true");
            if (followPlayback) scrollToRow(rows[index]);
          }
        }

        if (activeWord) activeWord.classList.remove("word-active");
        activeWord = null;
        if (index >= 0) {
          const words = rows[index].querySelectorAll("[data-word-start]");
          for (const word of words) {
            if (ms >= Number(word.dataset.wordStart) && ms <= Number(word.dataset.wordEnd)) {
              activeWord = word;
              word.classList.add("word-active");
              break;
            }
          }
        }
      }

      function seekTo(ms) {
        const seconds = Math.max(0, ms / 1000);
        audio.currentTime = seconds;
        updateCurrent();
        const playback = audio.play();
        if (playback && typeof playback.catch === "function") playback.catch(() => {});
      }

      async function load() {
        error.hidden = true;
        player.hidden = true;
        loading.hidden = false;
        $("audio-error").hidden = true;
        if ((!embeddedData || !embeddedAudioUrl) && (!id || !key)) {
          showError("播放链接不完整。请从课程页面重新打开。");
          return;
        }
        try {
          let data = embeddedData;
          if (!data) {
            const response = await fetch(`${recordingPath}/public${query}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            data = await response.json();
          }
          if (!data || !Array.isArray(data.segments)) throw new Error("Invalid transcript");

          segments = data.segments.map(normalizeSegment).filter(Boolean)
            .sort((a, b) => a.start_ms - b.start_ms);
          durationMs = Number(data.duration_ms) || 0;
          if (!durationMs && segments.length) durationMs = segments.at(-1).end_ms;
          $("title").textContent = String(data.title || "课堂录音");
          document.title = `${$("title").textContent} · 逐字稿`;
          durationLabel.textContent = durationMs ? `录音时长 ${formatTime(durationMs)}` : "点击逐字稿回听";
          clock.textContent = `00:00 / ${formatTime(durationMs)}`;
          audio.src = embeddedAudioUrl || `${recordingPath}/audio${query}`;
          renderTranscript();
          loading.hidden = true;
          player.hidden = false;
        } catch (_) {
          showError("录音或逐字稿暂时无法加载。请检查链接是否有效，然后重试。");
        }
      }

      transcript.addEventListener("click", (event) => {
        const row = event.target.closest(".segment");
        if (!row) return;
        const segment = segments[Number(row.dataset.index)];
        const word = event.target.closest("[data-word-start]");
        seekTo(word ? Number(word.dataset.wordStart) : segment.start_ms);
      });
      search.addEventListener("input", filterTranscript);
      search.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          search.value = "";
          filterTranscript();
        }
      });
      followButton.addEventListener("click", () => {
        followPlayback = !followPlayback;
        followButton.setAttribute("aria-pressed", String(followPlayback));
        if (followPlayback && activeIndex >= 0) scrollToRow(rows[activeIndex]);
      });
      audio.addEventListener("timeupdate", updateCurrent);
      audio.addEventListener("seeked", updateCurrent);
      audio.addEventListener("loadedmetadata", () => {
        if (!durationMs && Number.isFinite(audio.duration)) {
          durationMs = Math.round(audio.duration * 1000);
          durationLabel.textContent = `录音时长 ${formatTime(durationMs)}`;
        }
        updateCurrent();
      });
      audio.addEventListener("error", () => { $("audio-error").hidden = false; });
      $("retry").addEventListener("click", load);
      load();
    })();
  </script>
</body>
