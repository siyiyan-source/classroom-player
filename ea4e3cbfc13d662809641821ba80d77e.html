第二种方式， 是用 OpenCode 这样的工具。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4155147,"end_ms":4162195,"text":"比如这是一个空目录，我运行 OpenCode。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4162195,"end_ms":4169848,"text":"这是 TUI 界面的 OpenCode，终端界面下的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4169848,"end_ms":4177260,"text":"当然，喜欢图形化界面，也可以装图形化的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4177260,"end_ms":4184325,"text":"比如这边新建一个会话，大概长这个样子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4184325,"end_ms":4193052,"text":"主要有一个需要提前配置的地方，就是把大模型的 API，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4193052,"end_ms":4197000,"text":"或者第三方接口配上。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4197000,"end_ms":4205171,"text":"另外需要注意，这些 Agent 工具都有工作区的概念。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4205171,"end_ms":4215332,"text":"所谓工作区，可以认为是以某一个目录， 作为装它所有东西的地方。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4215332,"end_ms":4224781,"text":"还是刚才的任务，我直接跟它说。 我这边用的是 Kimi K3。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4224781,"end_ms":4233000,"text":"你会发现，给它说一个东西之后，它首先会进入思考。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4233000,"end_ms":4241355,"text":"思考完以后，它说的话有时候还挺有意思， 好像自说自话地开始干事情。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4241355,"end_ms":4247821,"text":"它说：“我来写一个命令行待办事项工具，使用 Python，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4247821,"end_ms":4254000,"text":"这样可以做到零依赖，数据存在 JSON 文件当中。”","speaker":"","sentence_id":null,"words":[]},{"start_ms":4254000,"end_ms":4263284,"text":"JSON 文件，大家熟悉吗？ 现在网上很多数据文件都用 JSON 格式。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4263284,"end_ms":4268824,"text":"JSON 是 JavaScript Object Notation，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4268824,"end_ms":4275889,"text":"就是 JavaScript 语言写数组、写字典的那种语法。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4275889,"end_ms":4283336,"text":"换句话说， JSON 里面的数据粘到 JavaScript 程序里面，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4283336,"end_ms":4291603,"text":"是可运行的，它借用了这个东西。 Python 的语法其实也可以，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4291603,"end_ms":4301000,"text":"好像也有一个叫什么 Python， 还是叫什么的格式，只不过没流行起来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4301000,"end_ms":4307386,"text":"跑到这儿就结束了，我们看一下大概做了什么。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4307386,"end_ms":4316166,"text":"它首先思考了三十多秒， 说要用 Python 写一个命令行待办工具。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4316166,"end_ms":4325474,"text":"它开始 write，意思是调用写文件的工具， 写了一个 todo.py 文件。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4325474,"end_ms":4333000,"text":"这个文件整体就是生成程序的主体，一共一百四十多行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4333000,"end_ms":4339934,"text":"大家发现，Agent 生成代码之后，还做了什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":4339934,"end_ms":4347387,"text":"它还尝试生成的代码到底是不是好用。它演示命令，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4347387,"end_ms":4354000,"text":"python3 todo.py，真的去执行这条命令了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4354000,"end_ms":4367997,"text":"买菜、写周报、健身三十分钟。 然后出错了，为什么会出错？","speaker":"","sentence_id":null,"words":[]},{"start_ms":4367997,"end_ms":4378236,"text":"我们看看它有没有检查出来。它改了什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":4378236,"end_ms":4393242,"text":"把原来直接 json.loads， 改成了 todos 等于 json.load 这个东西，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4393242,"end_ms":4397000,"text":"然后外面套上了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4397000,"end_ms":4403843,"text":"主要做了兼容旧格式、补齐缺失字段。这是什么意思？","speaker":"","sentence_id":null,"words":[]},{"start_ms":4403843,"end_ms":4412117,"text":"因为上课之前，我用大模型跑过一遍这个场景， 当时生成过一段程序。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4412117,"end_ms":4416713,"text":"那段程序的数据文件保存在用户目录下，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4416713,"end_ms":4424144,"text":"Linux 或者苹果底下叫波浪号。 Windows 底下叫什么百分号，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4424144,"end_ms":4430323,"text":"什么 user，好像是。底下的文件叫 .todo.json，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4430323,"end_ms":4434000,"text":"所以文件里面本来有旧东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4434000,"end_ms":4446731,"text":"第一次出错以后，它发现了问题， 多加了一段兼容旧格式的代码。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4446731,"end_ms":4458206,"text":"之后就写好了。它本来只加了买菜、写周报、健身这三条，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4458206,"end_ms":4471000,"text":"第一条 play，就是刚才说的历史遗留数据。 大家可以看一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4471000,"end_ms":4480875,"text":"这个 play 实际上跟后面的格式不一样。 别的就没什么了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4480875,"end_ms":4491000,"text":"最后它说完成， 这时候工具已经写在这个位置，是零依赖的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4491000,"end_ms":4497250,"text":"Python 可以直接运行。相应的功能，它画了张表，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4497250,"end_ms":4503951,"text":"包括设计细节都给出来了：数据存在哪里，编号怎么维护，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4503951,"end_ms":4512044,"text":"列表里面已经完成的事件怎么显示。 加载的时候还做了旧格式兼容，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4512044,"end_ms":4520137,"text":"主要是把 title 转换成 text。 还有错误处理，编号不存在等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4520137,"end_ms":4528062,"text":"另外，它还多做了一点事情， 如果想直接敲 todo，它给了一个建议，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4528062,"end_ms":4531000,"text":"还是挺会发散思维的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4531000,"end_ms":4539708,"text":"帮你想了很多，还是比较周到。 可以在命令行下用一个 alias，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4539708,"end_ms":4546657,"text":"后面就直接用 todo 什么什么，就可以直接用了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4546657,"end_ms":4555747,"text":"大家可以看到，刚才我就输入一行字， 它调用大模型，花了一分多钟，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4555747,"end_ms":4564191,"text":"就把事情做好了。后面想继续发挥，还可以继续跟它对话。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4564191,"end_ms":4569000,"text":"这个时候，人的角色变成了什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":4569000,"end_ms":4576721,"text":"第一，把任务委托给它，通过自然语言描述把任务交给它。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4576721,"end_ms":4586246,"text":"第二，它说做完了，你要试一下， 做验证。这两种方式可以做些对比。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4586246,"end_ms":4594530,"text":"比如上下文范围，显然项目式的方式， 上下文可以是整个项目。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4594530,"end_ms":4603942,"text":"当然，项目可能太长，不一定取得到整个项目， 但它可以达到整个项目。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4603942,"end_ms":4608000,"text":"而网页版，只限于对话里面。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4608000,"end_ms":4617224,"text":"迭代速度也是， 网页版经常需要自己手工操作，复制下来再改。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4617224,"end_ms":4625914,"text":"项目式的 Agent，自己会不断迭代。 人的角色自然不一样，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4625914,"end_ms":4632000,"text":"第二种方式，人需要参与的环节会更少。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4632000,"end_ms":4641131,"text":"后面做项目，需要注意一些问题。 一个是使用规范和学术诚信，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4641131,"end_ms":4648771,"text":"项目全程保留和 AI 的交互记录。审查，刚才说过，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4648771,"end_ms":4658648,"text":"要理解每一处关键改动。还有安全， 大家注意，是有可能扣分的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4658648,"end_ms":4668400,"text":"交上来的仓库，如果带着 API Key、 清华邮箱密码，这些肯定要扣分，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4668400,"end_ms":4675683,"text":"也不能进入提示词。AI 引入的依赖需要审查。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4675683,"end_ms":4685000,"text":"还有合规，如果生成代码用了开源软件， 一定注意不同开源软件的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4685000,"end_ms":4692814,"text":"License，要求是不一样的。 有些 License 有传染性，比如 GPL，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4692814,"end_ms":4699434,"text":"你用了它，自己也得是它。类似地，引用 AI 生成内容，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4699434,"end_ms":4707000,"text":"也要如实说明。这里体现的原则是， 对代码质量负责的始终是人，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4707000,"end_ms":4713328,"text":"不是 AI。最近还有另外一个事情，就是医生看病。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4713328,"end_ms":4719545,"text":"现在大模型在某些疾病领域，可能比一般大夫做得还好，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4719545,"end_ms":4727850,"text":"但不可能直接让 AI 看病。 因为什么？如果看坏了，到底谁负责？","speaker":"","sentence_id":null,"words":[]},{"start_ms":4727850,"end_ms":4737000,"text":"没有负责的人。医生是要签字的， 签字就有一份责任，出问题了，要来负责。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4737000,"end_ms":4747108,"text":"整个课程项目，今天发布，要独立完成。 每个人一个项目，可以讨论，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4747108,"end_ms":4754409,"text":"鼓励相互讨论，但不能合作开发。要有完整功能，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4754409,"end_ms":4764829,"text":"软件规模可以是小型的，但是要有始有终， 是一个相对完整的功能集合。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4764829,"end_ms":4775000,"text":"开发过程应全程 AI 辅助， 并完整记录过程。时间线是今天发布选题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4775000,"end_ms":4781251,"text":"下一讲之前提交选题计划，下一讲也会做点评。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4781251,"end_ms":4785995,"text":"后面第三到第六讲，分别设置检查点，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4785995,"end_ms":4794479,"text":"差不多到十一月二十九日最终提交。 时间点后面可能还会有变动，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4794479,"end_ms":4801665,"text":"我们前后调了几版，我这个 PPT 可能也不见得是最新的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4801665,"end_ms":4808865,"text":"大家最后都以课程网站为准。大概有这样一个安排。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4808865,"end_ms":4814000,"text":"今天的任务，就是做选题和启动工作。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4814000,"end_ms":4822736,"text":"需要提交什么东西？ 选题是提交一个 Markdown 吗？还是怎么发？","speaker":"","sentence_id":null,"words":[]},{"start_ms":4822736,"end_ms":4828841,"text":"Markdown 里面有一个，另外有一个 AI 文件夹。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4828841,"end_ms":4837292,"text":"希望大家在第一次提交之前， 这个文件夹里面有使用 AI 的初步效果。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4837292,"end_ms":4843928,"text":"相当于大家可以在 AI 辅助下，把项目描述整理出来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4843928,"end_ms":4851705,"text":"当然，一定要有这些：解决什么问题， 给谁用，核心功能包括什么，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4851705,"end_ms":4860000,"text":"还有技术栈和 AI 工具的选择。 大家注意，不能任由它自由发挥。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4860000,"end_ms":4866753,"text":"选一个自己根本没学过的语言，后面就吃苦头了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4866753,"end_ms":4875526,"text":"东西出点问题，你看都没法看。 今天做好环境配置，做一次体验，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4875526,"end_ms":4883145,"text":"代码仓库可以建起来。另外，比较具体的任务分解计划，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4883145,"end_ms":4890475,"text":"不在这次检查点，后面慢慢来。包括今天立项的题目，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4890475,"end_ms":4898844,"text":"下周反馈之后觉得问题比较大， 甚至重新推倒再来也不是不可以，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4898844,"end_ms":4903000,"text":"不用一定追求这次多么完美。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4903000,"end_ms":4912127,"text":"没关系，咱们都是动态推进的过程。 这是第一个检查点的相应内容。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4912127,"end_ms":4921032,"text":"前面做了一次调研， 我发现好像只有一位同学选了“已经有成熟的想法”","speaker":"","sentence_id":null,"words":[]},{"start_ms":4921032,"end_ms":4929993,"text":"。我不知道是谁， 哪位同学选了有成熟想法？给大家分享一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4929993,"end_ms":4934000,"text":"行，没事，我先接着往下说。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4934000,"end_ms":4940707,"text":"能选的东西很多，PPT 上说了一些， 网站上有更详细的指导。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4940707,"end_ms":4945667,"text":"比如做一个命令行小工具，像刚才的 Todo。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4945667,"end_ms":4952796,"text":"当然，如果只有那些功能， 就显得太单薄了，可以搞得丰富一点。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4952796,"end_ms":4955000,"text":"还有一些小游戏。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4955000,"end_ms":4962881,"text":"我们家小朋友暑假参加了清华附 中组织的一个人工智能夏令营，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4962881,"end_ms":4972282,"text":"他在附小。第一次接触 Vibe Coding， 回来说这个东西实在太好了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4972282,"end_ms":4981049,"text":"他特别喜欢小汽车， 就 Vibe Coding 了一个汽车停车入库的小游戏，","speaker":"","sentence_id":null,"words":[]},{"start_ms":4981049,"end_ms":4990000,"text":"天天对着电脑许愿，玩得不亦乐乎。 大家有感兴趣的，也可以做。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4990000,"end_ms":4996004,"text":"还有对学习、科研有帮助的，数据处理和可视化。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4996004,"end_ms":5001751,"text":"当然，肯定要形成一个产品。不是有一份数据，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5001751,"end_ms":5008422,"text":"把它处理或者可视化一下就行，而是形成一个软件或产品，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5008422,"end_ms":5015709,"text":"某一类数据过来，这个流程可以走完。 比如天格、帕拉里面，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5015709,"end_ms":5021713,"text":"看看有没有可以整理出来的工具，我觉得也可以。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5021713,"end_ms":5029000,"text":"比如网上内容爬虫加分析， 还有效率工具、学习辅助工具等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5029000,"end_ms":5035578,"text":"身边学科里面的这些，都是很好的选题背景。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5035578,"end_ms":5044492,"text":"总体来说，希望大家通过这门课写一个项目， 项目本身是有用的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5044492,"end_ms":5054574,"text":"至少对自己有用。能对班里其他同学、 学校其他同学有用，那更好；","speaker":"","sentence_id":null,"words":[]},{"start_ms":5054574,"end_ms":5059000,"text":"对更大的人群有用，那更好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5059000,"end_ms":5066688,"text":"有一些建议。一个是规模， 核心功能建议两到三天可以完成，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5066688,"end_ms":5075188,"text":"这样要留出迭代和打磨时间。 还有避坑，避免依赖外部服务的项目，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5075188,"end_ms":5082497,"text":"比如 API 配额或网络。我们暑假开发的是 Agent 工具，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5082497,"end_ms":5093000,"text":"要连接大模型。咱们这门课， 建议大家的软件里面别再连接大模型，不然挺复杂。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5093000,"end_ms":5102580,"text":"另外，要避免没有代码量的内容型项目。 比如做一个纯静态内容的网站，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5102580,"end_ms":5110267,"text":"就没什么太大意义。起步建议是从小的真实问题开始。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5110267,"end_ms":5118298,"text":"判断标准，比如到最后第八讲的时候， 你自己是不是会很欣喜，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5118298,"end_ms":5124436,"text":"想跟大家分享做项目的过程，以及这个项目？","speaker":"","sentence_id":null,"words":[]},{"start_ms":5124436,"end_ms":5130000,"text":"我觉得你想，就说明是一个很好的命题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5130000,"end_ms":5138123,"text":"今天主要讲这些：范式变革、基本原理、工具演进，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5138123,"end_ms":5149000,"text":"以及课程当中相关工具的选取。 主要任务，就是今天开始选题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5149000,"end_ms":5154847,"text":"后面博研给大家发一个，看看是问卷还是接龙。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5154847,"end_ms":5159807,"text":"大家如果在配置环境和软件使用上有问题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5159807,"end_ms":5165655,"text":"我们想这周四下午三点到五点，组织一次答疑。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5165655,"end_ms":5171241,"text":"后面发公告，大家预约一下。根据人数多少，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5171241,"end_ms":5176827,"text":"我们几位助教安排谁来值班，也提前排一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5176827,"end_ms":5185912,"text":"所以晚上博研发一下，大家有需要就报个名。 面对面比较容易沟通交流。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5185912,"end_ms":5195257,"text":"今天的内容就讲到这儿，咱们这门课、 这一段旅程，就正式开始了。下课。","speaker":"","sentence_id":null,"words":[]}]};window.AUDIO_URL="https://cloud.tsinghua.edu.cn/f/c7ddc7652a24482aa0a6/?dl=1";</script>
  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const loading = $("loading");
      const error = $("error");
      const player = $("player");
      const audio = $("audio");
      const transcript = $("transcript");
      const search = $("search");
      const followButton = $("follow");
      const count = $("result-count");
      const empty = $("empty");
      const clock = $("clock");
      const durationLabel = $("duration");

      const params = new URLSearchParams(window.location.search);
      const key = params.get("key") || "";
      const id = decodeURIComponent(window.location.pathname.split("/").filter(Boolean).at(-1) || "");
      const recordingPath = `/api/recordings/${encodeURIComponent(id)}`;
      const query = `?key=${encodeURIComponent(key)}`;
      const embeddedData = window.RECORDING_DATA;
      const embeddedAudioUrl = window.AUDIO_URL;

      let segments = [];
      let rows = [];
      let activeIndex = -1;
      let activeWord = null;
      let followPlayback = true;
      let durationMs = 0;
      let filteredCount = 0;

      function formatTime(ms) {
        const seconds = Math.max(0, Math.floor(Number(ms) / 1000 || 0));
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainder = seconds % 60;
        return hours > 0
          ? `${hours}:${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`
          : `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
      }

      function normalizedText(value) {
        return String(value ?? "").normalize("NFKC").toLocaleLowerCase("zh-CN");
      }

      function showError(message) {
        loading.hidden = true;
        player.hidden = true;
        error.hidden = false;
        $("error-message").textContent = message;
      }

      function normalizeSegment(item) {
        const start = Number(item.start_ms);
        const end = Number(item.end_ms);
        if (!Number.isFinite(start) || start < 0 || !Number.isFinite(end) || end < start) return null;
        const words = Array.isArray(item.words)
          ? item.words.map((word) => ({
            start_ms: Number(word.start_ms),
            end_ms: Number(word.end_ms),
            text: String(word.text ?? "")
          })).filter((word) => Number.isFinite(word.start_ms) && word.start_ms >= 0 && Number.isFinite(word.end_ms) && word.end_ms >= word.start_ms && word.text)
          : [];
        return {
          start_ms: start,
          end_ms: end,
          text: String(item.text ?? ""),
          speaker: item.speaker == null ? "" : String(item.speaker),
          words
        };
      }

      // Align timestamped words with the original sentence so punctuation and spaces remain intact.
      function appendSentence(container, segment) {
        const fragment = document.createDocumentFragment();
        let cursor = 0;
        for (const word of segment.words) {
          const position = segment.text.indexOf(word.text, cursor);
          if (position < 0) {
            container.textContent = segment.text;
            return;
          }
          fragment.append(document.createTextNode(segment.text.slice(cursor, position)));
          const span = document.createElement("span");
          span.className = "word";
          span.dataset.wordStart = String(word.start_ms);
          span.dataset.wordEnd = String(word.end_ms);
          span.textContent = word.text;
          fragment.append(span);
          cursor = position + word.text.length;
        }
        fragment.append(document.createTextNode(segment.text.slice(cursor)));
        container.append(fragment);
      }

      function renderTranscript() {
        const fragment = document.createDocumentFragment();
        rows = segments.map((segment, index) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "segment";
          row.dataset.index = String(index);
          row.setAttribute("aria-label", `${formatTime(segment.start_ms)} ${segment.speaker ? `${segment.speaker}：` : ""}${segment.text}`);

          const time = document.createElement("time");
          time.textContent = formatTime(segment.start_ms);
          const body = document.createElement("span");
          body.className = "segment-body";
          if (segment.speaker) {
            const speaker = document.createElement("span");
            speaker.className = "speaker";
            speaker.textContent = segment.speaker;
            body.append(speaker);
          }
          const sentence = document.createElement("span");
          if (segment.words.length) appendSentence(sentence, segment);
          else sentence.textContent = segment.text;
          body.append(sentence);
          row.append(time, body);
          fragment.append(row);
          return row;
        });
        transcript.replaceChildren(fragment);
        filterTranscript();
      }

      function filterTranscript() {
        const term = normalizedText(search.value.trim());
        filteredCount = 0;
        rows.forEach((row, index) => {
          const segment = segments[index];
          const visible = !term || normalizedText(`${segment.speaker} ${segment.text}`).includes(term);
          row.hidden = !visible;
          if (visible) filteredCount += 1;
        });
        count.textContent = term ? `找到 ${filteredCount} 条 · 共 ${rows.length} 条` : `共 ${rows.length} 条`;
        empty.hidden = filteredCount !== 0;
        transcript.hidden = filteredCount === 0;
      }

      function indexAt(ms) {
        let low = 0;
        let high = segments.length - 1;
        let candidate = -1;
        while (low <= high) {
          const middle = (low + high) >> 1;
          if (segments[middle].start_ms <= ms) {
            candidate = middle;
            low = middle + 1;
          } else {
            high = middle - 1;
          }
        }
        return candidate >= 0 && ms <= segments[candidate].end_ms ? candidate : -1;
      }

      function scrollToRow(row) {
        if (!row || row.hidden) return;
        const upper = row.offsetTop - transcript.offsetTop;
        const lower = upper + row.offsetHeight;
        const currentUpper = transcript.scrollTop;
        const currentLower = currentUpper + transcript.clientHeight;
        if (upper < currentUpper || lower > currentLower) {
          transcript.scrollTo({ top: Math.max(0, upper - transcript.clientHeight * .35), behavior: "smooth" });
        }
      }

      function updateCurrent() {
        const ms = audio.currentTime * 1000;
        clock.textContent = `${formatTime(ms)} / ${formatTime(durationMs)}`;
        const index = indexAt(ms);
        if (index !== activeIndex) {
          if (activeIndex >= 0) {
            rows[activeIndex].classList.remove("active");
            rows[activeIndex].removeAttribute("aria-current");
          }
          activeIndex = index;
          if (index >= 0) {
            rows[index].classList.add("active");
            rows[index].setAttribute("aria-current", "true");
            if (followPlayback) scrollToRow(rows[index]);
          }
        }

        if (activeWord) activeWord.classList.remove("word-active");
        activeWord = null;
        if (index >= 0) {
          const words = rows[index].querySelectorAll("[data-word-start]");
          for (const word of words) {
            if (ms >= Number(word.dataset.wordStart) && ms <= Number(word.dataset.wordEnd)) {
              activeWord = word;
              word.classList.add("word-active");
              break;
            }
          }
        }
      }

      function seekTo(ms) {
        const seconds = Math.max(0, ms / 1000);
        audio.currentTime = seconds;
        updateCurrent();
        const playback = audio.play();
        if (playback && typeof playback.catch === "function") playback.catch(() => {});
      }

      async function load() {
        error.hidden = true;
        player.hidden = true;
        loading.hidden = false;
        $("audio-error").hidden = true;
        if ((!embeddedData || !embeddedAudioUrl) && (!id || !key)) {
          showError("播放链接不完整。请从课程页面重新打开。");
          return;
        }
        try {
          let data = embeddedData;
          if (!data) {
            const response = await fetch(`${recordingPath}/public${query}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            data = await response.json();
          }
          if (!data || !Array.isArray(data.segments)) throw new Error("Invalid transcript");

          segments = data.segments.map(normalizeSegment).filter(Boolean)
            .sort((a, b) => a.start_ms - b.start_ms);
          durationMs = Number(data.duration_ms) || 0;
          if (!durationMs && segments.length) durationMs = segments.at(-1).end_ms;
          $("title").textContent = String(data.title || "课堂录音");
          document.title = `${$("title").textContent} · 逐字稿`;
          durationLabel.textContent = durationMs ? `录音时长 ${formatTime(durationMs)}` : "点击逐字稿回听";
          clock.textContent = `00:00 / ${formatTime(durationMs)}`;
          audio.src = embeddedAudioUrl || `${recordingPath}/audio${query}`;
          renderTranscript();
          loading.hidden = true;
          player.hidden = false;
        } catch (_) {
          showError("录音或逐字稿暂时无法加载。请检查链接是否有效，然后重试。");
        }
      }

      transcript.addEventListener("click", (event) => {
        const row = event.target.closest(".segment");
        if (!row) return;
        const segment = segments[Number(row.dataset.index)];
        const word = event.target.closest("[data-word-start]");
        seekTo(word ? Number(word.dataset.wordStart) : segment.start_ms);
      });
      search.addEventListener("input", filterTranscript);
      search.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          search.value = "";
          filterTranscript();
        }
      });
      followButton.addEventListener("click", () => {
        followPlayback = !followPlayback;
        followButton.setAttribute("aria-pressed", String(followPlayback));
        if (followPlayback && activeIndex >= 0) scrollToRow(rows[activeIndex]);
      });
      audio.addEventListener("timeupdate", updateCurrent);
      audio.addEventListener("seeked", updateCurrent);
      audio.addEventListener("loadedmetadata", () => {
        if (!durationMs && Number.isFinite(audio.duration)) {
          durationMs = Math.round(audio.duration * 1000);
          durationLabel.textContent = `录音时长 ${formatTime(durationMs)}`;
        }
        updateCurrent();
      });
      audio.addEventListener("error", () => { $("audio-error").hidden = false; });
      $("retry").addEventListener("click", load);
      load();
    })();
  </script>
</body>
</html>
