<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>课堂录音与逐字稿</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      --ink: #222b29;
      --muted: #68736f;
      --border: #e5e9e5;
      --accent: #216d5d;
      --accent-soft: #eaf5f0;
      --surface: #fff;
      --page: #f7f9f7;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 260px; margin: 0; }
    body { background: var(--page); color: var(--ink); line-height: 1.6; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .shell { width: 100%; max-width: 960px; margin: 0 auto; padding: clamp(12px, 3vw, 28px); }
    .card { overflow: hidden; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 28px rgba(27, 53, 43, .05); }
    .top { padding: clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--border); }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(18px, 2.8vw, 25px); line-height: 1.4; overflow-wrap: anywhere; }
    .subline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 6px; color: var(--muted); font-size: 13px; }
    .time-readout { font-variant-numeric: tabular-nums; }
    .audio-error { margin: 9px 0 0; color: #9b3f35; font-size: 13px; }
    audio { display: block; width: 100%; height: 42px; margin-top: 17px; accent-color: var(--accent); }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 13px clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--border); }
    .search-wrap { position: relative; flex: 1 1 220px; }
    .search-wrap svg { position: absolute; top: 50%; left: 12px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #search { display: block; width: 100%; height: 38px; padding: 0 13px 0 38px; border: 1px solid #d9e1dc; border-radius: 9px; outline: none; background: #fff; color: var(--ink); }
    #search:focus-visible, .quiet-button:focus-visible, .segment:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #search::placeholder { color: #8a948f; }
    .quiet-button { min-height: 38px; padding: 6px 11px; border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--accent); font-size: 13px; font-weight: 600; white-space: nowrap; }
    .quiet-button:hover { background: var(--accent-soft); }
    .quiet-button[aria-pressed="true"] { border-color: #b9d6c9; background: var(--accent-soft); }
    .result-count { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .transcript { max-height: min(62vh, 650px); min-height: 160px; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .segment { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; width: 100%; margin: 0; padding: 15px clamp(16px, 3vw, 28px); border: 0; border-bottom: 1px solid #f0f2ef; border-left: 3px solid transparent; border-radius: 0; background: transparent; color: inherit; text-align: left; }
    .segment:hover { background: #f7faf8; }
    .segment.active { border-left-color: var(--accent); background: var(--accent-soft); }
    .segment time { padding-top: 1px; color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
    .segment-body { min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
    .speaker { display: inline-block; margin-right: 7px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .word { border-radius: 3px; }
    .word:hover { background: #d1e8dc; }
    .word.word-active { background: #c4e5d4; box-shadow: 0 0 0 2px #c4e5d4; }
    .empty { padding: 44px 18px; color: var(--muted); text-align: center; font-size: 14px; }
    .state { padding: 54px 24px; text-align: center; }
    .state h2 { margin: 0 0 6px; font-size: 17px; }
    .state p { margin: 0 auto 18px; max-width: 35em; color: var(--muted); font-size: 14px; }
    .state .quiet-button { padding: 8px 18px; }
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      .shell { padding: 0; }
      .card { border-radius: 0; box-shadow: none; }
      .segment { grid-template-columns: 62px minmax(0, 1fr); gap: 5px; }
      .result-count { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="card">
      <section id="loading" class="state" role="status">
        <h2>正在打开课堂录音…</h2>
        <p>逐字稿加载后就可以点击文字回听。</p>
      </section>

      <section id="error" class="state" role="alert" hidden>
        <h2>暂时无法打开这份录音</h2>
        <p id="error-message">请稍后重试。</p>
        <button id="retry" class="quiet-button" type="button">重新加载</button>
      </section>

      <div id="player" hidden>
        <header class="top">
          <p class="eyebrow">课堂录音 · 逐字稿</p>
          <h1 id="title">课堂录音</h1>
          <div class="subline">
            <span id="duration">录音时长加载中</span>
            <span class="time-readout" id="clock">00:00 / 00:00</span>
            <span>点击逐字稿可从对应位置播放</span>
          </div>
          <audio id="audio" controls preload="metadata" aria-label="课堂录音播放器"></audio>
          <p id="audio-error" class="audio-error" role="alert" hidden>录音暂时无法播放，请稍后重新打开课程页面。</p>
        </header>

        <div class="toolbar">
          <label class="search-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg>
            <input id="search" type="search" placeholder="搜索逐字稿" aria-label="搜索逐字稿" autocomplete="off">
          </label>
          <button id="follow" class="quiet-button" type="button" aria-pressed="true" title="播放时自动定位当前句">跟随播放</button>
          <span id="result-count" class="result-count"></span>
        </div>

        <div id="transcript" class="transcript" role="region" aria-label="逐字稿"></div>
        <div id="empty" class="empty" hidden>没有找到匹配的内容。试试其他关键词。</div>
      </div>
    </div>
  </main>

ds":[]},{"start_ms":4793440,"end_ms":4803440,"text":"所以我今天早上跟邱先生他们两个人,应该会答。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4803440,"end_ms":4813440,"text":"所以我今天早上跟邱先生他们两个人,应该会答。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4813440,"end_ms":4823440,"text":"所以我今天早上跟邱先生他们两个人,应该会答。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4823440,"end_ms":4833440,"text":"第二部分,现在就像模型道路应该序列有多大,多大就是不容。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4833440,"end_ms":4843440,"text":"这是第一个例子,就是我之前给大家讲的我们的建议,原来这是一个纯并模型,右边是一个1300页模型,这两个全部是base model。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4843440,"end_ms":4853440,"text":"就是说我们选完了没有做任何的SFP,也没有做任何的RL,就是一个base模型,就选完了就来问。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4853440,"end_ms":4863440,"text":"就是第一个模型,当时选完了的时候,我就问他一斤西瓜十块,五斤西瓜多少钱,他就说一斤西瓜十块,五斤西瓜三十元,他其实是算错了,然后下面更复杂一点的,他就乱算了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4863440,"end_ms":4883440,"text":"但是文字是可以的。到了1300页的模型的时候,你看我们直接直出就问他一斤西瓜多少钱,五斤西瓜多少钱的时候,他就直接能够把这个结果写得比较好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4883440,"end_ms":4893440,"text":"一斤西瓜多少钱,五斤西瓜多少钱的时候,他就直接能够把这个结果写得比较好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4913440,"end_ms":4923440,"text":"我们其实讲点专业的东西讲一点,说来讲点好玩的事情,要不然就没法讲了,因为有时候也怕讲错一些东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4923440,"end_ms":4933440,"text":"而且现在都比较敏感了,大家上上下下左左右右都很敏感。所以我说这个,我也不想开线上的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4933440,"end_ms":4948440,"text":"这个1300,它天然就有这个能力。然后顺着这个,我其实可以带来就我刚刚给大家说的,这是那个2012年Google的Jason Wei,他当时发了一篇文章叫Emergential Biology of the Model。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4948440,"end_ms":4966440,"text":"这篇文章,其实它本质上就是Jason Wei,他就是达特莫斯的一个本科生。当时我去,2023年的时候,我去拜访他。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4966440,"end_ms":4980940,"text":"因为这篇文章他也写了,而且他还做了两个工作,2023年我去找他。那个时候我们第一次见面,在2021、2022的时候,我请他做了两次报告。做完报告以后,我觉得他讲的东西讲得非常诚实。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4980940,"end_ms":5000940,"text":"你想,那个时候他才20多岁,非常诚实。而且最关键是他思考问题思考得很深,一个本科生,思考问题思考得非常深。当时我去找他的时候,他特别nice,他说,你要不要也跟一个AnswerPick的人聊聊,就23年。我说可以啊。他说我女朋友也是AnswerPick。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5000940,"end_ms":5017440,"text":"于是他就把她的女朋友叫了进来。我们还问了好多问题,问完了以后,他就说,你们哪一个在OPI,一个在AnswerPick,你们不会互相泄露秘密吗?然后我们俩互相不聊工作。但是现在他也不怎么理我。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5017440,"end_ms":5039540,"text":"现在他敏感,但是中美都是互相不大聊的。当时我没看那篇报告,其实有点歧义,但是也给大家很多启示。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5039540,"end_ms":5053140,"text":"这是一篇纯工程的,就做了大量的实验,大概一百多个认为,各种的评估测试,就是这种模型规模上到多大的时候,它的效果会大大的提高。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5053140,"end_ms":5078740,"text":"从这几张图中,你会看到一个现象是什么呢?当这个模型到了千亿的时候,一百倍的时候,就几乎到三毛这个规模的时候,就好像突然开窍了一样。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5078740,"end_ms":5090840,"text":"这就是当时所谓的emerging ability,就是智能有限。当时大家讨论的就是,这个大模型拥有像人一样的智能有限,突然就会语言了,突然就会使用工具,变成人词了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5090840,"end_ms":5104940,"text":"而且这是基本功,这八张图里面全部都是最基础的,比如说一般的分类问题,还有一些Question and Answer,还有一些文字,还有一些QA,都是那种常识知识的内容。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5104940,"end_ms":5125440,"text":"另外还做了Rhythmic推理,就是要多多跳,像Chairman Schultz,我刚刚讲的那个先生为主,他有三个代表性的模型,一个工作就是Emerging Ability,这个应该现在差不多上万次了,大家可以去查一下,上万次以后。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5125440,"end_ms":5147440,"text":"然后还有一个工作就是PALM,就是他原来在中国训练的那个非常大的一个PALM模型,然后第三个就是签证,他是第一作的签证,所以他是一个,他真的做了有几个,后来他就跳槽去了欧克恩,反而在欧克恩我感觉他没有特别多拿出来的工作,可能在里面没有,不让他发表。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5147440,"end_ms":5170240,"text":"这是他在Google的三个Work,非常有名。反正这个工作,他就发现在很多推理的问题上,包括Instructional Boring,还有这种Math的问题上,都是,你看,包括签证的数学,都是在这种签证的计算量到了一个体量的时候,就暴涨,一下子Performance就暴涨。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5170240,"end_ms":5180139,"text":"所以这是其实当时拿到了这么一个你可以叫做大模型,好像是Skinning Up到一个维度,一个量级以后,效果就会大大提高。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5180140,"end_ms":5204640,"text":"然后2023年,Sephard就做了一个Paper,这个Paper就有点像2023年的Base Paper,他就说大模型真的有Emergent Ability,他说Emergent Ability第一个,他满足了一个属性,他其实给了一个非常Tough的定义,他说Emergent Ability必须Emerge,你必须sharply的出现了一个问题,一个能力。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5204640,"end_ms":5220580,"text":"第二个,你这个出现的能力必须是不可推测的,就是Unpredictable,就是你说我要是能预见到我有一个能力,马上慢慢来了,他说这个不叫Emergent,不叫这个有限出来,所以他当时给了这个定义。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5220580,"end_ms":5245360,"text":"当然,这个时候,他其实这篇文章就一下子就把这种结论拿出来了。首先,这个结论其实是正确的,我们可以说是一件熟悉的事,存在也不存在。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5250580,"end_ms":5260480,"text":"当这个模型发生了回升的时候,是非线性或者Discontinuous score的时候,那么它就存在,它就会有一个限。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5260480,"end_ms":5283839,"text":"什么叫非线性或者Discontinuous,其实Next Token Prediction就是一个Discontinuous,因为你下一个token是什么?是,不是,是就是1,不是就是0。所以他说因此它有。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5283840,"end_ms":5295440,"text":"但是如果它是一个Continuous或者一个线性值的时候,它其实是一个线性增长,它就是一个线性增长。所以这个呢,你想一想,好像也有道理。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5296540,"end_ms":5310420,"text":"就是当我们所有的输出就和我们人类也一样,我们的输出是一个连续值,那你输出也是一个慢慢连续在增长的。你只要那种非线性的输出,它才不是,对。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5310420,"end_ms":5322920,"text":"然后从数学上面也可以证明,比如说我们证明Next Token,假如我们每一个token我们来做prediction,每一个token我们在整个里面满足一个power law的distribution。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5322920,"end_ms":5350140,"text":"那如果是我们说,我们要做,假设这是一个Linearly,我们要选择L个token,比如说我一下子预设L个token,那你每个token你想象一下,如果我这个模型比较弱,我每个token的预设精度只有0.5,那我预设L个的精度就变成0.5的L8,那就很低了,就是一个非常低的值。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5350140,"end_ms":5365820,"text":"但是假设呢,我把每个token的平均值,我能力提高了,到了0.9,我0.9的5次方,L次方就还比较大了,这两个差距一下子就拉大了,就非常非常大了,能理解这意思吗?","speaker":"","sentence_id":null,"words":[]},{"start_ms":5365820,"end_ms":5392940,"text":"所以基本上就变成这么一个方式,就是当你,你现在可以想象,你每一个token,就是5个token,你一下子效果就拉出来了,就当然能理解这意思吗?就你每一个,你平均能力嘛,平均能力,你开始一个token差别不知道多大,但是到了5个token就一下子拉,所以他当时就有这个,当然他做了个检验,他说那如果假如你不是next token嘛,因为next token是什么意思呢?","speaker":"","sentence_id":null,"words":[]},{"start_ms":5392940,"end_ms":5414139,"text":"你只有这一个token证明预设对了才是1,你预设错都是0嘛,所以它是一个,它是一个,是一个尖锐的一个函数,但是假设我们把它改成相似度,比如说你改成add distance,改成add distance,那这个时候它就变成相似,就0.3,0.2,0.1,是吧?","speaker":"","sentence_id":null,"words":[]},{"start_ms":5414140,"end_ms":5438860,"text":"那这个时候,整个函数方式一下子变成连续方式,就不是一个跳倍方式,不再是一个看起来很emerging,但是你说没有增长也不对,它还是有增长,而且依然满足scaling性质,大家记住,依然满足scaling性质,只是没有所谓的我们看到emerging的,但是依然是scaling的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5438860,"end_ms":5458219,"text":"OK,然后后来呢,比如说像还有一种,就是我们刚才说的next token,那另外还有一种选择体,是一样的,上面选择体,那下面呢,我把它改成一个函数,连续的方式,同样的道理,你可以看到,从跳倍变成没有跳倍。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5458220,"end_ms":5475480,"text":"所以当时其实这篇文章给大家还有挺多的思考,因为当时是never not best paper,其实另一个原因对大家大模型的冲击还是有的,就是如果是现在大家上书的时候,估计股价又会掉了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5475480,"end_ms":5494280,"text":"因为当时做完了之后,就说大模型还有没有有限的,为什么我们要训那么大的模型?因为大家记得23年底是什么时候?23年底其实是Lama最热的时候,是Metanama,而且是Metanama的7B最热的时候。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5494280,"end_ms":5507880,"text":"大家还记得吗?就很多人就会说Lama的7B也够热,我们为什么要训那么大一个模型?所以当时就反映了这么多,就是大模型真的还有emergency and immunity。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5507880,"end_ms":5529080,"text":"其实到现在,我刚刚给大家一个更重要的启示,就是说这个模型它本质上不是说有这么一个阶段的function,它本质是在持续增加。它当然在持续增加,就说明你的计算增加,你的student增加,它是有效的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5529080,"end_ms":5543380,"text":"那么有效的,那就非常重要。那这时候又到了另外一个非常重要的步骤,什么叫做有效的?因为你看刚才我们说的这些,它都是一种能力,一种人类的评估。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5543380,"end_ms":5563880,"text":"你比如说我来做最后的prediction,我来做prediction accuracy,但是你在训练的过程中,你不可能天天来prediction这个accuracy。那另外一个就是很多人就会说,那我在过程中我怎么办呢?我用perception of perplexity, entropy,那你怎么来评估?","speaker":"","sentence_id":null,"words":[]},{"start_ms":5563880,"end_ms":5583280,"text":"这就涉及到另外一个问题。其实我们每一个token,就是刚才有个同学在问我们,说这个世界我们怎么用这个语言,为什么用那个语言。其实本质上这个世界上所有的token,我们在度量它的时候,我们都在用一个信息度量来降低它的n-tropics。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5583280,"end_ms":5598639,"text":"那某种角度上,我们都希望找到一种度量来降低它的loss,你可以讲降低它的loss。于是大波星的整个训练,它本质上就在降低整个全世界所有信息表示的一个loss。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5598640,"end_ms":5620980,"text":"如果你这么想的话,你突然就把全世界所有文学的训练一下子拉齐了。其实这是一个学生做的,也是JON的first author,叫杜正晓。他当时毕业完以后也在制作。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5620980,"end_ms":5632200,"text":"他是JON那篇文章的第一个,后来他就做了这篇文章,他说其实本质上我们就是在降低loss,从loss的角度上看这个问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5632200,"end_ms":5654540,"text":"这篇文章非常有意思,他当时发现了很多现象,所有的模型在这个performance上都有一个非常类似的曲线,当时他觉得是我们的模型的意思。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5654540,"end_ms":5667540,"text":"然后他就把拉马拉出来,他就看拉马这个其实也是一个,你看拉马这条曲线跟我们刚才的曲线几乎类似,而且是不同的size,都很类似。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5667540,"end_ms":5684960,"text":"那么这时候,于是他就在想,如果单纯从loss,因为所有的performance,前面我给大家看到的那个performance,阶越的越迁,我把这个模型训完了,我来评价当时的task,我看accuracy有没有跳边。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5684960,"end_ms":5697080,"text":"accuracy原来10%,跳边个80%,就跳边。但是那个你要做好过中间过程,你得把这个checkpoint拿出来,然后去应用一下,再试一下看看效果。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5697080,"end_ms":5713540,"text":"但那个就很麻烦嘛。但是我们能不能只看loss?他说,我只看loss就能看出来。然后后来发现,在很多任务上,我们直接看这个trade-in loss以及performance,这个trade-in loss当你降到一个hertz上的时候,它自然就跳边了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5713540,"end_ms":5724500,"text":"performance就跳边了。这个时候就意味着什么呢?就意味着跟你刚才说的这个token有没有连续输入,非连续,无关。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5724500,"end_ms":5736160,"text":"你是连续的,不连续的,都无关,而跟这个loss最相关。这个loss到后来惦记了后面所有的scale,都几乎在这个loss。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5736160,"end_ms":5745139,"text":"而且原来做早期的,尤其是做小模型、做一种机器学习的,可能很多人就完全不理解这个成分。为什么呢?","speaker":"","sentence_id":null,"words":[]},{"start_ms":5745139 cale and load","speaker":"","sentence_id":null,"words":[]},{"start_ms":9335940,"end_ms":9337940,"text":"第二个就是情绪上的scale and load","speaker":"","sentence_id":null,"words":[]},{"start_ms":9337940,"end_ms":9339940,"text":"那我大家都把它精读一下","speaker":"","sentence_id":null,"words":[]},{"start_ms":9339940,"end_ms":9341940,"text":"认认真真去读一下这两篇paper","speaker":"","sentence_id":null,"words":[]},{"start_ms":9341940,"end_ms":9343940,"text":"作为homework好不好","speaker":"","sentence_id":null,"words":[]},{"start_ms":9343940,"end_ms":9345940,"text":"然后反正今天课就到这里","speaker":"","sentence_id":null,"words":[]},{"start_ms":9345940,"end_ms":9367940,"text":"感谢大家","speaker":"","sentence_id":null,"words":[]}]};window.AUDIO_URL="https://cloud.tsinghua.edu.cn/f/fef75c803e5844d58807/?dl=1";</script>
  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const loading = $("loading");
      const error = $("error");
      const player = $("player");
      const audio = $("audio");
      const transcript = $("transcript");
      const search = $("search");
      const followButton = $("follow");
      const count = $("result-count");
      const empty = $("empty");
      const clock = $("clock");
      const durationLabel = $("duration");

      const params = new URLSearchParams(window.location.search);
      const key = params.get("key") || "";
      const id = decodeURIComponent(window.location.pathname.split("/").filter(Boolean).at(-1) || "");
      const recordingPath = `/api/recordings/${encodeURIComponent(id)}`;
      const query = `?key=${encodeURIComponent(key)}`;
      const embeddedData = window.RECORDING_DATA;
      const embeddedAudioUrl = window.AUDIO_URL;

      let segments = [];
      let rows = [];
      let activeIndex = -1;
      let activeWord = null;
      let followPlayback = true;
      let durationMs = 0;
      let filteredCount = 0;

      function formatTime(ms) {
        const seconds = Math.max(0, Math.floor(Number(ms) / 1000 || 0));
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainder = seconds % 60;
        return hours > 0
          ? `${hours}:${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`
          : `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
      }

      function normalizedText(value) {
        return String(value ?? "").normalize("NFKC").toLocaleLowerCase("zh-CN");
      }

      function showError(message) {
        loading.hidden = true;
        player.hidden = true;
        error.hidden = false;
        $("error-message").textContent = message;
      }

      function normalizeSegment(item) {
        const start = Number(item.start_ms);
        const end = Number(item.end_ms);
        if (!Number.isFinite(start) || start < 0 || !Number.isFinite(end) || end < start) return null;
        const words = Array.isArray(item.words)
          ? item.words.map((word) => ({
            start_ms: Number(word.start_ms),
            end_ms: Number(word.end_ms),
            text: String(word.text ?? "")
          })).filter((word) => Number.isFinite(word.start_ms) && word.start_ms >= 0 && Number.isFinite(word.end_ms) && word.end_ms >= word.start_ms && word.text)
          : [];
        return {
          start_ms: start,
          end_ms: end,
          text: String(item.text ?? ""),
          speaker: item.speaker == null ? "" : String(item.speaker),
          words
        };
      }

      // Align timestamped words with the original sentence so punctuation and spaces remain intact.
      function appendSentence(container, segment) {
        const fragment = document.createDocumentFragment();
        let cursor = 0;
        for (const word of segment.words) {
          const position = segment.text.indexOf(word.text, cursor);
          if (position < 0) {
            container.textContent = segment.text;
            return;
          }
          fragment.append(document.createTextNode(segment.text.slice(cursor, position)));
          const span = document.createElement("span");
          span.className = "word";
          span.dataset.wordStart = String(word.start_ms);
          span.dataset.wordEnd = String(word.end_ms);
          span.textContent = word.text;
          fragment.append(span);
          cursor = position + word.text.length;
        }
        fragment.append(document.createTextNode(segment.text.slice(cursor)));
        container.append(fragment);
      }

      function renderTranscript() {
        const fragment = document.createDocumentFragment();
        rows = segments.map((segment, index) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "segment";
          row.dataset.index = String(index);
          row.setAttribute("aria-label", `${formatTime(segment.start_ms)} ${segment.speaker ? `${segment.speaker}：` : ""}${segment.text}`);

          const time = document.createElement("time");
          time.textContent = formatTime(segment.start_ms);
          const body = document.createElement("span");
          body.className = "segment-body";
          if (segment.speaker) {
            const speaker = document.createElement("span");
            speaker.className = "speaker";
            speaker.textContent = segment.speaker;
            body.append(speaker);
          }
          const sentence = document.createElement("span");
          if (segment.words.length) appendSentence(sentence, segment);
          else sentence.textContent = segment.text;
          body.append(sentence);
          row.append(time, body);
          fragment.append(row);
          return row;
        });
        transcript.replaceChildren(fragment);
        filterTranscript();
      }

      function filterTranscript() {
        const term = normalizedText(search.value.trim());
        filteredCount = 0;
        rows.forEach((row, index) => {
          const segment = segments[index];
          const visible = !term || normalizedText(`${segment.speaker} ${segment.text}`).includes(term);
          row.hidden = !visible;
          if (visible) filteredCount += 1;
        });
        count.textContent = term ? `找到 ${filteredCount} 条 · 共 ${rows.length} 条` : `共 ${rows.length} 条`;
        empty.hidden = filteredCount !== 0;
        transcript.hidden = filteredCount === 0;
      }

      function indexAt(ms) {
        let low = 0;
        let high = segments.length - 1;
        let candidate = -1;
        while (low <= high) {
          const middle = (low + high) >> 1;
          if (segments[middle].start_ms <= ms) {
            candidate = middle;
            low = middle + 1;
          } else {
            high = middle - 1;
          }
        }
        return candidate >= 0 && ms <= segments[candidate].end_ms ? candidate : -1;
      }

      function scrollToRow(row) {
        if (!row || row.hidden) return;
        const upper = row.offsetTop - transcript.offsetTop;
        const lower = upper + row.offsetHeight;
        const currentUpper = transcript.scrollTop;
        const currentLower = currentUpper + transcript.clientHeight;
        if (upper < currentUpper || lower > currentLower) {
          transcript.scrollTo({ top: Math.max(0, upper - transcript.clientHeight * .35), behavior: "smooth" });
        }
      }

      function updateCurrent() {
        const ms = audio.currentTime * 1000;
        clock.textContent = `${formatTime(ms)} / ${formatTime(durationMs)}`;
        const index = indexAt(ms);
        if (index !== activeIndex) {
          if (activeIndex >= 0) {
            rows[activeIndex].classList.remove("active");
            rows[activeIndex].removeAttribute("aria-current");
          }
          activeIndex = index;
          if (index >= 0) {
            rows[index].classList.add("active");
            rows[index].setAttribute("aria-current", "true");
            if (followPlayback) scrollToRow(rows[index]);
          }
        }

        if (activeWord) activeWord.classList.remove("word-active");
        activeWord = null;
        if (index >= 0) {
          const words = rows[index].querySelectorAll("[data-word-start]");
          for (const word of words) {
            if (ms >= Number(word.dataset.wordStart) && ms <= Number(word.dataset.wordEnd)) {
              activeWord = word;
              word.classList.add("word-active");
              break;
            }
          }
        }
      }

      function seekTo(ms) {
        const seconds = Math.max(0, ms / 1000);
        audio.currentTime = seconds;
        updateCurrent();
        const playback = audio.play();
        if (playback && typeof playback.catch === "function") playback.catch(() => {});
      }

      async function load() {
        error.hidden = true;
        player.hidden = true;
        loading.hidden = false;
        $("audio-error").hidden = true;
        if ((!embeddedData || !embeddedAudioUrl) && (!id || !key)) {
          showError("播放链接不完整。请从课程页面重新打开。");
          return;
        }
        try {
          let data = embeddedData;
          if (!data) {
            const response = await fetch(`${recordingPath}/public${query}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            data = await response.json();
          }
          if (!data || !Array.isArray(data.segments)) throw new Error("Invalid transcript");

          segments = data.segments.map(normalizeSegment).filter(Boolean)
            .sort((a, b) => a.start_ms - b.start_ms);
          durationMs = Number(data.duration_ms) || 0;
          if (!durationMs && segments.length) durationMs = segments.at(-1).end_ms;
          $("title").textContent = String(data.title || "课堂录音");
          document.title = `${$("title").textContent} · 逐字稿`;
          durationLabel.textContent = durationMs ? `录音时长 ${formatTime(durationMs)}` : "点击逐字稿回听";
          clock.textContent = `00:00 / ${formatTime(durationMs)}`;
          audio.src = embeddedAudioUrl || `${recordingPath}/audio${query}`;
          renderTranscript();
          loading.hidden = true;
          player.hidden = false;
        } catch (_) {
          showError("录音或逐字稿暂时无法加载。请检查链接是否有效，然后重试。");
        }
      }

      transcript.addEventListener("click", (event) => {
        const row = event.target.closest(".segment");
        if (!row) return;
        const segment = segments[Number(row.dataset.index)];
        const word = event.target.closest("[data-word-start]");
        seekTo(word ? Number(word.dataset.wordStart) : segment.start_ms);
      });
      search.addEventListener("input", filterTranscript);
      search.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          search.value = "";
          filterTranscript();
        }
      });
      followButton.addEventListener("click", () => {
        followPlayback = !followPlayback;
        followButton.setAttribute("aria-pressed", String(followPlayback));
        if (followPlayback && activeIndex >= 0) scrollToRow(rows[activeIndex]);
      });
      audio.addEventListener("timeupdate", updateCurrent);
      audio.addEventListener("seeked", updateCurrent);
      audio.addEventListener("loadedmetadata", () => {
        if (!durationMs && Number.isFinite(audio.duration)) {
          durationMs = Math.round(audio.duration * 1000);
          durationLabel.textContent = `录音时长 ${formatTime(durationMs)}`;
        }
        updateCurrent();
      });
      audio.addEventListener("error", () => { $("audio-error").hidden = false; });
      $("retry").addEventListener("click", load);
      load();
    })();
  </script>
