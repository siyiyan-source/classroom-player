<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>课堂录音与逐字稿</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      --ink: #222b29;
      --muted: #68736f;
      --border: #e5e9e5;
      --accent: #216d5d;
      --accent-soft: #eaf5f0;
      --surface: #fff;
      --page: #f7f9f7;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 260px; margin: 0; }
    body { background: var(--page); color: var(--ink); line-height: 1.6; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .shell { width: 100%; max-width: 960px; margin: 0 auto; padding: clamp(12px, 3vw, 28px); }
    .card { overflow: hidden; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 28px rgba(27, 53, 43, .05); }
    .top { padding: clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--border); }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(18px, 2.8vw, 25px); line-height: 1.4; overflow-wrap: anywhere; }
    .subline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 6px; color: var(--muted); font-size: 13px; }
    .time-readout { font-variant-numeric: tabular-nums; }
    .audio-error { margin: 9px 0 0; color: #9b3f35; font-size: 13px; }
    audio { display: block; width: 100%; height: 42px; margin-top: 17px; accent-color: var(--accent); }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 13px clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--border); }
    .search-wrap { position: relative; flex: 1 1 220px; }
    .search-wrap svg { position: absolute; top: 50%; left: 12px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #search { display: block; width: 100%; height: 38px; padding: 0 13px 0 38px; border: 1px solid #d9e1dc; border-radius: 9px; outline: none; background: #fff; color: var(--ink); }
    #search:focus-visible, .quiet-button:focus-visible, .segment:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #search::placeholder { color: #8a948f; }
    .quiet-button { min-height: 38px; padding: 6px 11px; border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--accent); font-size: 13px; font-weight: 600; white-space: nowrap; }
    .quiet-button:hover { background: var(--accent-soft); }
    .quiet-button[aria-pressed="true"] { border-color: #b9d6c9; background: var(--accent-soft); }
    .result-count { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .transcript { max-height: min(62vh, 650px); min-height: 160px; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .segment { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; width: 100%; margin: 0; padding: 15px clamp(16px, 3vw, 28px); border: 0; border-bottom: 1px solid #f0f2ef; border-left: 3px solid transparent; border-radius: 0; background: transparent; color: inherit; text-align: left; }
    .segment:hover { background: #f7faf8; }
    .segment.active { border-left-color: var(--accent); background: var(--accent-soft); }
    .segment time { padding-top: 1px; color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
    .segment-body { min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
    .speaker { display: inline-block; margin-right: 7px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .word { border-radius: 3px; }
    .word:hover { background: #d1e8dc; }
    .word.word-active { background: #c4e5d4; box-shadow: 0 0 0 2px #c4e5d4; }
    .empty { padding: 44px 18px; color: var(--muted); text-align: center; font-size: 14px; }
    .state { padding: 54px 24px; text-align: center; }
    .state h2 { margin: 0 0 6px; font-size: 17px; }
    .state p { margin: 0 auto 18px; max-width: 35em; color: var(--muted); font-size: 14px; }
    .state .quiet-button { padding: 8px 18px; }
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      .shell { padding: 0; }
      .card { border-radius: 0; box-shadow: none; }
      .segment { grid-template-columns: 62px minmax(0, 1fr); gap: 5px; }
      .result-count { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="card">
      <section id="loading" class="state" role="status">
        <h2>正在打开课堂录音…</h2>
        <p>逐字稿加载后就可以点击文字回听。</p>
      </section>

      <section id="error" class="state" role="alert" hidden>
        <h2>暂时无法打开这份录音</h2>
        <p id="error-message">请稍后重试。</p>
        <button id="retry" class="quiet-button" type="button">重新加载</button>
      </section>

      <div id="player" hidden>
        <header class="top">
          <p class="eyebrow">课堂录音 · 逐字稿</p>
          <h1 id="title">课堂录音</h1>
          <div class="subline">
            <span id="duration">录音时长加载中</span>
            <span class="time-readout" id="clock">00:00 / 00:00</span>
            <span>点击逐字稿可从对应位置播放</span>
          </div>
          <audio id="audio" controls preload="metadata" aria-label="课堂录音播放器"></audio>
          <p id="audio-error" class="audio-error" role="alert" hidden>录音暂时无法播放，请稍后重新打开课程页面。</p>
        </header>

        <div class="toolbar">
          <label class="search-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg>
            <input id="search" type="search" placeholder="搜索逐字稿" aria-label="搜索逐字稿" autocomplete="off">
          </label>
          <button id="follow" class="quiet-button" type="button" aria-pressed="true" title="播放时自动定位当前句">跟随播放</button>
          <span id="result-count" class="result-count"></span>
        </div>

        <div id="transcript" class="transcript" role="region" aria-label="逐字稿"></div>
        <div id="empty" class="empty" hidden>没有找到匹配的内容。试试其他关键词。</div>
      </div>
    </div>
  </main>

  <script>window.RECORDING_DATA={"title":"无基础代码编程基础 第三节课","duration_ms":5413000,"segments":[{"start_ms":0,"end_ms":11200,"text":"我感觉就是可能这一次作业交完之后,对大家的实际的情况就会有更清楚的了解。","speaker":"","sentence_id":null,"words":[]},{"start_ms":11200,"end_ms":13200,"text":"大家有问题的话也要问。","speaker":"","sentence_id":null,"words":[]},{"start_ms":13200,"end_ms":26000,"text":"然后我跟助教会商量是这样,就是说,我们助教会在每个组找一些比较好的,比如说第一次作业虽然很简单,但可能也有同学做得非常好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":26000,"end_ms":36000,"text":"然后做得非常好的,我们一起看一遍,过一遍,然后把特别好的同学做的会在下一次课上给大家展示一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":36000,"end_ms":47000,"text":"我上这个课的经验就是,就是大家展示的越多,最后大家做的效果就越好,其实跟我自己讲多少关系不是特别大。","speaker":"","sentence_id":null,"words":[]},{"start_ms":47000,"end_ms":56000,"text":"有一个peer pressure的效果,或者是大家觉得,我同学也能做,我也能做,这个其实是很明显的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":56000,"end_ms":58000,"text":"所以希望大家能够好好做。","speaker":"","sentence_id":null,"words":[]},{"start_ms":58000,"end_ms":66000,"text":"那我这里的话,因为上次时间很短,我大概就5分钟就过了一下,这次我把中间的一个难点讲一讲。","speaker":"","sentence_id":null,"words":[]},{"start_ms":66000,"end_ms":78000,"text":"就是我相信大家只要能打开,因为我们应该是上周吧,已经集中的给大家把codex通好了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":78000,"end_ms":88000,"text":"但是我想强调一下,就是我在之前也说的,下一次开始,如果大家又没有把自己的三生Token按时交,助教联系你又联系不上,","speaker":"","sentence_id":null,"words":[]},{"start_ms":88000,"end_ms":96000,"text":"就要追着你求着你,求你一定要让他把钱冲上,这个我觉得是不合理的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":96000,"end_ms":106000,"text":"就是如果你又没交,按时间了,然后联系你,你又不回微信,又不仔细,那我这次就不带你了,你这次就自己冲。","speaker":"","sentence_id":null,"words":[]},{"start_ms":106000,"end_ms":110000,"text":"我觉得这个就是这样,所以大家要重视。","speaker":"","sentence_id":null,"words":[]},{"start_ms":110000,"end_ms":124000,"text":"然后我看大部分同学都应该是冲上了,还可以的嘛,那么其实要打开codex,按照我们上节课讲的,打开codex说这个话,","speaker":"","sentence_id":null,"words":[]},{"start_ms":124000,"end_ms":134000,"text":"大部分同学都是会,但是我怀疑可能,首先我想做一个性情日记本,我想设计IP,","speaker":"","sentence_id":null,"words":[]},{"start_ms":134000,"end_ms":143000,"text":"他告诉我有漫漫有团团有什么方方,然后我说我要想办法使用image jam,如果你不使用image jam,他就会拿一些方框,","speaker":"","sentence_id":null,"words":[]},{"start_ms":143000,"end_ms":150000,"text":"短三角形的给你画一个奇怪的,用sd卡画一个奇怪的图,你用image jam,他就会调一个image jam的工具,","speaker":"","sentence_id":null,"words":[]},{"start_ms":150000,"end_ms":157000,"text":"本身是另外一个模型,来生成一个漂亮的图片,然后我看了一个图片,我就说给他加一个背景,","speaker":"","sentence_id":null,"words":[]},{"start_ms":157000,"end_ms":167000,"text":"未来是要做视频的,这个时候大家应该是可以看到这个背景,但这一步可能会困难一点,因为上次我也没有去展示,","speaker":"","sentence_id":null,"words":[]},{"start_ms":167000,"end_ms":179000,"text":"这次我也不展示,我只是在强调一下是要怎么做,按照道理来说,助教应该已经给大家都发了腾讯云的API,","speaker":"","sentence_id":null,"words":[]},{"start_ms":179000,"end_ms":188000,"text":"我还强调一下大家要保护好自己的腾讯云的API的key,这个key一旦被别人拿到,比如说你的同学,你的室友,","speaker":"","sentence_id":null,"words":[]},{"start_ms":188000,"end_ms":197000,"text":"趁你不注意,你遇到了,然后室友发现了,那么如果是这样的话,他就可以把你的API拿过来自己用,","speaker":"","sentence_id":null,"words":[]},{"start_ms":197000,"end_ms":208000,"text":"然后你就不知道发生了什么,他就用没了,然后这个一定要保护好自己的key,这个是密码,跟自己的钱包一样重要,","speaker":"","sentence_id":null,"words":[]},{"start_ms":208000,"end_ms":217000,"text":"还有就是大家用的时候,我在群里面强调了,这不是我的问题,腾讯云内部的各个模型各个部门,","speaker":"","sentence_id":null,"words":[]},{"start_ms":217000,"end_ms":227000,"text":"我估计是尔虞我诈,勾心斗角,不能够统一到一个收费框架里面,所以他们其中有一个是3D模型,","speaker":"","sentence_id":null,"words":[]},{"start_ms":227000,"end_ms":235000,"text":"这一块我估计是部门做的比较好,老板就应,他就说我跟你一起支架,我是掉一次两块钱,","speaker":"","sentence_id":null,"words":[]},{"start_ms":235000,"end_ms":245000,"text":"我应该是说允许让大家掉三十次吧,当然我们也不是,基本上日常你不太会需要生成3D模型,","speaker":"","sentence_id":null,"words":[]},{"start_ms":245000,"end_ms":256000,"text":"下一次下下次作业做那个游戏,比如说我之前展示做一个愤怒的小鸟,这个时候你要用它生成一个小鸟啊,生成一个小猪啊,","speaker":"","sentence_id":null,"words":[]},{"start_ms":256000,"end_ms":264000,"text":"生成一个什么那些模型的时候,你要用3D,大部分情况下其实不一定要用,但用的时候要注意,你不要让模型循环掉,","speaker":"","sentence_id":null,"words":[]},{"start_ms":264000,"end_ms":271000,"text":"因为它万一一个晚上掉一千次,或者一万次,它要花很多钱,我们整个班就几万块钱的经费,","speaker":"","sentence_id":null,"words":[]},{"start_ms":271000,"end_ms":279000,"text":"我说了,我发现是你把,而且这个经费不仅是3D部分的,是所有的特训营的经费都在里面,","speaker":"","sentence_id":null,"words":[]},{"start_ms":279000,"end_ms":288000,"text":"所以原则上如果你不小心掉了一万次两万次之后,我们全班都没有钱,但是大家放心,我在群里写了,","speaker":"","sentence_id":null,"words":[]},{"start_ms":288000,"end_ms":298000,"text":"我已经有个Python脚本,我可以看清楚到底是谁掉的这个,可以抓住你,然后让你赔钱,所以大家千万要管住自己的模型,","speaker":"","sentence_id":null,"words":[]},{"start_ms":298000,"end_ms":307000,"text":"就是跟他说,要小心,生成3D的时候,我们最多只能生成30个,其实30个在我们课程里面肯定是够的,","speaker":"","sentence_id":null,"words":[]},{"start_ms":307000,"end_ms":318000,"text":"大家要注意,其他的都可以随便掉,其他的比如说你想用它生成音乐,生成视频,做VoTi的什么东西,","speaker":"","sentence_id":null,"words":[]},{"start_ms":318000,"end_ms":333000,"text":"或者是开个服务器什么的,其实都是可以的,但是你自己是有多少钱,300多的一个经费用完了之后就没有了,","speaker":"","sentence_id":null,"words":[]},{"start_ms":333000,"end_ms":340000,"text":"这个是限制格,这是腾讯的bug,但是我们大家尽量君子一点,小心一点,不要出这个问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":340000,"end_ms":350000,"text":"那么我们五同学现在手里应该都有自己的API,那么这句话用的会跟我这个PPT上写的不一样,","speaker":"","sentence_id":null,"words":[]},{"start_ms":350000,"end_ms":359000,"text":"因为我PPT上我是买了一个SeedDance的账户,极梦的账户,一个月200块钱,然后我把提示发进去,它就给我生成视频,","speaker":"","sentence_id":null,"words":[]},{"start_ms":359000,"end_ms":369000,"text":"但是在这个地方我们不是这样的,我们这个是什么呢,我们是在这边你要这么说,我改一改吧。","speaker":"","sentence_id":null,"words":[]},{"start_ms":369000,"end_ms":389000,"text":"生成给,我忘记我们的那个叫什么名字了,是W1吗,还是什么,忘了模型的提示词是什么了吗,","speaker":"","sentence_id":null,"words":[]},{"start_ms":389000,"end_ms":399000,"text":"来,请记得看一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":399000,"end_ms":416000,"text":"我发在群里,一共有8个可以要的模型,","speaker":"","sentence_id":null,"words":[]},{"start_ms":416000,"end_ms":431000,"text":"那么比如说我们就用可灵V6V3这个模型,然后这个是一样的,","speaker":"","sentence_id":null,"words":[]},{"start_ms":431000,"end_ms":446000,"text":"然后在下面你要讲,我已经把老师给我的模型使用的方案,这个文件放到了当前的文件夹,","speaker":"","sentence_id":null,"words":[]},{"start_ms":461000,"end_ms":474000,"text":"我发在群里的CST,你看不懂没关系,模型看得懂,","speaker":"","sentence_id":null,"words":[]},{"start_ms":474000,"end_ms":491000,"text":"请你根据参考这个调用可灵V6V3来帮我生成视频。","speaker":"","sentence_id":null,"words":[]},{"start_ms":491000,"end_ms":504000,"text":"然后你还可以讲一下说助教已经把key给了我了,但是我不想告诉你。","speaker":"","sentence_id":null,"words":[]},{"start_ms":521000,"end_ms":539000,"text":"然后我这里写的就是,大概是这个意思,可能我就随便写了,助教已经把腾讯明的key给我了,","speaker":"","sentence_id":null,"words":[]},{"start_ms":539000,"end_ms":546000,"text":"为了保证key的安全,请你假设它已经写入到了某个配置文件中,之后我会填入的,","speaker":"","sentence_id":null,"words":[]},{"start_ms":546000,"end_ms":556000,"text":"他会跟你说,好的,我来学习一下这个方案,学习完了说,好的,我来生成这个提示词,生成完了之后他就说,","speaker":"","sentence_id":null,"words":[]},{"start_ms":556000,"end_ms":564000,"text":"你直接给key他会警告你很危险,你不要这样干,要写到配置文件中,这样我不会直接读。","speaker":"","sentence_id":null,"words":[]},{"start_ms":564000,"end_ms":576000,"text":"他又会说,我已经放到了一个config.txt的配置文件,里面有个地方是key,请你把你的key复制到那个文件中,","speaker":"","sentence_id":null,"words":[]},{"start_ms":576000,"end_ms":582000,"text":"然后告诉我,然后我就会调用腾讯云生成视频。","speaker":"","sentence_id":null,"words":[]},{"start_ms":582000,"end_ms":590000,"text":"大家明白了,反正就是这么一个流程,因为也没人说不会,我也不知道大家到底会不会。","speaker":"","sentence_id":null,"words":[]},{"start_ms":590000,"end_ms":599000,"text":"反正感受一下,一旦这个事情做完之后,大家就可以干很多事情,虽然我们没有布置那么多作业,","speaker":"","sentence_id":null,"words":[]},{"start_ms":599000,"end_ms":606000,"text":"本来也是一个全校的全修课,也不需要压力那么大,但是这里面有很多很好玩的东西,","speaker":"","sentence_id":null,"words":[]},{"start_ms":606000,"end_ms":615000,"text":"比如说你可以生成音乐,可以做合成,可以做配音,而且我没有把腾讯云的所有模型都打开,","speaker":"","sentence_id":null,"words":[]},{"start_ms":615000,"end_ms":622000,"text":"如果大家需要用一些模型,也可以在群里说,只要是腾讯云的所有模型都可以用,除了3D的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":622000,"end_ms":633000,"text":"而且我在群里面讲的3D world2,Sync和Panorama,这两个是生成3D环境的,","speaker":"","sentence_id":null,"words":[]},{"start_ms":633000,"end_ms":647000,"text":"这个东西是一起继废的,只有我在群里说的HY3D 00,"text":"它不仅可以匹配这个值,它还可以匹配你的类型。当然我们这边的类型是最简单的整数型,但是未来这个变量,它很可能是一个,像我们说的,在选科系统里面,","speaker":"","sentence_id":null,"words":[]},{"start_ms":928000,"end_ms":940000,"text":"它如果是个人,那我们就会分,它是老师,还是学生,还是比如说其他的工作人员,或者是外包的人员,等等,或者是家长。","speaker":"","sentence_id":null,"words":[]},{"start_ms":940000,"end_ms":948000,"text":"我们会根据这个变量的类型进行判别,我们还可以判断它满足的一些属性之类的,等等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":948000,"end_ms":962000,"text":"总之,模式匹配这个功能非常强大,你可以匹配各种东西,之后在代码上,你看到match,你就知道,它在做分情况的讨论,老师怎么处理,学生怎么处理,家长怎么处理,等等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":962000,"end_ms":974000,"text":"这是模式匹配。然后我们讲一个稍微困难一点的东西,这个东西我们实际上不会遇到,因为这是Java里面常用的语言。","speaker":"","sentence_id":null,"words":[]},{"start_ms":974000,"end_ms":984000,"text":"但是我们通过这个来给大家引入,让大家感受我们如何处理,遇到这样的情况,应该怎么做。","speaker":"","sentence_id":null,"words":[]},{"start_ms":984000,"end_ms":988000,"text":"所以这个我们不会真的用,但是它是个很好的例子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":988000,"end_ms":1005000,"text":"我还记得我以前念书的时候,我专门上过一个Java课,然后我这个Java老师,他感觉他对Java有宗教式的狂热,非常喜欢Java,说Java非常非常好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1005000,"end_ms":1023000,"text":"回到try-catch的机制,让我们讲一堂课,说这个东西多么多么多么好。那什么是try-catch呢?try-catch就是说,你在做一件事情的时候,总归你会遇到一些你没有意料到的情况。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1023000,"end_ms":1037000,"text":"比如说,你如果想要执行一个事情,尤其是这个事情是比较脏的,它不是一个数字的计算,它是一个跟真实世界交互的肮脏的操作。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1037000,"end_ms":1045000,"text":"比如说,你想把一个东西写到文件里,如果你想把一个东西写到文件里,你想,就可能会有各种问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1045000,"end_ms":1060000,"text":"比如说,硬盘坏了,比如说,硬盘满了,比如说,你本来想写数字,结果呢,那个,那对方出问题了,数字格式和你想象的不一样。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1060000,"end_ms":1080000,"text":"总归就是类似于,你想要做一个实际的活动,你想办一个活动,总归有各种意外会发生。而在之前,因为Java应该是98年吧,90年代的语言,在那个时候,人们会觉得这些事情,你很难美举,你怎么可能把这些事情全都一个一个说清楚呢?","speaker":"","sentence_id":null,"words":[]},{"start_ms":1080000,"end_ms":1096000,"text":"说不清楚。而且硬盘坏了这种事,你怎么能够考虑得到呢?所以呢,他会有预见性的说,要不我不直接干这事,因为干这事可能有一些灾难性的后果,可能一些意外。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1096000,"end_ms":1112000,"text":"那我试着干这个事,叫try,试着干一下。试着干一下,如果他写出成功了,我们就当什么事都没发生。如果失败了的时候呢,我就有一个东西在接他,在接他的一些问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1112000,"end_ms":1128000,"text":"比如说这个叫IoException,就是可能硬盘丢了,或者什么,硬盘突然坏了,或者number format,比如说刚才写一个数字写一个什么东西格式不正确。那这个可能会觉得跟自己没什么关系,但实际上这个还挺常见的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1128000,"end_ms":1146000,"text":"如果你真的想做一个实际的应用的话,网络呀,写数据库呀,写硬盘呀,或者是你以为这个文件是一个什么格式,结果文件不是这个格式啊,等等,这样的情况是很多的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1146000,"end_ms":1158000,"text":"就一定会遇到。所以这个try catch,它看起来就是以防万一,其实在代码里面基本上无处不在。那Java的意思呢,是说什么呢?","speaker":"","sentence_id":null,"words":[]},{"start_ms":1158000,"end_ms":1177000,"text":"是说,我管理是什么问题,反正我在这里做了一个匹配,这个匹配就跟我刚才说的match是一样的,只是它这里没有显示match。如果它发现有个意外,它根据这个意外是什么,它会进行不同的处理。这里的话是把它打印,这也非常棒啊。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1177000,"end_ms":1195000,"text":"就这样把它打印出来。那么这事就算完了,没办法,我发现硬盘出问题了,然后把它打了出来,然后就过去了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1195000,"end_ms":1215000,"text":"那这个显然是不负责任。那么finally,finally其实我们不怎么用,但是可能Java的有的人他们会喜欢用,就说,如果你想要写这个文件,写成功了你也执行这个,写失败了你也执行这个,不管怎么样你最后都是执行这句话。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1215000,"end_ms":1232000,"text":"Anyway,那么这里有什么问题呢?这个在90年代这样的一个框架是非常先进的,至少我念本科的时候老师一直在说,我也觉得很棒。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1232000,"end_ms":1245000,"text":"现在我们看来,它最大的问题就是,这个意外不是由你掌控的。这个意外是,你也不知道会有什么意外,你感觉会有意外。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1245000,"end_ms":1262000,"text":"然后你把它揣一下,如果有意外你就接一接,接了你也没法处理,你就把它再揽一揽。所以这个exception,这个意外,它可能是乱飞的,它是不在你的掌控内。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1262000,"end_ms":1283000,"text":"你不知道会出现什么意外。所以你没有在你的代码里显示着说,有可能这个东西有意外。你在你的整个代码外面加了一个外挂,这个外挂说,可能有意外,我帮你接着。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1283000,"end_ms":1294000,"text":"这就导致整个代码非常不纯粹,非常不好。所以我们是不要用的,我们已经是2026年了,肯定是不用这种东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1294000,"end_ms":1316000,"text":"那我们要怎么做什么呢?那我们现在来看,在这个函数式里面,强力型的语言里面,我们应该怎么做这个事情。我们先看一点一点入门。实际上,这里用了try catch,但是未来我们也不是用try catch了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1316000,"end_ms":1327000,"text":"这个只是让我们一点点过度过来,让大家感受感受,到底发生了什么。那这边就是一个很清楚的,一个可能会出问题的情况。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1327000,"end_ms":1349000,"text":"它是一个什么函数呢?它是一个把一个字符串变成数字的一个函数。也就是说,如果你的字符串是,比如说,123的话,那你就应该把它变成123。如果是-5的话,就应该把它变成数字。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1349000,"end_ms":1367000,"text":"但它如果是abc的话,那这东西没法变成数字,因为它不是个数字。所以它这个就出现意外了。所以它这个地方,大家可以看到,它这个地方是integer,这是个函数。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1367000,"end_ms":1385000,"text":"函数就是把字符串这个东西变成一个数字。然后呢,它是怎么做的呢?它说,我试一试。如果出了意外,我把它变成空。如果没有出意外,我把它变成脏。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1385000,"end_ms":1400000,"text":"然后呢,我没有用那种,刚才说的非常肮脏的那种方式,就是我出了意外,我就打印一下,说出意外了。大家想想为什么这件事情很糟糕。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1400000,"end_ms":1417000,"text":"因为在实际的系统里面,你的后台是不停地在打日志,或者是它在云端服务器上,你也不知道发生了什么,它可能一分钟就打很多条日志。然后你在某一行你发现,这里有个问题,人根本看不了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1417000,"end_ms":1431000,"text":"大家明白吗?它很快就会被淹没在大量的东西里面。你不能把一些错误就直接打一行字,打到屏幕上就结束了。这个是非常不负责任的行为。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1431000,"end_ms":1447000,"text":"类似于随意打小便,就有点像那种。那么这里是什么呢?这里是它返回的东西,它不是一个int,它是一个墙类型,这里是我们会学到的最简单的墙类型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1447000,"end_ms":1463000,"text":"是什么呢?它是一个int,但是它被一个东西包住了,叫做option。我们会反复见到这样的pattern。是什么呢?我经常举的例子是外地盒子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1463000,"end_ms":1478000,"text":"一个int你直接返回,感觉不是很好。为什么?因为你这个过程是充满风险的。所以我们会返回一个盒子,就像京东的那种盒子一样。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1478000,"end_ms":1496000,"text":"然后里面会放一个int,这个叫做some盒子。另外一种盒子也是京东的盒子,外表是一样的,但里面是空的,里面什么都没有。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1496000,"end_ms":1509000,"text":"这个我们把它叫做num盒子,就是空盒子。这个的意义在哪里?大家想想,意义在哪里?这个的意义就在于,你原来返回的是一个int。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1509000,"end_ms":1523000,"text":"如果是之前搞新学竞赛的同学们肯定有过这种感触。有的时候你想处理一个东西,比如说把一个字符变成一个数,你就直接变呗,你就返回一个int呗。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1523000,"end_ms":1538000,"text":"但是你有的时候想表达一个特殊情况,比如说abc的话,你怎么办?如果你把它变成-1的话,比如我用-1表示特别的abc,你就无法分辨,到底这个字符是abc还是-1。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1538000,"end_ms":1553000,"text":"所以在实际的竞赛过程中,像我那个年代,我们经常用的方法就是把它变成一个超级大的随机数,比如说32787653,就赌我们在比赛的时候没有这样的一个数。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1553000,"end_ms":1574000,"text":"如果遇到这个数就表示做错了,如果没有遇到这个数就是正常的。但这里面有问题,我把这个意思讲出来,大家能体会吗?就是说,你用一个数,如果它返回只是int,你用一个数来代表整个过程的话呢,它是不完备的,它表达不完备。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1574000,"end_ms":1588000,"text":"你一定要有更高维度的东西来表达这个事情,你不要觉得啰嗦,这个才是正确的做法。什么意思呢?你有一个快递盒子,不管怎么样,你都会返回一个快递盒子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1588000,"end_ms":1609000,"text":"而当你正确的时候呢,它会返回一个,你打开一看里面是有个数的,如果是错误的时候,打开一看里面是空的。所以这个try catch,它其实并没有真正的就把问题给表态了,它是把这个none,这个错误往回传,告诉上一层,出错了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1609000,"end_ms":1623000,"text":"所以它用更高的维度来表达这个事情。大家有意见吗?是不是很合理?这就是为什么京东会的东西都用盒子找的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1623000,"end_ms":1644000,"text":"其实他们也有这个思想,墙内性的思想。当你做这么一个大的事情,大的企业的时候,你会发现一定是这样。哪怕你买一个很小的,比如说土改业,他也会给你一个盒子,有的时候可能给你一个特别大的盒子,拿那种空气的东西垫着,防止它乱跑。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1644000,"end_ms":1653000,"text":"这都是有原因的,它是函数式的。所以它是一个包含一个元素或者空的一个快递盒子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1653000,"end_ms":1668000,"text":"好,那我们,假设这个大家明白了,那我们现在来看下面一个。如果它是一个盒子的话,它意味着什么呢?还记得我们上一节课讲,有同学说函数式变身到底好在哪里,对吧?","speaker":"","sentence_id":null,"words":[]},{"start_ms":1668000,"end_ms":1688000,"text":"好就好在,它可以针对一个对象去描绘,你不用去搞forge,你不用去关心,比如说,如果是我们自己去maintain这个事情,像我小时候做的那 于4,y不能等于别的东西,对吧?所以关系是确定的,这个非常地优美。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3690000,"end_ms":3697000,"text":"而且对世界没有副作用,它不依赖别的东西,它对别的东西也没有任何影响。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3697000,"end_ms":3704000,"text":"大家想,我只是在这边算一算x平方是多少,我不会影响这个世界任何东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3704000,"end_ms":3713000,"text":"那什么叫副作用呢?大家可能第一次听说这个词,感觉有点怪了吧,你听说吃药会有副作用,","speaker":"","sentence_id":null,"words":[]},{"start_ms":3713000,"end_ms":3722000,"text":"什么叫函数识别是没有副作用的?简单来说就是跟这个肮脏的世界有任何接触的都是副作用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3722000,"end_ms":3731000,"text":"比如说你要读写数据,你要做人机交互,你要有网络通信,只要跟这个世界有关系的都是副作用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3731000,"end_ms":3738000,"text":"那函数识编程最大的优点就是它对这个世界没有副作用,就是没有关系。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3738000,"end_ms":3749000,"text":"大家能理解吗?意味着什么呢?意味着就是编程这个东西,它是纯粹的,但是它也没什么用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3749000,"end_ms":3758000,"text":"因为一旦一个东西对世界没有任何影响,那么你也没法让它干一些实际的东西。合理吧?","speaker":"","sentence_id":null,"words":[]},{"start_ms":3758000,"end_ms":3767000,"text":"包括我上技学系,我上的是人数无限的技学系,就是你编一个东西它没什么用,就让你没什么害。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3767000,"end_ms":3777000,"text":"就是这种东西。那么,大家就会讲,那如果我们要学函数编程,那最好还是有编用,光U美不行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3777000,"end_ms":3790000,"text":"那如果副作用是必须的呢?如果你既想保证你的函数的纯粹性,U美性,你又真的想让它有点U,该怎么办?","speaker":"","sentence_id":null,"words":[]},{"start_ms":3790000,"end_ms":3802000,"text":"那很多人就说,我就抛弃函数识的性质了。但是实际上呢,人会发现,你保持函数识的性质也是可以的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3802000,"end_ms":3816000,"text":"你把副作用推到边缘去,就是你在核心处做纯函数,然后比如说加点生数,类型变换数,在边缘处做其他任务,比如说读写数据库,复习通信等等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3816000,"end_ms":3840000,"text":"我经常画的图就类似于这样。比如说,这个地方是你的中枢和大脑,你在这里面做最纯粹的事情,这是外面的世界,你在边缘的地方做一些脏的事。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3840000,"end_ms":3851000,"text":"这样就纯粹了。这个基本上就是函数识变成了一个硬盘。我为了保持我的纯解性,我在边界做脏的事。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3851000,"end_ms":3861000,"text":"那背后的一个好处是什么呢?好处就是,至少我们对核心内容有很好的掌控,有完美的掌控,因为它是纯粹的数学。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3861000,"end_ms":3871000,"text":"现在的国内对数学做各种证明这么强大,只要它是数学的,没有什么事情是我们无法处理的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3871000,"end_ms":3881000,"text":"所以你在这个核心处你可以做非常非常庞大的系统,只有在边缘处你才会跟世界发生关系。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3881000,"end_ms":3893000,"text":"那和面向对象比的话呢,我刚才提到面向对象它整体其实是不符合时代潮流,但是它还有它的科学之处。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3893000,"end_ms":3905000,"text":"就是在我们这个系统里面,我们让面向对象来负责如何定义一个对象。如果它是个简单的,把它做成一个基础类型,比如说先生的名字,它就是一个组创。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3905000,"end_ms":3919000,"text":"如果对象复杂,就把它做成一个符合类型,比如说人的命单,它里面包含很多东西。就面向对象这一套,封装,继承,多态,这些全部扔掉,我们只把它用来定义对象。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3919000,"end_ms":3932000,"text":"而函数式编程呢,则是用它来处理数据。什么意思呢?我经常打的一个比方是,函数式编程本质是一个流水线。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3932000,"end_ms":3942000,"text":"比如说,以前我们是做汽车的流水线,小米的超级工厂,或者是做巧克力的流水线,做塑料盒子的流水线。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3942000,"end_ms":3951000,"text":"但我们现在是一个数据的流水线。数据流水线不是在说人工智能的训练,我们就纯粹是在说函数式编程到底发生了什么。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3951000,"end_ms":3970000,"text":"流水线上有一个传送带,这就是我画的一个传送带,非常传统。那么,它这个地方有一个东西,它可能在这个环节上有很多工人,这个工人是假的,可能是一个函数,或者是一个什么东西,还不一定是假的吧。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3970000,"end_ms":3987000,"text":"我画这个人让大家感受到这个东西,还有一些灵魂之类的。这个东西经过每个步骤,这个工人可能是一个模型,可能是一个函数,可能是一个什么东西,他会改变这个东西,把它变样子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3987000,"end_ms":4006000,"text":"每经过一个环节,它可能都会变样子,然后最后它可能就变成了一个机车。那么,面向对象的这个过程中,它是定义在流水线上流的这个东西是什么。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4006000,"end_ms":4026000,"text":"它是由热高机物定义的,就是由最基本的X-Las和Y-Num这两种类型定义,你只要用这两种类型,可以定义世界上所有的东西。而函数是变成的是说,在这个过程中,这里面每个人到底在干什么,它的这个环节中,它是怎么加工处理的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4026000,"end_ms":4045000,"text":"加工处理的过程是纯粹的是函数的,而对象是通过层层对比的。也就是说,他们俩合作,他们是垂直互补的。他们从这个角度,你剥夺掉面向对象里面的所有的虚函数啊什么的,那些东西全部扔掉,不准他们用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4045000,"end_ms":4060000,"text":"那这个时候,你就可以把面向对象这一套吸纳过来,成为函数是变成非常重要的一步。那这个地方我经常举的一个比喻叫什么呢?叫做以围刀果为鱼肉,人宰割。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4060000,"end_ms":4078000,"text":"就是你如果要以一个纯函数的方式来做一件事情的时候,一定要知道,谁是厨师,谁是鱼肉。这个流水线上流的这个是商品,它是鱼肉,它是不可以自己长出手长出脚来改自己的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4078000,"end_ms":4094000,"text":"你听说过,比如说肉类加工厂,一只猪它出来泡水马,偶尔把自己砍。没有这种事情。它肯定是在流水线上,然后被割割割割,就切成猪肉。所以大家不要觉得很幼稚啊,我讲的这个都是大家常犯的错误。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4094000,"end_ms":4111000,"text":"一般code review的时候大家会发现,codex非常喜欢让对象长出手和脚来改自己。这是不行的,这是不行的,你跟他好好讲,不行的,老师不允许。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4111000,"end_ms":4129000,"text":"只有这样你才有可能做出最好的系统,才能够做出大的系统。你一旦对象它有了主观能动性之后,这事就乱了。你就不知道这一刀砍的到底是它自己砍的,还是某个环节出错砍的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4129000,"end_ms":4146000,"text":"最好明确说它是没有主观能动性的,它只能静静地躺在流水线上,往前走。躺的过程,有人会砍它一刀,有人会怎么一刀。一定要理解这件事情。如果它一旦能自己改自己,那这个代码不完美。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4146000,"end_ms":4160000,"text":"这也是为什么面向对象这一套东西做不大。做得越大,这个系统越乱,它到某个地方就会触到瓶颈。而用函数式的话,你可以做得非常圆滑。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4160000,"end_ms":4177000,"text":"好,我们现在开始剪刀。大家都准备好了吗?","speaker":"","sentence_id":null,"words":[]},{"start_ms":4177000,"end_ms":4197000,"text":"那你们要扫吗?需要扫的是吧?那为什么有些东西不要扫?","speaker":"","sentence_id":null,"words":[]},{"start_ms":4197000,"end_ms":4210000,"text":"都扫好了吗?","speaker":"","sentence_id":null,"words":[]},{"start_ms":4210000,"end_ms":4234000,"text":"好了,开始了,准备了吗?你看,有同学选A,没有忍住,好的。那我们肯定要选个别的,我们选B。来来来,拉紧了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4234000,"end_ms":4244000,"text":"好,收屉。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4244000,"end_ms":4264000,"text":"那我们下面接着讲。刚才讲的这些东西,很多内容听起来是矛盾的。我又让它纯粹在做函数,当你做函数,大家想到的就是那种微积分的函数,S比方,Y比方。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4264000,"end_ms":4279000,"text":"它要跟生死之间发生关系,又要它再处理这些东西,这些东西都是,你看,如果是一只猪或者一头驴的话,那你怎么能不处理呢?这都是很脏的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4279000,"end_ms":4296000,"text":"你算一个东西是S平方,你可以说这是个函数,你把猪的脑袋切下来,或者推积下来,这些东西,就很奇怪。所以我们要引入一个非常重要的概念,叫做monad,叫做单语。它是半数学名的一个很有意思的概念。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4296000,"end_ms":4311000,"text":"它本质是告诉我们如何协调这里面的矛盾,如何让函数式编程,这个看起来非常古板,非常学究的一个东西,能够真正在实际中发挥巨大的作用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4311000,"end_ms":4333000,"text":"那么monad的本质呢,其实就是个盒子。所以刚才我们学的盒子,它是option盒子也好,就是sum和num的盒子也好,还是这种success和failure的盒子也好,本质上呢,它都是一种盒子,也就是monad。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4333000,"end_ms":4347000,"text":"但我们这里讲的monad是比较通用的,就是盒子。那么我们怎么用monad来处理副作用呢?答案是,我们可以设计一种特殊的盒子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4347000,"end_ms":4363000,"text":"就是这种盒子可以把副作用装进去。一旦副作用装进去之后呢,它就会变成薛定谔的猫。这样子的理解大家听过吧?就是那个猫就在那个盒子里,然后呢,它到底死没死,你不知道。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4363000,"end_ms":4372000,"text":"打开了你才知道它死没死,你这样没打开它就不生不死的。那我们现在这个也是。这个盒子有两个非常优美的性质。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4372000,"end_ms":4386000,"text":"第一个性质是,副作用只要装到盒子里,它就没有副作用。它会发生当前紧张,盒子被打开。就跟薛定谔的猫是一样的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4386000,"end_ms":4402000,"text":"第二个呢,其实量子力学里面也有,就是一个盒子还可以跟另外一个盒子粘一起变成一个新盒子。就是这两个性质。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4402000,"end_ms":4425000,"text":"什么意思呢?性质一,本质就是说,一旦你把副作用装到一个盒子里,你就可以掩耳盗鼻的那种感觉。可以假装盒子里的副作用不存在。对于任何一个副作用,跟世界真实的交互,不管你是想处理一个什么东西,还是很多通信,还是写硬盘,还是数据库交互,","speaker":"","sentence_id":null,"words":[]},{"start_ms":4425000,"end_ms":4441000,"text":"做任何事情,一旦它是有副作用,跟世界有关系的,你就对自己说,我已经把它装到盒子里了,它不存在。然后你就可以干别的事。只要盒子不打开,副作用就没有作用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4441000,"end_ms":4460000,"text":"这个非常非常有意思。然后呢,我们看一个例子。如果我们说,fx,它不是在算x平方,它是在做一件很肮脏的事情,我刚才说,把一个东西改到屏幕上。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4460000,"end_ms":4476000,"text":"是吧?这个非常大的副作用,因为它会影响屏幕。那我们说怎么办?我们把它装到高级的IO盒子里。IO就是我们日常会用的盒子,它比try盒子和open盒子要好一点。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4476000,"end_ms":4495000,"text":"我把它装进去了,那这个时候它就是纯粹的盒子。为什么呢?因为它没有副作用,它被装进了一个叫IO的盒子里。然后算好fx的时候,我们一旦算好了,准备好了,我们就可以把IO盒子打开。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4495000,"end_ms":4507000,"text":"把它打开的时候,它就有副作用了。它就会真的打印x加65到屏幕,然后就会在屏幕上看到那个。大家明白了吧?","speaker":"","sentence_id":null,"words":[]},{"start_ms":4507000,"end_ms":4526000,"text":"就是你先把它装进去,然后它就没有副作用了。你把它打开,它就有副作用了。这个就是推到边缘的意思。就是你定义fx和计算fx,它都是纯粹的,是纯感受。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4526000,"end_ms":4538000,"text":"但是你打开这个盒子,它是很脏的,它会跟世界有关系。大家可能就很恐慌,就感觉是有点拖了坏床地。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4538000,"end_ms":4546000,"text":"有什么用?就是,啊,你说不要打印到屏幕上,因为有副作用,你拿个盒子装起来,装起来之后你再把盒子打开,然后再打印到屏幕上。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4546000,"end_ms":4557000,"text":"意义在哪呢?意义其实就是,第二点,它的第二个性质,你可以把两个盒子粘起来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4557000,"end_ms":4570000,"text":"在Scala里面,就是flatten,就是我们刚才在这里画的,什么意思呢?就是先flatten,先把盒子打开,再把它map到一个新盒子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4570000,"end_ms":4581000,"text":"但是这里面要注意用词,它不叫打开哦,它讲的是,假设我会打开这个盒子。这都是假设,这个用词很重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4581000,"end_ms":4592000,"text":"不是说我真打开,为什么不能打开,因为一打开它就有副作用。我们说的是,假设这个盒子被打开,取到了它的纸,然后做一些处理,得到另一个纸,放到新盒子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4592000,"end_ms":4602000,"text":"这个叫flatten,这个就是所谓的把两个盒子粘起来,其实它不是特别准确,但大概意思就是,你可以对这个盒子做一些操作,变成一个新盒子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4602000,"end_ms":4612000,"text":"那这个的意义是什么呢?这个其实是我们整个纯海注视系统的关键,因为它是一个纯粹的计划。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4612000,"end_ms":4627000,"text":"什么意思呢?就是说当我们想做一个很伟大的事情,很复杂的事情,比如说我们想登上火星,我们想造长城,开通金融大运河,这是很大的一个事情。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4627000,"end_ms":4640000,"text":"那么我们可以先谋定而后动,运输帷幄,决胜心理,大家知道吗?我们先计划,我们先打开盒子取纸,运算放到另一个盒子,但是我们没有做过。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4640000,"end_ms":4650000,"text":"我们是不做这些事,因为做这些事太脏了,不是我们该做的,我们只计划,我们不做。大家明白吗?没有真正实现。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4650000,"end_ms":4659000,"text":"所以这是一个非常理想的,把两个可能有负责的东西连起来,因为在整个过程中是不会有任何负责的,都是纯粹的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4659000,"end_ms":4673000,"text":"那举个例子,比如说我们在自己的系统里面,我们想实现这样的事情,从屏幕中读入字库串A,从数据库中读入字库串B,然后打印A加B到屏幕。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4673000,"end_ms":4680000,"text":"大家看,充分的脏的操作,又要从屏幕中读,又要从数据库里面读,还要打印到屏幕。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4680000,"end_ms":4693000,"text":"所以我们把它装到盒子里就不一样了。把它粘起来。我们先用IO的盒子把第一步读取屏幕的装到盒子里,","speaker":"","sentence_id":null,"words":[]},{"start_ms":4693000,"end_ms":4707000,"text":"然后我用FlatMap把它粘起来,然后我再把读数据库的放到盒子里,再用FlatMap把它粘起来,再把A加B的东西打印到屏幕这个操作里,放到盒子里。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4707000,"end_ms":4717000,"text":"最后得到的就是一个超级大的盒子。所以,这个时候它运行了吗?运行了没?它没运行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4717000,"end_ms":4732000,"text":"是不是很深刻?感受到没?这个很深刻的,同学们,非常的深刻。不是在开玩笑,这个是很深刻的东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4732000,"end_ms":4748000,"text":"这是一个巨大的盒子,但是它仍然是计划,没有副作用。这是一个巧妙的,把纯粹的推理数学的世界和真实世界能够隔离开的方法。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4748000,"end_ms":4758000,"text":"因为真实世界里面充满了各种不确定性,而你希望的是一个纯粹的东西,这样你有更强的掌控感。这两个东西的分割感。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4758000,"end_ms":4772000,"text":"我一般会举个更好的例子。更好的例子,就是假如两个同学在上课,就是后排那两个同学,他们没有好好听,在讨论玩网络游戏。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4772000,"end_ms":4786000,"text":"但是呢,比如说这是一个PC上的游戏,就是A卡在一个任务上,B通过了。然后呢,因为我这个课也很无聊嘛,也没有像第一节课那么多事情好玩的,没有很理论的感觉。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4786000,"end_ms":4794000,"text":"所以A就不想听了嘛,他就不停地问B,大老怪打不死你,你怎么打的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4794000,"end_ms":4803000,"text":"B就跟A说,其实打大老怪很简单,你先去市场找一个绿衣服的老者,他会给你一个字条。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4803000,"end_ms":4821000,"text":"然后这个字条上有三种可能,对应要去三个不同的地方,如果是方字条就去那个地方,如果是圆字条就去那个地方,如果是三角字条就去另外一个地方。然后呢,你去对应的地方找一个红衣服的商人买一个锤子,拿着字条锤子去打满你,然后,嘭,把大老怪给打死,就通过了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4821000,"end_ms":4843000,"text":"大家能理解吧,B就跟A讲了嘛。但是我们想说,这个游戏它不是纯粹的,虽然它是个游戏,但是大家也得回宿舍打开电脑去玩嘛,它不是纯粹的,它是有随机性的,大家看,这个过程,这个字条是有随机性的,你不知道你拿到的是方字条圆字条还是三角字条。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4843000,"end_ms":4859000,"text":"它是有随机性的,所以,它的过程是依赖字条和锤子,不同的字条会引导你去不同的地方,所以它本身,玩游戏本身,就像你在这个世界中做任何事情,是一个比较脏的,有出路的事情。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4859000,"end_ms":4878000,"text":"但是呢,B的这个计划,它没有影响到游戏世界里面任何的内容,因为大家都在教室上课嘛,A和B还坐在最后一台,在聊天呢,还没来得及,对吧,回到宿舍打开电脑,跟游戏在玩。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4878000,"end_ms":4896000,"text":"对吧,所以,这个计划是一个纯函数,没有辅助力,什么意思呢,就是因为我们这个课非常的无聊嘛,所以A他真的很想打车,所以过了五分钟,他就问B说,你给我讲讲,这车我怎么打。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4896000,"end_ms":4908000,"text":"B也很有耐心嘛,B就说,哎呀,你先去拿字条,然后找锤子,卖锤子,然后把大老板炸死,对吧,过了五分钟,A又问,你给我讲讲,这个游戏怎么打。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4908000,"end_ms":4920000,"text":"然后B又说,哎呀,你去,对吧,拿字条,卖锤子,打大老板。然后每五分钟,A都问B,你不管他问多少遍,B的答案都是一样的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4920000,"end_ms":4930000,"text":"因为它是个计划,它很纯粹,感受到了吗?这就是函数式的魅力,纯粹的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4930000,"end_ms":4944000,"text":"但是呢,一旦我们下课了,可能马上我们就下课了,下课了之后,A飞奔到宿舍,他就去玩了,他可能玩了一次,因为什么原因,没有玩过,他再玩一次。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4944000,"end_ms":4952000,"text":"他每次走的路线可能是不一样的,因为他会得到不同的字条,他会见到不同地方的商人,他会买到不同的锤子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4952000,"end_ms":4970000,"text":"所以这个过程是这样的,但计划是纯粹的。所以每个步骤你会得到一个新的盒子,它会记录当前的状态,比如说,你当前已经拿到六字条了,或者是你根据字条已经拿到六字条和锤子了,或者是你拿到大老板,拿到大老板。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4970000,"end_ms":4979000,"text":"但是他不会依赖任何其他东西,你这个步骤只有这个东西,你不会依赖别的。所以它是纯粹的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4979000,"end_ms":4993000,"text":"所以在这个过程中,我们需要用盒子把这些状态装好,因为教室里的字条和锤子不是真正的字条和锤子,教室里的字条和锤子是攻略上的字条和锤子,它是抽象的,是纯粹的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":4993000,"end_ms":5005000,"text":"而游戏里的字条才是真的,但也是脏的。所以一个是纯函数,一个是肮脏的世界,两个是分开的,大家能理解吗?","speaker":"","sentence_id":null,"words":[]},{"start_ms":5005000,"end_ms":5017000,"text":"而我们这个课程教大家的是怎么去写纯粹的内部字,实现的东西,我们之前说了,这些都是你声明了之后自然有人会帮你看,你不要去管,这个就是很重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5017000,"end_ms":5026000,"text":"所以,干盒子的操作也不是说在一起玩这种攻略,打开盒子就攻略了,后来玩游戏,过程中。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5026000,"end_ms":5029000,"text":"这个大概是问题吧。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5029000,"end_ms":5046000,"text":"所以,在我们的项目里面,我们整个系统所有的后端,全是使用monad,都是用这种词。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5046000,"end_ms":5062000,"text":"所以,真正实现的时候,对于任何的后端内部内容,具体我们之后还会再讲,我们会先说完整的monad。完整的monad就像B跟A讲的游戏攻略一样,","speaker":"","sentence_id":null,"words":[]},{"start_ms":5062000,"end_ms":5072000,"text":"它只是应该怎么做,它并没有真正去做,它中间遇到的任何的情况都没有发生,是纯粹的字段。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5072000,"end_ms":5081000,"text":"而这些副作用不是我们去执行的,我们写的所有的代码都不会碰触这些。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5081000,"end_ms":5089000,"text":"当我们把它应该执行的步骤定义好之后,我给大家提供的后端框架会把这些东西都光光地执行好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5089000,"end_ms":5097000,"text":"所以大家都不需要管,大家不需要知道,诶,它到底是什么时候把盒子打开的,那不归你管。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5097000,"end_ms":5104000,"text":"你只要知道攻略是什么,每一步要做什么就行,那当然也不是你知道的,那是AI做的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5104000,"end_ms":5108000,"text":"所以整个过程是非常干净的,非常简洁。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5108000,"end_ms":5113000,"text":"而且所有功能都集中在这个程式里,这个呢,非常适合AI。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5113000,"end_ms":5122000,"text":"因为它的任务单一,纯粹,它的上下文很管,而且很模范化,非常容易检查和改修。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5122000,"end_ms":5135000,"text":"但AI之前看到的,鱼料大量有不干净的东西,所以它会拖拉,所以大家一定要强迫它们,至少我们这个课程要求,强迫它们按照智能函数的方式去做。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5135000,"end_ms":5139000,"text":"这个其实很难,而且它并发性能也会好很多。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5139000,"end_ms":5149000,"text":"大家可以想象,一旦它是以智能函数的方式来实现的话呢,那么,呃,那么其实,你在某样的实现的时候呢,","speaker":"","sentence_id":null,"words":[]},{"start_ms":5149000,"end_ms":5162000,"text":"你就会发现,你对下一步会有哪些操作,以及哪些操作它们是互不干扰,互不影响的,能够有更好的了解。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5162000,"end_ms":5169000,"text":"这样的话,从编译器的角度,你就会有更好的并发性能,实际上我们这边测过就快很多了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5169000,"end_ms":5179000,"text":"然后具体实现这个Monad的东西呢,我们是用的Scala里面一个叫CatFact的包。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5179000,"end_ms":5194000,"text":"具体长的样子呢,就是类似于这样,我们可以大概看一下,就是,我们做过会给模板,然后会给相关的就是使用规范,所以基本上,这些给AI,AI就知道怎么写。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5194000,"end_ms":5204000,"text":"你只要稍微鞭策它一下,但是我们会讲一讲,就是说,在我们这里,你想要打印一个Hello World,你不能直接打,因为那个太脏了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5204000,"end_ms":5214000,"text":"你应该怎么做呢?你应该说,io.plg,就是说,这是一种简写,总之上是,你把这个打印的东西放到这个盒子里。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5214000,"end_ms":5229000,"text":"然后呢,你用flatmap,然后再打印一个World,所以这两个东西都是装在盒子里,没这个胆。打印这种脏的事情都是让系统模块做的,你不干,你不能干这些事。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5229000,"end_ms":5241000,"text":"然后这个Full Compression也是一样,我看到了A加B加D的Full Compression,这个的话是同样的一个意思,就是说,你有很多盒子,你想把它们粘在一起,","speaker":"","sentence_id":null,"words":[]},{"start_ms":5241000,"end_ms":5252000,"text":"但你又不想写那么复杂的flatmap,那你就用这种方式写,看起来干净又清楚,本质就是flatmap,就是你打印一下Hello World。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5252000,"end_ms":5262000,"text":"或者你也可以用这个,这个是一个语法堂,你怎么用我们不说,反正它这个意思就是先把这两个盒子粘在一起。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5262000,"end_ms":5276000,"text":"那它背后,这个包就是提供这个IO的盒子,这个IO盒子不仅仅是从代数的层面,就是说给我们提供了类似于这种try盒子的优点,","speaker":"","sentence_id":null,"words":[]},{"start_ms":5276000,"end_ms":5288000,"text":"它在实际运行层面也极为高效,当然我不知道大家有多少人去学集团机系统啊,反正大家可能听过什么进程、现程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5288000,"end_ms":5299000,"text":"那这个我们的概念大概是进程的话是跟你的CPU的盒数有关,如果你是个四核的CPU的话,可能就是八个进程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5299000,"end_ms":5305000,"text":"那如果是现程的话呢,它可能就是现程值,可能就是几百个现程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5305000,"end_ms":5314000,"text":"那我们的这个叫先程,我专门搜了fiber,先程,纤维,纤维层,一听这个名字就知道非常的轻嘛,它可以支持百万个机位。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5314000,"end_ms":5325000,"text":"就是你一台小小的计算电脑可以支持百万个先程。而每个先程是做什么呢?就是做一个IO box,IO的小box。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5325000,"end_ms":5332000,"text":"而且它非常轻,像进程就很重很重,它有很多上下文标的环境,现程也要有一个现程值的环境。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5332000,"end_ms":5344000,"text":"而先程它最小只要150个bytes,150个字节,就是非常非常小的,就接近150字,它就可以定义它是什么。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5344000,"end_ms":5356000,"text":"然后呢,为什么你要有这么轻量的东西呢?因为当你把大量的IO核子粘到一起的时候,你本质是在定义你想怎么做。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5356000,"end_ms":5368000,"text":"但是真正背后实现的话,它会根据你实现的逻辑,把每一块小小的函数用一个先程去单独的计算,这样它性能就会非常非常的高。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5368000,"end_ms":5381000,"text":"所以我们的整个系统都是用这个来做的。当然,除了scala,像java,ce,它们也都在,现代化的过程中都在支持类似的东西,可能不当一个名字而已。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5381000,"end_ms":5388000,"text":"所以我们在我们的档案里面就会用一个Lbox,来做这种档案。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5388000,"end_ms":5413000,"text":"那我们今天就讲到这里。","speaker":"","sentence_id":null,"words":[]}]};window.AUDIO_URL="https://cloud.tsinghua.edu.cn/f/9b19aa9227684ecebe2f/?dl=1";</script>
  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const loading = $("loading");
      const error = $("error");
      const player = $("player");
      const audio = $("audio");
      const transcript = $("transcript");
      const search = $("search");
      const followButton = $("follow");
      const count = $("result-count");
      const empty = $("empty");
      const clock = $("clock");
      const durationLabel = $("duration");

      const params = new URLSearchParams(window.location.search);
      const key = params.get("key") || "";
      const id = decodeURIComponent(window.location.pathname.split("/").filter(Boolean).at(-1) || "");
      const recordingPath = `/api/recordings/${encodeURIComponent(id)}`;
      const query = `?key=${encodeURIComponent(key)}`;
      const embeddedData = window.RECORDING_DATA;
      const embeddedAudioUrl = window.AUDIO_URL;

      let segments = [];
      let rows = [];
      let activeIndex = -1;
      let activeWord = null;
      let followPlayback = true;
      let durationMs = 0;
      let filteredCount = 0;

      function formatTime(ms) {
        const seconds = Math.max(0, Math.floor(Number(ms) / 1000 || 0));
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainder = seconds % 60;
        return hours > 0
          ? `${hours}:${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`
          : `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
      }

      function normalizedText(value) {
        return String(value ?? "").normalize("NFKC").toLocaleLowerCase("zh-CN");
      }

      function showError(message) {
        loading.hidden = true;
        player.hidden = true;
        error.hidden = false;
        $("error-message").textContent = message;
      }

      function normalizeSegment(item) {
        const start = Number(item.start_ms);
        const end = Number(item.end_ms);
        if (!Number.isFinite(start) || start < 0 || !Number.isFinite(end) || end < start) return null;
        const words = Array.isArray(item.words)
          ? item.words.map((word) => ({
            start_ms: Number(word.start_ms),
            end_ms: Number(word.end_ms),
            text: String(word.text ?? "")
          })).filter((word) => Number.isFinite(word.start_ms) && word.start_ms >= 0 && Number.isFinite(word.end_ms) && word.end_ms >= word.start_ms && word.text)
          : [];
        return {
          start_ms: start,
          end_ms: end,
          text: String(item.text ?? ""),
          speaker: item.speaker == null ? "" : String(item.speaker),
          words
        };
      }

      // Align timestamped words with the original sentence so punctuation and spaces remain intact.
      function appendSentence(container, segment) {
        const fragment = document.createDocumentFragment();
        let cursor = 0;
        for (const word of segment.words) {
          const position = segment.text.indexOf(word.text, cursor);
          if (position < 0) {
            container.textContent = segment.text;
            return;
          }
          fragment.append(document.createTextNode(segment.text.slice(cursor, position)));
          const span = document.createElement("span");
          span.className = "word";
          span.dataset.wordStart = String(word.start_ms);
          span.dataset.wordEnd = String(word.end_ms);
          span.textContent = word.text;
          fragment.append(span);
          cursor = position + word.text.length;
        }
        fragment.append(document.createTextNode(segment.text.slice(cursor)));
        container.append(fragment);
      }

      function renderTranscript() {
        const fragment = document.createDocumentFragment();
        rows = segments.map((segment, index) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "segment";
          row.dataset.index = String(index);
          row.setAttribute("aria-label", `${formatTime(segment.start_ms)} ${segment.speaker ? `${segment.speaker}：` : ""}${segment.text}`);

          const time = document.createElement("time");
          time.textContent = formatTime(segment.start_ms);
          const body = document.createElement("span");
          body.className = "segment-body";
          if (segment.speaker) {
            const speaker = document.createElement("span");
            speaker.className = "speaker";
            speaker.textContent = segment.speaker;
            body.append(speaker);
          }
          const sentence = document.createElement("span");
          if (segment.words.length) appendSentence(sentence, segment);
          else sentence.textContent = segment.text;
          body.append(sentence);
          row.append(time, body);
          fragment.append(row);
          return row;
        });
        transcript.replaceChildren(fragment);
        filterTranscript();
      }

      function filterTranscript() {
        const term = normalizedText(search.value.trim());
        filteredCount = 0;
        rows.forEach((row, index) => {
          const segment = segments[index];
          const visible = !term || normalizedText(`${segment.speaker} ${segment.text}`).includes(term);
          row.hidden = !visible;
          if (visible) filteredCount += 1;
        });
        count.textContent = term ? `找到 ${filteredCount} 条 · 共 ${rows.length} 条` : `共 ${rows.length} 条`;
        empty.hidden = filteredCount !== 0;
        transcript.hidden = filteredCount === 0;
      }

      function indexAt(ms) {
        let low = 0;
        let high = segments.length - 1;
        let candidate = -1;
        while (low <= high) {
          const middle = (low + high) >> 1;
          if (segments[middle].start_ms <= ms) {
            candidate = middle;
            low = middle + 1;
          } else {
            high = middle - 1;
          }
        }
        return candidate >= 0 && ms <= segments[candidate].end_ms ? candidate : -1;
      }

      function scrollToRow(row) {
        if (!row || row.hidden) return;
        const upper = row.offsetTop - transcript.offsetTop;
        const lower = upper + row.offsetHeight;
        const currentUpper = transcript.scrollTop;
        const currentLower = currentUpper + transcript.clientHeight;
        if (upper < currentUpper || lower > currentLower) {
          transcript.scrollTo({ top: Math.max(0, upper - transcript.clientHeight * .35), behavior: "smooth" });
        }
      }

      function updateCurrent() {
        const ms = audio.currentTime * 1000;
        clock.textContent = `${formatTime(ms)} / ${formatTime(durationMs)}`;
        const index = indexAt(ms);
        if (index !== activeIndex) {
          if (activeIndex >= 0) {
            rows[activeIndex].classList.remove("active");
            rows[activeIndex].removeAttribute("aria-current");
          }
          activeIndex = index;
          if (index >= 0) {
            rows[index].classList.add("active");
            rows[index].setAttribute("aria-current", "true");
            if (followPlayback) scrollToRow(rows[index]);
          }
        }

        if (activeWord) activeWord.classList.remove("word-active");
        activeWord = null;
        if (index >= 0) {
          const words = rows[index].querySelectorAll("[data-word-start]");
          for (const word of words) {
            if (ms >= Number(word.dataset.wordStart) && ms <= Number(word.dataset.wordEnd)) {
              activeWord = word;
              word.classList.add("word-active");
              break;
            }
          }
        }
      }

      function seekTo(ms) {
        const seconds = Math.max(0, ms / 1000);
        audio.currentTime = seconds;
        updateCurrent();
        const playback = audio.play();
        if (playback && typeof playback.catch === "function") playback.catch(() => {});
      }

      async function load() {
        error.hidden = true;
        player.hidden = true;
        loading.hidden = false;
        $("audio-error").hidden = true;
        if ((!embeddedData || !embeddedAudioUrl) && (!id || !key)) {
          showError("播放链接不完整。请从课程页面重新打开。");
          return;
        }
        try {
          let data = embeddedData;
          if (!data) {
            const response = await fetch(`${recordingPath}/public${query}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            data = await response.json();
          }
          if (!data || !Array.isArray(data.segments)) throw new Error("Invalid transcript");

          segments = data.segments.map(normalizeSegment).filter(Boolean)
            .sort((a, b) => a.start_ms - b.start_ms);
          durationMs = Number(data.duration_ms) || 0;
          if (!durationMs && segments.length) durationMs = segments.at(-1).end_ms;
          $("title").textContent = String(data.title || "课堂录音");
          document.title = `${$("title").textContent} · 逐字稿`;
          durationLabel.textContent = durationMs ? `录音时长 ${formatTime(durationMs)}` : "点击逐字稿回听";
          clock.textContent = `00:00 / ${formatTime(durationMs)}`;
          audio.src = embeddedAudioUrl || `${recordingPath}/audio${query}`;
          renderTranscript();
          loading.hidden = true;
          player.hidden = false;
        } catch (_) {
          showError("录音或逐字稿暂时无法加载。请检查链接是否有效，然后重试。");
        }
      }

      transcript.addEventListener("click", (event) => {
        const row = event.target.closest(".segment");
        if (!row) return;
        const segment = segments[Number(row.dataset.index)];
        const word = event.target.closest("[data-word-start]");
        seekTo(word ? Number(word.dataset.wordStart) : segment.start_ms);
      });
      search.addEventListener("input", filterTranscript);
      search.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          search.value = "";
          filterTranscript();
        }
      });
      followButton.addEventListener("click", () => {
        followPlayback = !followPlayback;
        followButton.setAttribute("aria-pressed", String(followPlayback));
        if (followPlayback && activeIndex >= 0) scrollToRow(rows[activeIndex]);
      });
      audio.addEventListener("timeupdate", updateCurrent);
      audio.addEventListener("seeked", updateCurrent);
      audio.addEventListener("loadedmetadata", () => {
        if (!durationMs && Number.isFinite(audio.duration)) {
          durationMs = Math.round(audio.duration * 1000);
          durationLabel.textContent = `录音时长 ${formatTime(durationMs)}`;
        }
        updateCurrent();
      });
      audio.addEventListener("error", () => { $("audio-error").hidden = false; });
      $("retry").addEventListener("click", load);
      load();
    })();
  </script>
</body>
</html>
