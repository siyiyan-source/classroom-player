<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>课堂录音与逐字稿</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      --ink: #222b29;
      --muted: #68736f;
      --border: #e5e9e5;
      --accent: #216d5d;
      --accent-soft: #eaf5f0;
      --surface: #fff;
      --page: #f7f9f7;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 260px; margin: 0; }
    body { background: var(--page); color: var(--ink); line-height: 1.6; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .shell { width: 100%; max-width: 960px; margin: 0 auto; padding: clamp(12px, 3vw, 28px); }
    .card { overflow: hidden; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 28px rgba(27, 53, 43, .05); }
    .top { padding: clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--border); }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(18px, 2.8vw, 25px); line-height: 1.4; overflow-wrap: anywhere; }
    .subline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 6px; color: var(--muted); font-size: 13px; }
    .time-readout { font-variant-numeric: tabular-nums; }
    .audio-error { margin: 9px 0 0; color: #9b3f35; font-size: 13px; }
    audio { display: block; width: 100%; height: 42px; margin-top: 17px; accent-color: var(--accent); }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 13px clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--border); }
    .search-wrap { position: relative; flex: 1 1 220px; }
    .search-wrap svg { position: absolute; top: 50%; left: 12px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #search { display: block; width: 100%; height: 38px; padding: 0 13px 0 38px; border: 1px solid #d9e1dc; border-radius: 9px; outline: none; background: #fff; color: var(--ink); }
    #search:focus-visible, .quiet-button:focus-visible, .segment:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #search::placeholder { color: #8a948f; }
    .quiet-button { min-height: 38px; padding: 6px 11px; border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--accent); font-size: 13px; font-weight: 600; white-space: nowrap; }
    .quiet-button:hover { background: var(--accent-soft); }
    .quiet-button[aria-pressed="true"] { border-color: #b9d6c9; background: var(--accent-soft); }
    .result-count { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .transcript { max-height: min(62vh, 650px); min-height: 160px; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .segment { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; width: 100%; margin: 0; padding: 15px clamp(16px, 3vw, 28px); border: 0; border-bottom: 1px solid #f0f2ef; border-left: 3px solid transparent; border-radius: 0; background: transparent; color: inherit; text-align: left; }
    .segment:hover { background: #f7faf8; }
    .segment.active { border-left-color: var(--accent); background: var(--accent-soft); }
    .segment time { padding-top: 1px; color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
    .segment-body { min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
    .speaker { display: inline-block; margin-right: 7px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .word { border-radius: 3px; }
    .word:hover { background: #d1e8dc; }
    .word.word-active { background: #c4e5d4; box-shadow: 0 0 0 2px #c4e5d4; }
    .empty { padding: 44px 18px; color: var(--muted); text-align: center; font-size: 14px; }
    .state { padding: 54px 24px; text-align: center; }
    .state h2 { margin: 0 0 6px; font-size: 17px; }
    .state p { margin: 0 auto 18px; max-width: 35em; color: var(--muted); font-size: 14px; }
    .state .quiet-button { padding: 8px 18px; }
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      .shell { padding: 0; }
      .card { border-radius: 0; box-shadow: none; }
      .segment { grid-template-columns: 62px minmax(0, 1fr); gap: 5px; }
      .result-count { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="card">
      <section id="loading" class="state" role="status">
        <h2>正在打开课堂录音…</h2>
        <p>逐字稿加载后就可以点击文字回听。</p>
      </section>

      <section id="error" class="state" role="alert" hidden>
        <h2>暂时无法打开这份录音</h2>
        <p id="error-message">请稍后重试。</p>
        <button id="retry" class="quiet-button" type="button">重新加载</button>
      </section>

      <div id="player" hidden>
        <header class="top">
          <p class="eyebrow">课堂录音 · 逐字稿</p>
          <h1 id="title">课堂录音</h1>
          <div class="subline">
            <span id="duration">录音时长加载中</span>
            <span class="time-readout" id="clock">00:00 / 00:00</span>
            <span>点击逐字稿可从对应位置播放</span>
          </div>
          <audio id="audio" controls preload="metadata" aria-label="课堂录音播放器"></audio>
          <p id="audio-error" class="audio-error" role="alert" hidden>录音暂时无法播放，请稍后重新打开课程页面。</p>
        </header>

        <div class="toolbar">
          <label class="search-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg>
            <input id="search" type="search" placeholder="搜索逐字稿" aria-label="搜索逐字稿" autocomplete="off">
          </label>
          <button id="follow" class="quiet-button" type="button" aria-pressed="true" title="播放时自动定位当前句">跟随播放</button>
          <span id="result-count" class="result-count"></span>
        </div>

        <div id="transcript" class="transcript" role="region" aria-label="逐字稿"></div>
        <div id="empty" class="empty" hidden>没有找到匹配的内容。试试其他关键词。</div>
      </div>
    </div>
  </main>

  <script>window.RECORDING_DATA={"title":"建筑、游戏与ai--第四节课","duration_ms":5285120,"segments":[{"start_ms":0,"end_ms":3018,"text":"谢谢黄老师，我这边直接开始讲。","speaker":"","sentence_id":null,"words":[]},{"start_ms":13380,"end_ms":21292,"text":"今天想跟大家分享怎么用 AI 开发游戏。我做了一个抛砖引玉的小 Demo，","speaker":"","sentence_id":null,"words":[]},{"start_ms":21292,"end_ms":24927,"text":"放在倒数第四节课，跟大家拆解一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":24930,"end_ms":31388,"text":"在用 AI 开发游戏、做实践的过程中，哪些技术可以用到，哪个环节可以怎么做。","speaker":"","sentence_id":null,"words":[]},{"start_ms":31388,"end_ms":33087,"text":"也不是说哪种做法最好","speaker":"","sentence_id":null,"words":[]},{"start_ms":33090,"end_ms":39852,"text":"而是分享我们个人在日常工作中用得比较多的一些实践。它不一定是最好的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":39852,"end_ms":43630,"text":"因为 AI 还比较新，也没有形成确定的","speaker":"","sentence_id":null,"words":[]},{"start_ms":43640,"end_ms":49650,"text":"SOP，能保证大家照着做就没有问题。我们拿出来跟大家分享一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":49750,"end_ms":57893,"text":"之所以放在这么后面，是因为我们觉得 AI 开发还是要上手的。大家最好已经动过手，","speaker":"","sentence_id":null,"words":[]},{"start_ms":57893,"end_ms":61150,"text":"我们再讨论、交流，这样会比较好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":61160,"end_ms":70374,"text":"所以放在课程的倒数第四节，离最后一节展示成果还有两周左右。","speaker":"","sentence_id":null,"words":[]},{"start_ms":70390,"end_ms":76206,"text":"这个时间，如果大家还没开始做的话，现在开始做起来也是绰绰有余的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":76206,"end_ms":82930,"text":"下一周的话我们可能会给大家一点时间来讨论一下自己有什么想法，做的什么样了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":82940,"end_ms":90690,"text":"过程中有什么困难，可能给个一节课的时间吧，大家来，大家可以各自上来交流一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":90850,"end_ms":102330,"text":"这是这一周打算跟大家分享的一些内容和步骤。之前也提到，做游戏有三角力量：","speaker":"","sentence_id":null,"words":[]},{"start_ms":102340,"end_ms":109459,"text":"策划程序和美术，这三个工种三个工序都是可以用 AI 来介入来辅助的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":109470,"end_ms":115666,"text":"甚至有些是完全可以替代的，就后面拆了一下，第一块我们来 AI 辅助项目设计和决策。","speaker":"","sentence_id":null,"words":[]},{"start_ms":115770,"end_ms":123980,"text":"中间还有 AI 辅助环境和工具配置，对应工具链的开发。","speaker":"","sentence_id":null,"words":[]},{"start_ms":123990,"end_ms":127528,"text":"AI 怎么编写程序代码，这块可能会讲的比较少，","speaker":"","sentence_id":null,"words":[]},{"start_ms":127528,"end_ms":130758,"text":"因为我们认为现在编写程序没有那么大的价值。","speaker":"","sentence_id":null,"words":[]},{"start_ms":130770,"end_ms":139158,"text":"AI 怎么生产美术资源？我们会着重介绍 ComfyUI，这个工具我们内部用得比较多。","speaker":"","sentence_id":null,"words":[]},{"start_ms":139170,"end_ms":145851,"text":"还有 AI 辅助测试。策划、美术和程序做完一个游戏之后，还有 QA，","speaker":"","sentence_id":null,"words":[]},{"start_ms":145851,"end_ms":148405,"text":"也就是质量保证和测试环节。","speaker":"","sentence_id":null,"words":[]},{"start_ms":148410,"end_ms":150540,"text":"AI 怎么来去做一个自动化的测试。","speaker":"","sentence_id":null,"words":[]},{"start_ms":150780,"end_ms":158904,"text":"最后，我花了一天时间让 AI 做了一个小 Demo，算是抛砖引玉，大家来看一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":158910,"end_ms":164450,"text":"我会把制作过程都放出来，大家一起来讨论。","speaker":"","sentence_id":null,"words":[]},{"start_ms":165690,"end_ms":171750,"text":"首先跟大家汇报一下这周的动态。","speaker":"","sentence_id":null,"words":[]},{"start_ms":171760,"end_ms":176205,"text":"AI 最新的动态以后我们每一周课都会有的固定的环节。","speaker":"","sentence_id":null,"words":[]},{"start_ms":176430,"end_ms":180468,"text":"这周有关于 AI 的新的动态的，首先关于模型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":180750,"end_ms":184836,"text":"这周上了一个新的 Gemini 模型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":184836,"end_ms":191502,"text":"之前大家会觉得 Gemini 是“北美大豆包”，觉得不太好用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":191550,"end_ms":198086,"text":"这个模型刚出来的时候，公司内部也觉得，Gemini 好像没有什么可以期待的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":198090,"end_ms":207778,"text":"实际用起来还可以，就是它最终给出的东西还可以，它的特点是它写代码来说，","speaker":"","sentence_id":null,"words":[]},{"start_ms":207778,"end_ms":211100,"text":"不是所有模型里面最强的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":211110,"end_ms":217310,"text":"如果我们是纯纯的做一个代码开发的话，依然还是推荐 GPT 的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":217320,"end_ms":224206,"text":"还有其他模型〔具体型号原转写不清：46.1、高5.5、GPT3〕。","speaker":"","sentence_id":null,"words":[]},{"start_ms":224206,"end_ms":227127,"text":"但它的好处是文本能力特别强。","speaker":"","sentence_id":null,"words":[]},{"start_ms":227130,"end_ms":233091,"text":"尤其是中文文本能力，我们感觉甚至超过了 DeepSeek。","speaker":"","sentence_id":null,"words":[]},{"start_ms":233091,"end_ms":241518,"text":"DeepSeek 有时像在讲黑话，会发明一些像从英文翻译来的、中文不这么说的表达。","speaker":"","sentence_id":null,"words":[]},{"start_ms":241530,"end_ms":250724,"text":"但 Gemini 的语感特别好，特别适合纯文本工作。后面会有一张图，","speaker":"","sentence_id":null,"words":[]},{"start_ms":250724,"end_ms":254510,"text":"给大家看一下它的语感有多好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":254610,"end_ms":260761,"text":"它的另一个问题是，谷歌好像说是自己的卡不够了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":260770,"end_ms":265350,"text":"他们把自己的卡都卖给别人了，自己的算力就不太够。","speaker":"","sentence_id":null,"words":[]},{"start_ms":265350,"end_ms":269739,"text":"这个 Gemini 模型跑起来时不时会掉缓存，","speaker":"","sentence_id":null,"words":[]},{"start_ms":269739,"end_ms":274510,"text":"我们发现它平时的缓存命中率可能只有 70% 左右。","speaker":"","sentence_id":null,"words":[]},{"start_ms":274520,"end_ms":281833,"text":"一般来说到90%以上才算是比较正常，才算是一个比较节省费用的一个水平。","speaker":"","sentence_id":null,"words":[]},{"start_ms":282070,"end_ms":290230,"text":"所以说它虽然打了折，像打折打了对折还是多少，看起来好像说挺省钱的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":290240,"end_ms":302545,"text":"实际用起来，因为缓存命中率低，有种花钱如流水的感觉。另一个特点是，出于防蒸馏的目的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":302545,"end_ms":305182,"text":"它把思维链隐藏了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":305650,"end_ms":308722,"text":"思维链是什么东西？","speaker":"","sentence_id":null,"words":[]},{"start_ms":309250,"end_ms":313358,"text":"大家还没有用过的话，稍等给大家看一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":401260,"end_ms":406088,"text":"思维链就是，我们用 DeepSeek 时，","speaker":"","sentence_id":null,"words":[]},{"start_ms":406088,"end_ms":415285,"text":"在一轮问答中间可能会出现一堆读取文件、执行命令，以及“let me”之类的内容。","speaker":"","sentence_id":null,"words":[]},{"start_ms":415450,"end_ms":417351,"text":"经历这些思维链后，","speaker":"","sentence_id":null,"words":[]},{"start_ms":417351,"end_ms":425800,"text":"相当于一种 in-context learning：它会在思考过程中先分析问题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":425800,"end_ms":427279,"text":"最后给出结论。","speaker":"","sentence_id":null,"words":[]},{"start_ms":427450,"end_ms":438370,"text":"但这个模型不显示思维链。使用时可能发现它自己转了十几分钟、二十分钟，最后才给出结论。","speaker":"","sentence_id":null,"words":[]},{"start_ms":438380,"end_ms":439510,"text":"结论没有问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":439520,"end_ms":445690,"text":"这个结论还是非常强的，正确的，但是中间你就会不知道他到底在干什么，这些带来一个问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":445700,"end_ms":450332,"text":"你可能在那等了二十几分钟，你不知道他在想什么，","speaker":"","sentence_id":null,"words":[]},{"start_ms":450332,"end_ms":455367,"text":"你也不知道该打断他想的可能只能就等他出来一个结果。","speaker":"","sentence_id":null,"words":[]},{"start_ms":456070,"end_ms":461440,"text":"这是我们实际使用这个模型时的一些感受。","speaker":"","sentence_id":null,"words":[]},{"start_ms":468260,"end_ms":473340,"text":"这是这周新出的 Gemini 模型〔具体型号原转写不清〕。","speaker":"","sentence_id":null,"words":[]},{"start_ms":473450,"end_ms":476198,"text":"另外的一些动态，比如说好像是在昨天的时候，","speaker":"","sentence_id":null,"words":[]},{"start_ms":476198,"end_ms":482086,"text":"DeepSeek 昨天下午 DeepSeek 崩了 DeepSeek 的所有的服务都崩了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":482086,"end_ms":484180,"text":"我们公司内部又非常依赖这个东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":484190,"end_ms":489824,"text":"大家就说没法干活了，整个下午中断了将近五个小时。","speaker":"","sentence_id":null,"words":[]},{"start_ms":489830,"end_ms":497396,"text":"最近一周用过 DeepSeek 的，可以回去看看。官方现在承诺返还相关金额","speaker":"","sentence_id":null,"words":[]},{"start_ms":497406,"end_ms":503147,"text":"返还七天内的所有金额，是个比较好的补偿政策。","speaker":"","sentence_id":null,"words":[]},{"start_ms":503390,"end_ms":510650,"text":"在除了这两条之外，刚刚在今天下午还改了一部 PPT，就加了第三条。","speaker":"","sentence_id":null,"words":[]},{"start_ms":510660,"end_ms":517860,"text":"大家在日常的使用中觉得现在有些模型不太好接入，甚至可能费用比较高的话。","speaker":"","sentence_id":null,"words":[]},{"start_ms":517910,"end_ms":525822,"text":"OpenCode 是一款 AI agent harness，","speaker":"","sentence_id":null,"words":[]},{"start_ms":525822,"end_ms":530042,"text":"也就是承载 Agent 的工具。","speaker":"","sentence_id":null,"words":[]},{"start_ms":530052,"end_ms":536591,"text":"打开之后可以免费用这些模型〔原转写型号：4.1、3点，待核〕。对于轻量工作，","speaker":"","sentence_id":null,"words":[]},{"start_ms":536591,"end_ms":539000,"text":"是个挺好的 AI 使用途径。","speaker":"","sentence_id":null,"words":[]},{"start_ms":541220,"end_ms":546765,"text":"关于模型和一些网关的动态就这些。","speaker":"","sentence_id":null,"words":[]},{"start_ms":546770,"end_ms":558370,"text":"这一周还有一些值得讲的内容，是 AI 做移植、破解的进展，可以说一发不可收拾。","speaker":"","sentence_id":null,"words":[]},{"start_ms":558590,"end_ms":560508,"text":"在前一周的时候，我们是不是提过。","speaker":"","sentence_id":null,"words":[]},{"start_ms":560510,"end_ms":567855,"text":"我们前一周是不是提过，AI 把 Photoshop 逆向出来了？","speaker":"","sentence_id":null,"words":[]},{"start_ms":567855,"end_ms":570609,"text":"它是一款非常专业、庞大的","speaker":"","sentence_id":null,"words":[]},{"start_ms":570710,"end_ms":577433,"text":"封闭的收费的这种软件，它的源代码都能够被 AI 给它逆向出来，","speaker":"","sentence_id":null,"words":[]},{"start_ms":577433,"end_ms":584590,"text":"自己去做一些二次的修改，再重新打包发布出来，功能几乎上是差不多的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":584630,"end_ms":590951,"text":"这一周好像出来了一个新工具，叫“ra”〔名称待核〕，","speaker":"","sentence_id":null,"words":[]},{"start_ms":590951,"end_ms":598730,"text":"也是通过 AI Agent 操纵 AI，对现有的闭源软件做逆向。","speaker":"","sentence_id":null,"words":[]},{"start_ms":598890,"end_ms":607882,"text":"现在大家好像主要把一些游戏包体反向编译出来","speaker":"","sentence_id":null,"words":[]},{"start_ms":607890,"end_ms":615999,"text":"重新打包、部署到不同平台。这周看到比较多的，如《暗黑破坏神 II》的手机移植，","speaker":"","sentence_id":null,"words":[]},{"start_ms":615999,"end_ms":624108,"text":"以及“雪原”〔游戏名待核〕，原本甚至在 PS4 上跑，现在被搬到 PC 上跑。","speaker":"","sentence_id":null,"words":[]},{"start_ms":624150,"end_ms":636439,"text":"大家还不太清楚，AI 移植对今后软件，特别是闭源软件的发展，会有什么影响。","speaker":"","sentence_id":null,"words":[]},{"start_ms":636439,"end_ms":642750,"text":"尤其在游戏行业，我们辛辛苦苦做一款游戏","speaker":"","sentence_id":null,"words":[]},{"start_ms":642760,"end_ms":654322,"text":"用了各种加密、资源封装手段，现在好像都可以被破解、逆向出来。今后游戏行业会怎样发展？","speaker":"","sentence_id":null,"words":[]},{"start_ms":654330,"end_ms":657254,"text":"收费模式也会有怎样的更改。","speaker":"","sentence_id":null,"words":[]},{"start_ms":657270,"end_ms":665034,"text":"包括各种商业模式方面的考量，也是一些新的考量的点，这个 AI 带来的影响。","speaker":"","sentence_id":null,"words":[]},{"start_ms":668340,"end_ms":679602,"text":"AI 动态就分享到这里，下面讲怎么用 AI 实践开发一款游戏。","speaker":"","sentence_id":null,"words":[]},{"start_ms":679950,"end_ms":685050,"text":"首先，关于我们怎么去做一款游戏的初步设计？","speaker":"","sentence_id":null,"words":[]},{"start_ms":685060,"end_ms":689553,"text":"一个游戏要做出来，我们首先要有一个想法，我们这个游戏要做什么，","speaker":"","sentence_id":null,"words":[]},{"start_ms":689553,"end_ms":691582,"text":"这个其实也不单单只针对游戏。","speaker":"","sentence_id":null,"words":[]},{"start_ms":691590,"end_ms":696150,"text":"我们在做任何的项目的时候，我们都会先有一个大概的想法，初步的设计。","speaker":"","sentence_id":null,"words":[]},{"start_ms":696160,"end_ms":702082,"text":"这个设计现在 AI 时代，我们要怎么做这个设计，在我们公司内部，","speaker":"","sentence_id":null,"words":[]},{"start_ms":702082,"end_ms":706708,"text":"我们会觉得说做设计其实是一个先发散，再收敛的过程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":706750,"end_ms":712949,"text":"发散我还不知道要做什么的时候，我会去尽可能的广泛的去收集一些想法。","speaker":"","sentence_id":null,"words":[]},{"start_ms":713050,"end_ms":719452,"text":"再充分的研究过这些想法之后，我们要做一个收敛，我们要把它收到一个可执行的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":719452,"end_ms":721528,"text":"可以开发的一个边界之内。","speaker":"","sentence_id":null,"words":[]},{"start_ms":721930,"end_ms":732902,"text":"这是一份游戏的初始设计文档，屏幕可能看不太清楚。这是《暗黑破坏神》的设计文档。","speaker":""," 做一些边界的限定，最后他的产出成果？","speaker":"","sentence_id":null,"words":[]},{"start_ms":964010,"end_ms":968712,"text":"看这个过程其实是跟是一样的，它会给个 abcd这个选项，","speaker":"","sentence_id":null,"words":[]},{"start_ms":968712,"end_ms":973750,"text":"我们做选择题就通过这些一串选择题帮我们把这个设定给它定下来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":974210,"end_ms":984524,"text":"最终会产出统一的文档，对齐我们跟 AI 对同一件事的理解","speaker":"","sentence_id":null,"words":[]},{"start_ms":984530,"end_ms":986285,"text":"统一领域里的概念。","speaker":"","sentence_id":null,"words":[]},{"start_ms":986450,"end_ms":997190,"text":"像刚才的游戏开发，它会确定模型文件是什么样子、对应什么含义。","speaker":"","sentence_id":null,"words":[]},{"start_ms":997200,"end_ms":998324,"text":"我们说的是什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":998330,"end_ms":1002418,"text":"像 geometry这里的 impact 又是什么意思？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1002530,"end_ms":1003846,"text":"Check point 又是什么意思？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1003850,"end_ms":1008258,"text":"Check point 对应的就是竞速里面检查竞速玩法里面检查点这么一个意思。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1009920,"end_ms":1021724,"text":"通过一份 context.md，把上下文先定下来，我们能够用统一的词汇交流、沟通。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1022790,"end_ms":1034265,"text":"它给出 context.md，把每个词的定义也确定下来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1035270,"end_ms":1051410,"text":"它产出的第二个东西叫做 adr所谓的 ADR 就是 Architecture Decision Record 就是为什么这个架构是设计的架构设计的过程是要被记录下来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1051420,"end_ms":1055876,"text":"ADR 就是把为什么这么选的写进仓库里面？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1057640,"end_ms":1059646,"text":"为什么要这样做？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1059650,"end_ms":1070040,"text":"开发深入之后，有些决策需要反转、修改、修正。实际开发中更是如此，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1070040,"end_ms":1074586,"text":"可能策划第一天提出 A 需求","speaker":"","sentence_id":null,"words":[]},{"start_ms":1074590,"end_ms":1083866,"text":"第二天又说需求不对，要 B。ADR 的意义是在一开始确定哪些东西绝对不能改，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1083866,"end_ms":1089968,"text":"哪些东西一改，后面就会承担非常大的时间和费用成本。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1090190,"end_ms":1094746,"text":"比如说，我们特别在游戏领域，我们要确定开发一款游戏的时候，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1094746,"end_ms":1098360,"text":"首先要定的是我们要做一个单机游戏还是联机游戏。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1098470,"end_ms":1103693,"text":"如果我们一开始确定了，说我要做一个单机游戏，日后他说快开发完了之后，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1103693,"end_ms":1108302,"text":"首先我要变成一个联机的，我要让所有人可以到我的服务器上来玩。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1108310,"end_ms":1111730,"text":"这个代价会特别大，要处理到很多。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1111740,"end_ms":1119459,"text":"比如要处理不同玩家之间的确定性、物理确定性，这些一开始必须定下来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1119459,"end_ms":1123670,"text":"物理模拟在不同平台可能算出不同结果。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1123680,"end_ms":1131169,"text":"我们游戏的公平性就一定要让它在去，让他尽可能的在不同的平台上面算出来一样，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1131169,"end_ms":1137444,"text":"这个事情是在一开始就要被设计好的是一定一定是到后面是不能改的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1137550,"end_ms":1144629,"text":"一款游戏到后期突然想改成网游，基本相当于推倒重做。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1144630,"end_ms":1153517,"text":"前期开发投入的成本都白费了。因此，难以逆转的决策一定要记录下来。还有一点，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1153517,"end_ms":1157120,"text":"写这些东西是为了让后来的人看。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1157650,"end_ms":1163633,"text":"游戏可能是很多的人，一款游戏有上百人甚至上千人参与的共同的协作。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1163650,"end_ms":1169902,"text":"那么大家要互相理解，不单单要理解说我这个东西为什么要设计成为什么是这样设计，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1169902,"end_ms":1175166,"text":"更要理解说我为什么要这样设计，更要去理解说当初为什么这么去决策？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1175170,"end_ms":1176580,"text":"东西为什么不能改？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1176900,"end_ms":1181366,"text":"比如未来的工程师，或者另一个会话里的 AI，看到代码会困惑：","speaker":"","sentence_id":null,"words":[]},{"start_ms":1181370,"end_ms":1189811,"text":"为什么没写撞墙回退，是不是漏了？就需要在 ADR 里记录：这不是遗漏，是有意设计，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1189811,"end_ms":1190634,"text":"不要改。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1194460,"end_ms":1199698,"text":"下面这段总结也挺好：ADR 的核心作用，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1199698,"end_ms":1206506,"text":"是阻止工程师或者 AI 好心修掉一个深思熟虑的设计。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1206506,"end_ms":1211482,"text":"设计阶段脑海中的思考过程也要记录下来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1214620,"end_ms":1222178,"text":"所以有了这个之后产出来的文章会被记录到我的工程里面，我们在后续开发过程中，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1222178,"end_ms":1225650,"text":"每一个 AI 都去读，它都会去读。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1225870,"end_ms":1230190,"text":"首先读 context.md，理解术语的概念","speaker":"","sentence_id":null,"words":[]},{"start_ms":1230200,"end_ms":1235290,"text":"我之前上下文里的术语怎么跟我的游戏里面实际开发的内容，它对应起来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1235300,"end_ms":1240207,"text":"另一个会读 ADR，理解决策为什么这样做。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1240210,"end_ms":1247611,"text":"也就是基于，而且基于我当前或者我之前做的那些决策，我接下来的决策怎么样去做，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1247611,"end_ms":1252870,"text":"比如说我 ADR 里已经记载了说我这是一款竞速的游戏。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1252880,"end_ms":1256649,"text":"我后面去设计我的 character 的时候，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1256649,"end_ms":1261565,"text":"我的决策的时候设计我的每一局游戏时长的时候，我就有一个依据。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1261570,"end_ms":1268705,"text":"我知道一款竞速什么样的时间是最合适的可能1分半如果一款小游戏1分半稍微大一点，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1268705,"end 频，这个项目也是这样的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5202868,"end_ms":5209250,"text":"我最后说你给我这个场景加上 BGM，通过竞速检查点的时候加个音效。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5215112,"end_ms":5221326,"text":"说他要通过 Python 的方式来帮我去模拟的，去做一些音效出来，我说这不行，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5221326,"end_ms":5225150,"text":"你直接去网上给我找一些现成的开源的音效就可以了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5225162,"end_ms":5232632,"text":"这段对话也是非常的简洁，非常的高效的，所以只经过三个问答，就把这个音效给他加上。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5236332,"end_ms":5242138,"text":"只是一个抛砖引玉的小项目，跟大家分享一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5242142,"end_ms":5248622,"text":"中间遇到的坑、小技巧，像 Git 提交这些，也跟大家讨论、交流了一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5248632,"end_ms":5259116,"text":"今天的时间也到了，正好，下一周会给大家一点时间去分享一下，或者说大家可以讨论一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5259122,"end_ms":5264869,"text":"现在做这个项目做这个课程作业遇到了什么问题，有什么，或者现在已经做到什么进度了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":5264869,"end_ms":5266162,"text":"想来跟大家看一看。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5266442,"end_ms":5273238,"text":"每个人一两分钟或者每组一两分钟的时间，简单汇报一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5273342,"end_ms":5278934,"text":"这是我们下周的一个小环节，跟大家提前预告一下，我们今天课就先到这里。","speaker":"","sentence_id":null,"words":[]},{"start_ms":5279042,"end_ms":5282970,"text":"有问题的话，我们可以留下来再讨论一下，今天课到这里，谢谢大家！","speaker":"","sentence_id":null,"words":[]}]};window.AUDIO_URL="https://cloud.tsinghua.edu.cn/f/b1325c33c05e42fe910b/?dl=1";</script>
  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const loading = $("loading");
      const error = $("error");
      const player = $("player");
      const audio = $("audio");
      const transcript = $("transcript");
      const search = $("search");
      const followButton = $("follow");
      const count = $("result-count");
      const empty = $("empty");
      const clock = $("clock");
      const durationLabel = $("duration");

      const params = new URLSearchParams(window.location.search);
      const key = params.get("key") || "";
      const id = decodeURIComponent(window.location.pathname.split("/").filter(Boolean).at(-1) || "");
      const recordingPath = `/api/recordings/${encodeURIComponent(id)}`;
      const query = `?key=${encodeURIComponent(key)}`;
      const embeddedData = window.RECORDING_DATA;
      const embeddedAudioUrl = window.AUDIO_URL;

      let segments = [];
      let rows = [];
      let activeIndex = -1;
      let activeWord = null;
      let followPlayback = true;
      let durationMs = 0;
      let filteredCount = 0;

      function formatTime(ms) {
        const seconds = Math.max(0, Math.floor(Number(ms) / 1000 || 0));
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainder = seconds % 60;
        return hours > 0
          ? `${hours}:${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`
          : `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
      }

      function normalizedText(value) {
        return String(value ?? "").normalize("NFKC").toLocaleLowerCase("zh-CN");
      }

      function showError(message) {
        loading.hidden = true;
        player.hidden = true;
        error.hidden = false;
        $("error-message").textContent = message;
      }

      function normalizeSegment(item) {
        const start = Number(item.start_ms);
        const end = Number(item.end_ms);
        if (!Number.isFinite(start) || start < 0 || !Number.isFinite(end) || end < start) return null;
        const words = Array.isArray(item.words)
          ? item.words.map((word) => ({
            start_ms: Number(word.start_ms),
            end_ms: Number(word.end_ms),
            text: String(word.text ?? "")
          })).filter((word) => Number.isFinite(word.start_ms) && word.start_ms >= 0 && Number.isFinite(word.end_ms) && word.end_ms >= word.start_ms && word.text)
          : [];
        return {
          start_ms: start,
          end_ms: end,
          text: String(item.text ?? ""),
          speaker: item.speaker == null ? "" : String(item.speaker),
          words
        };
      }

      // Align timestamped words with the original sentence so punctuation and spaces remain intact.
      function appendSentence(container, segment) {
        const fragment = document.createDocumentFragment();
        let cursor = 0;
        for (const word of segment.words) {
          const position = segment.text.indexOf(word.text, cursor);
          if (position < 0) {
            container.textContent = segment.text;
            return;
          }
          fragment.append(document.createTextNode(segment.text.slice(cursor, position)));
          const span = document.createElement("span");
          span.className = "word";
          span.dataset.wordStart = String(word.start_ms);
          span.dataset.wordEnd = String(word.end_ms);
          span.textContent = word.text;
          fragment.append(span);
          cursor = position + word.text.length;
        }
        fragment.append(document.createTextNode(segment.text.slice(cursor)));
        container.append(fragment);
      }

      function renderTranscript() {
        const fragment = document.createDocumentFragment();
        rows = segments.map((segment, index) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "segment";
          row.dataset.index = String(index);
          row.setAttribute("aria-label", `${formatTime(segment.start_ms)} ${segment.speaker ? `${segment.speaker}：` : ""}${segment.text}`);

          const time = document.createElement("time");
          time.textContent = formatTime(segment.start_ms);
          const body = document.createElement("span");
          body.className = "segment-body";
          if (segment.speaker) {
            const speaker = document.createElement("span");
            speaker.className = "speaker";
            speaker.textContent = segment.speaker;
            body.append(speaker);
          }
          const sentence = document.createElement("span");
          if (segment.words.length) appendSentence(sentence, segment);
          else sentence.textContent = segment.text;
          body.append(sentence);
          row.append(time, body);
          fragment.append(row);
          return row;
        });
        transcript.replaceChildren(fragment);
        filterTranscript();
      }

      function filterTranscript() {
        const term = normalizedText(search.value.trim());
        filteredCount = 0;
        rows.forEach((row, index) => {
          const segment = segments[index];
          const visible = !term || normalizedText(`${segment.speaker} ${segment.text}`).includes(term);
          row.hidden = !visible;
          if (visible) filteredCount += 1;
        });
        count.textContent = term ? `找到 ${filteredCount} 条 · 共 ${rows.length} 条` : `共 ${rows.length} 条`;
        empty.hidden = filteredCount !== 0;
        transcript.hidden = filteredCount === 0;
      }

      function indexAt(ms) {
        let low = 0;
        let high = segments.length - 1;
        let candidate = -1;
        while (low <= high) {
          const middle = (low + high) >> 1;
          if (segments[middle].start_ms <= ms) {
            candidate = middle;
            low = middle + 1;
          } else {
            high = middle - 1;
          }
        }
        return candidate >= 0 && ms <= segments[candidate].end_ms ? candidate : -1;
      }

      function scrollToRow(row) {
        if (!row || row.hidden) return;
        const upper = row.offsetTop - transcript.offsetTop;
        const lower = upper + row.offsetHeight;
        const currentUpper = transcript.scrollTop;
        const currentLower = currentUpper + transcript.clientHeight;
        if (upper < currentUpper || lower > currentLower) {
          transcript.scrollTo({ top: Math.max(0, upper - transcript.clientHeight * .35), behavior: "smooth" });
        }
      }

      function updateCurrent() {
        const ms = audio.currentTime * 1000;
        clock.textContent = `${formatTime(ms)} / ${formatTime(durationMs)}`;
        const index = indexAt(ms);
        if (index !== activeIndex) {
          if (activeIndex >= 0) {
            rows[activeIndex].classList.remove("active");
            rows[activeIndex].removeAttribute("aria-current");
          }
          activeIndex = index;
          if (index >= 0) {
            rows[index].classList.add("active");
            rows[index].setAttribute("aria-current", "true");
            if (followPlayback) scrollToRow(rows[index]);
          }
        }

        if (activeWord) activeWord.classList.remove("word-active");
        activeWord = null;
        if (index >= 0) {
          const words = rows[index].querySelectorAll("[data-word-start]");
          for (const word of words) {
            if (ms >= Number(word.dataset.wordStart) && ms <= Number(word.dataset.wordEnd)) {
              activeWord = word;
              word.classList.add("word-active");
              break;
            }
          }
        }
      }

      function seekTo(ms) {
        const seconds = Math.max(0, ms / 1000);
        audio.currentTime = seconds;
        updateCurrent();
        const playback = audio.play();
        if (playback && typeof playback.catch === "function") playback.catch(() => {});
      }

      async function load() {
        error.hidden = true;
        player.hidden = true;
        loading.hidden = false;
        $("audio-error").hidden = true;
        if ((!embeddedData || !embeddedAudioUrl) && (!id || !key)) {
          showError("播放链接不完整。请从课程页面重新打开。");
          return;
        }
        try {
          let data = embeddedData;
          if (!data) {
            const response = await fetch(`${recordingPath}/public${query}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            data = await response.json();
          }
          if (!data || !Array.isArray(data.segments)) throw new Error("Invalid transcript");

          segments = data.segments.map(normalizeSegment).filter(Boolean)
            .sort((a, b) => a.start_ms - b.start_ms);
          durationMs = Number(data.duration_ms) || 0;
          if (!durationMs && segments.length) durationMs = segments.at(-1).end_ms;
          $("title").textContent = String(data.title || "课堂录音");
          document.title = `${$("title").textContent} · 逐字稿`;
          durationLabel.textContent = durationMs ? `录音时长 ${formatTime(durationMs)}` : "点击逐字稿回听";
          clock.textContent = `00:00 / ${formatTime(durationMs)}`;
          audio.src = embeddedAudioUrl || `${recordingPath}/audio${query}`;
          renderTranscript();
          loading.hidden = true;
          player.hidden = false;
        } catch (_) {
          showError("录音或逐字稿暂时无法加载。请检查链接是否有效，然后重试。");
        }
      }

      transcript.addEventListener("click", (event) => {
        const row = event.target.closest(".segment");
        if (!row) return;
        const segment = segments[Number(row.dataset.index)];
        const word = event.target.closest("[data-word-start]");
        seekTo(word ? Number(word.dataset.wordStart) : segment.start_ms);
      });
      search.addEventListener("input", filterTranscript);
      search.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          search.value = "";
          filterTranscript();
        }
      });
      followButton.addEventListener("click", () => {
        followPlayback = !followPlayback;
        followButton.setAttribute("aria-pressed", String(followPlayback));
        if (followPlayback && activeIndex >= 0) scrollToRow(rows[activeIndex]);
      });
      audio.addEventListener("timeupdate", updateCurrent);
      audio.addEventListener("seeked", updateCurrent);
      audio.addEventListener("loadedmetadata", () => {
        if (!durationMs && Number.isFinite(audio.duration)) {
          durationMs = Math.round(audio.duration * 1000);
          durationLabel.textContent = `录音时长 ${formatTime(durationMs)}`;
        }
        updateCurrent();
      });
      audio.addEventListener("error", () => { $("audio-error").hidden = false; });
      $("retry").addEventListener("click", load);
      load();
    })();
  </script>
</body>
