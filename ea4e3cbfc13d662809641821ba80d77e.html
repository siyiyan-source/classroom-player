<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>课堂录音与逐字稿</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      --ink: #222b29;
      --muted: #68736f;
      --border: #e5e9e5;
      --accent: #216d5d;
      --accent-soft: #eaf5f0;
      --surface: #fff;
      --page: #f7f9f7;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 260px; margin: 0; }
    body { background: var(--page); color: var(--ink); line-height: 1.6; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .shell { width: 100%; max-width: 960px; margin: 0 auto; padding: clamp(12px, 3vw, 28px); }
    .card { overflow: hidden; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 28px rgba(27, 53, 43, .05); }
    .top { padding: clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--border); }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(18px, 2.8vw, 25px); line-height: 1.4; overflow-wrap: anywhere; }
    .subline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 6px; color: var(--muted); font-size: 13px; }
    .time-readout { font-variant-numeric: tabular-nums; }
    .audio-error { margin: 9px 0 0; color: #9b3f35; font-size: 13px; }
    audio { display: block; width: 100%; height: 42px; margin-top: 17px; accent-color: var(--accent); }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 13px clamp(16px, 3vw, 28px); border-bottom: 1px solid var(--border); }
    .search-wrap { position: relative; flex: 1 1 220px; }
    .search-wrap svg { position: absolute; top: 50%; left: 12px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #search { display: block; width: 100%; height: 38px; padding: 0 13px 0 38px; border: 1px solid #d9e1dc; border-radius: 9px; outline: none; background: #fff; color: var(--ink); }
    #search:focus-visible, .quiet-button:focus-visible, .segment:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #search::placeholder { color: #8a948f; }
    .quiet-button { min-height: 38px; padding: 6px 11px; border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--accent); font-size: 13px; font-weight: 600; white-space: nowrap; }
    .quiet-button:hover { background: var(--accent-soft); }
    .quiet-button[aria-pressed="true"] { border-color: #b9d6c9; background: var(--accent-soft); }
    .result-count { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .transcript { max-height: min(62vh, 650px); min-height: 160px; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
    .segment { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; width: 100%; margin: 0; padding: 15px clamp(16px, 3vw, 28px); border: 0; border-bottom: 1px solid #f0f2ef; border-left: 3px solid transparent; border-radius: 0; background: transparent; color: inherit; text-align: left; }
    .segment:hover { background: #f7faf8; }
    .segment.active { border-left-color: var(--accent); background: var(--accent-soft); }
    .segment time { padding-top: 1px; color: var(--accent); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
    .segment-body { min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
    .speaker { display: inline-block; margin-right: 7px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .word { border-radius: 3px; }
    .word:hover { background: #d1e8dc; }
    .word.word-active { background: #c4e5d4; box-shadow: 0 0 0 2px #c4e5d4; }
    .empty { padding: 44px 18px; color: var(--muted); text-align: center; font-size: 14px; }
    .state { padding: 54px 24px; text-align: center; }
    .state h2 { margin: 0 0 6px; font-size: 17px; }
    .state p { margin: 0 auto 18px; max-width: 35em; color: var(--muted); font-size: 14px; }
    .state .quiet-button { padding: 8px 18px; }
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      .shell { padding: 0; }
      .card { border-radius: 0; box-shadow: none; }
      .segment { grid-template-columns: 62px minmax(0, 1fr); gap: 5px; }
      .result-count { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="card">
      <section id="loading" class="state" role="status">
        <h2>正在打开课堂录音…</h2>
        <p>逐字稿加载后就可以点击文字回听。</p>
      </section>

      <section id="error" class="state" role="alert" hidden>
        <h2>暂时无法打开这份录音</h2>
        <p id="error-message">请稍后重试。</p>
        <button id="retry" class="quiet-button" type="button">重新加载</button>
      </section>

      <div id="player" hidden>
        <header class="top">
          <p class="eyebrow">课堂录音 · 逐字稿</p>
          <h1 id="title">课堂录音</h1>
          <div class="subline">
            <span id="duration">录音时长加载中</span>
            <span class="time-readout" id="clock">00:00 / 00:00</span>
            <span>点击逐字稿可从对应位置播放</span>
          </div>
          <audio id="audio" controls preload="metadata" aria-label="课堂录音播放器"></audio>
          <p id="audio-error" class="audio-error" role="alert" hidden>录音暂时无法播放，请稍后重新打开课程页面。</p>
        </header>

        <div class="toolbar">
          <label class="search-wrap">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg>
            <input id="search" type="search" placeholder="搜索逐字稿" aria-label="搜索逐字稿" autocomplete="off">
          </label>
          <button id="follow" class="quiet-button" type="button" aria-pressed="true" title="播放时自动定位当前句">跟随播放</button>
          <span id="result-count" class="result-count"></span>
        </div>

        <div id="transcript" class="transcript" role="region" aria-label="逐字稿"></div>
        <div id="empty" class="empty" hidden>没有找到匹配的内容。试试其他关键词。</div>
      </div>
    </div>
  </main>

  <script>window.RECORDING_DATA={"title":"AI辅助编程--第一节课","duration_ms":5197760,"segments":[{"start_ms":1000,"end_ms":7920,"text":"总的来说，调研下来，大家都接触过这些 AI 工具，","speaker":"","sentence_id":null,"words":[]},{"start_ms":7920,"end_ms":18300,"text":"也初步用它做过编程这样的任务。 也能看到，大家的基础还是有差别的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":18300,"end_ms":25279,"text":"我们这门课希望的是什么？不管大家基础怎么样，","speaker":"","sentence_id":null,"words":[]},{"start_ms":25279,"end_ms":34108,"text":"咱们在课上能够比较系统地掌握 AI 编程的方法，做一个实践。","speaker":"","sentence_id":null,"words":[]},{"start_ms":34108,"end_ms":39000,"text":"这是咱们这门课想要达到的目标。","speaker":"","sentence_id":null,"words":[]},{"start_ms":39000,"end_ms":45284,"text":"我在做调研的时候，还问了大家一些问题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":45284,"end_ms":55338,"text":"也是想在课程当中能够帮到大家。 第一个不说了，从第二个开始，","speaker":"","sentence_id":null,"words":[]},{"start_ms":55338,"end_ms":65128,"text":"是大家的一些期望， 以及对于现在 AI 编程的一些思考和想法。","speaker":"","sentence_id":null,"words":[]},{"start_ms":65128,"end_ms":73264,"text":"最高的期望，是能够像专业人士一样进行 AI 开发。","speaker":"","sentence_id":null,"words":[]},{"start_ms":73264,"end_ms":80342,"text":"最核心的，大家也都提到了，就是人机协作。","speaker":"","sentence_id":null,"words":[]},{"start_ms":80342,"end_ms":86692,"text":"这是目前这个阶段使用 AI 最主流的方式，","speaker":"","sentence_id":null,"words":[]},{"start_ms":86692,"end_ms":92000,"text":"涉及怎么样去指挥或者驾驭 AI。","speaker":"","sentence_id":null,"words":[]},{"start_ms":92000,"end_ms":101550,"text":"顾虑，大家也都提到了。 稍微多一点编程的体验以后，就能感觉到，","speaker":"","sentence_id":null,"words":[]},{"start_ms":101550,"end_ms":110066,"text":"如果放任着跟它瞎聊， 项目规模慢慢大起来之后，代码的质量，","speaker":"","sentence_id":null,"words":[]},{"start_ms":110066,"end_ms":118521,"text":"包括你对它的可控性，都会有问题。所谓可控性是什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":118521,"end_ms":128679,"text":"是你对它的了解。比如加一个新功能之后， 会不会出现按下葫芦浮起瓢，","speaker":"","sentence_id":null,"words":[]},{"start_ms":128679,"end_ms":137316,"text":"这边好了，那边又出错了的问题？ 项目变大以后，维护失控，","speaker":"","sentence_id":null,"words":[]},{"start_ms":137316,"end_ms":142000,"text":"还有认知债，人的理解跟不上。","speaker":"","sentence_id":null,"words":[]},{"start_ms":142000,"end_ms":150431,"text":"刚才说的，AI 能不断地给你吐出代码来。 它吐出来的代码，","speaker":"","sentence_id":null,"words":[]},{"start_ms":150431,"end_ms":160470,"text":"你到底有没有了解？当然， 我不是说你必须对里面每一行代码都有了解，","speaker":"","sentence_id":null,"words":[]},{"start_ms":160470,"end_ms":166000,"text":"但是你能不能对它有一个整体的了解？","speaker":"","sentence_id":null,"words":[]},{"start_ms":166000,"end_ms":170237,"text":"打一个比方，大家可以想象一下，","speaker":"","sentence_id":null,"words":[]},{"start_ms":170237,"end_ms":176000,"text":"有点像大型工程项目里面总设计师的角色。","speaker":"","sentence_id":null,"words":[]},{"start_ms":176000,"end_ms":180802,"text":"比如长征五号火箭，长征五号的总师，","speaker":"","sentence_id":null,"words":[]},{"start_ms":180802,"end_ms":189785,"text":"你说他对于火箭里面每一条线路是不是都知道？ 我觉得他做不到。","speaker":"","sentence_id":null,"words":[]},{"start_ms":189785,"end_ms":196565,"text":"但是火箭一共有多少个模块，每个模块负责什么任务，","speaker":"","sentence_id":null,"words":[]},{"start_ms":196565,"end_ms":206000,"text":"模块之间是怎么样耦合的， 这些东西作为总设计师，他心里一定得门清。","speaker":"","sentence_id":null,"words":[]},{"start_ms":206000,"end_ms":216745,"text":"这样类比，你去指挥 AI 写代码， 至少在代码的顶级模块这一层，","speaker":"","sentence_id":null,"words":[]},{"start_ms":216745,"end_ms":225355,"text":"你要了解它。模块之间是怎么交流、怎么沟通的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":225355,"end_ms":234333,"text":"这些事情你是不是了解？如果要成为一个专业人士，","speaker":"","sentence_id":null,"words":[]},{"start_ms":234333,"end_ms":240000,"text":"这样的素质和能力还是要有的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":240000,"end_ms":246122,"text":"另外，今天这节课完了之后，就要开始选一个项目。","speaker":"","sentence_id":null,"words":[]},{"start_ms":246122,"end_ms":252245,"text":"我们一共也就八周时间，时间挺快的。八周的时间，","speaker":"","sentence_id":null,"words":[]},{"start_ms":252245,"end_ms":259371,"text":"我们做好一个项目就可以了。 我希望大家选一个自己感兴趣，","speaker":"","sentence_id":null,"words":[]},{"start_ms":259371,"end_ms":267250,"text":"或者对自己真正有帮助的项目去做。 对你有帮助的项目，一般来说，","speaker":"","sentence_id":null,"words":[]},{"start_ms":267250,"end_ms":275379,"text":"对周围的同学十有八九也有帮助。 你写出来的东西以后能够造福人类，","speaker":"","sentence_id":null,"words":[]},{"start_ms":275379,"end_ms":281000,"text":"造福身边的同学，我想也是一件非常好的事情。","speaker":"","sentence_id":null,"words":[]},{"start_ms":281000,"end_ms":290786,"text":"大家也提到了，怎么和专业、 科研结合，还有完整的工程流程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":290786,"end_ms":300238,"text":"这些东西，我们后面的课程会逐步来讲。 大家提的这些问题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":300238,"end_ms":308027,"text":"会在接下来的每次课里面，尝试回答其中一部分。","speaker":"","sentence_id":null,"words":[]},{"start_ms":308027,"end_ms":318877,"text":"这样，这门课可能不那么系统。 说实话，我觉得 AI 现在发展的速度，","speaker":"","sentence_id":null,"words":[]},{"start_ms":318877,"end_ms":326000,"text":"很难让我现在就整理出一个特别系统的提纲。","speaker":"","sentence_id":null,"words":[]},{"start_ms":326000,"end_ms":334611,"text":"至少结合我们的实践， 讨论哪些方面是有用的，每个方面要注意什么，","speaker":"","sentence_id":null,"words":[]},{"start_ms":334611,"end_ms":342778,"text":"有哪些思维，或者需要思考的东西， 这些咱们可以一起来探讨。","speaker":"","sentence_id":null,"words":[]},{"start_ms":342778,"end_ms":350111,"text":"当然，还有一个关于节奏的问题。有同学提了不要太快，","speaker":"","sentence_id":null,"words":[]},{"start_ms":350111,"end_ms":359222,"text":"有同学提了可以稍微快一点。 总的来说，我们还是把握整体的进度。","speaker":"","sentence_id":null,"words":[]},{"start_ms":359222,"end_ms":365889,"text":"对于稍微快一点或者慢一点的同学，咱们想其他办法，","speaker":"","sentence_id":null,"words":[]},{"start_ms":365889,"end_ms":371000,"text":"可以在课下进一步交流。咱们这门课，","speaker":"","sentence_id":null,"words":[]},{"start_ms":371000,"end_ms":381443,"text":"一共是八周，一个学分。 上学期我们系里一堆老师在讨论的时候，","speaker":"","sentence_id":null,"words":[]},{"start_ms":381443,"end_ms":390856,"text":"那会儿比现在还要乐观一点。不知道大家有没有这个感觉，","speaker":"","sentence_id":null,"words":[]},{"start_ms":390856,"end_ms":399427,"text":"2026 年过年回来，觉得好像 AI 一下子什么都能干了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":399427,"end_ms":403000,"text":"到处说的都是这个。","speaker":"","sentence_id":null,"words":[]},{"start_ms":403000,"end_ms":408107,"text":"比如那些没有学过编程的文科专业的人，","speaker":"","sentence_id":null,"words":[]},{"start_ms":408107,"end_ms":417130,"text":"咱们今天文科专业的同学应该基本上没有。 豪心，心理算偏文科？","speaker":"","sentence_id":null,"words":[]},{"start_ms":417130,"end_ms":424904,"text":"你们其实也有很多理工科的思维方式。很多文科背景的人，","speaker":"","sentence_id":null,"words":[]},{"start_ms":424904,"end_ms":432962,"text":"都可以写一些代码，都可以上线了。 也是那个时候一起讨论，","speaker":"","sentence_id":null,"words":[]},{"start_ms":432962,"end_ms":439658,"text":"觉得 AI 在编程开发任务上，的确能做得挺好了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":439658,"end_ms":448000,"text":"为什么能做得挺好， 咱们一会儿也会稍微涉及里面的一些理论。","speaker":"","sentence_id":null,"words":[]},{"start_ms":448000,"end_ms":455088,"text":"我们讨论，是不是有可能开这么一门课。 我在规划这门课的时候，","speaker":"","sentence_id":null,"words":[]},{"start_ms":455088,"end_ms":462876,"text":"特意选了一个学分。第一， 我觉得内容本身不算特别多，可能一个学分，","speaker":"","sentence_id":null,"words":[]},{"start_ms":462876,"end_ms":466000,"text":"八次课，基本上也就够了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":466000,"end_ms":473486,"text":"第二，还有一个原因。 我之前开过一门全校的通识课，叫《计算思维》，","speaker":"","sentence_id":null,"words":[]},{"start_ms":473486,"end_ms":477386,"text":"是两个学分的。结果有好几个院系，","speaker":"","sentence_id":null,"words":[]},{"start_ms":477386,"end_ms":484648,"text":"把这门课放到他们培养方案里面去了。 我本来希望大家来自各个专业，","speaker":"","sentence_id":null,"words":[]},{"start_ms":484648,"end_ms":491821,"text":"不同专业背景还可以碰撞一下， 结果后来我的课堂就只有两个专业的同学","speaker":"","sentence_id":null,"words":[]},{"start_ms":491821,"end_ms":498859,"text":"，跟我当初设计时的初衷非常不一样。 我觉得把它设计成一个学分，","speaker":"","sentence_id":null,"words":[]},{"start_ms":498859,"end_ms":505000,"text":"估计院系可能还是看不上的，这样可以保证课程的多样性。","speaker":"","sentence_id":null,"words":[]},{"start_ms":505000,"end_ms":509076,"text":"时间上，我挑选的时候也稍微考虑了一下。","speaker":"","sentence_id":null,"words":[]},{"start_ms":509076,"end_ms":513751,"text":"大部分八周的课，要么是前八周，要么是后八周。","speaker":"","sentence_id":null,"words":[]},{"start_ms":513751,"end_ms":520584,"text":"我特别挑了第五周到第十二周。 怎么想的？一是把国庆假期刨过去。","speaker":"","sentence_id":null,"words":[]},{"start_ms":520584,"end_ms":526978,"text":"刚才有几位同学来得早， 这边还坐了另外几位同学，说也是这个教室的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":526978,"end_ms":533332,"text":"但不是这门课。原因是什么？ 他们是前四周的一门公管学院的课，","speaker":"","sentence_id":null,"words":[]},{"start_ms":533332,"end_ms":539326,"text":"因为中间国庆跳掉了一次， 四次课跳掉一次，他们那课就没法弄了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":539326,"end_ms":545000,"text":"所以本来今天晚上还要补一次， 他以为这个教室还能继续用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":545000,"end_ms":553178,"text":"另外，时间在第五到第十二周， 期末相对就没有什么压力了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":553178,"end_ms":562796,"text":"咱们到第十二周把课结掉， 主要还是让大家在中间能够比较充分地参与。","speaker":"","sentence_id":null,"words":[]},{"start_ms":562796,"end_ms":570686,"text":"教室，我后面再问问注册中心，有没有更宽敞一点的教室。","speaker":"","sentence_id":null,"words":[]},{"start_ms":570686,"end_ms":578000,"text":"每次大家都过来的话，我觉得坐得还是稍微有点拥挤。","speaker":"","sentence_id":null,"words":[]},{"start_ms":578000,"end_ms":583850,"text":"另外，咱们这门课需要大家具备一定的编程基础。","speaker":"","sentence_id":null,"words":[]},{"start_ms":583850,"end_ms":590100,"text":"基本上都是理工科的同学，刚才我问了早到的同学一圈，","speaker":"","sentence_id":null,"words":[]},{"start_ms":590100,"end_ms":595875,"text":"基本上都学过 C 语言或者 C++，包括 Python。","speaker":"","sentence_id":null,"words":[]},{"start_ms":595875,"end_ms":603150,"text":"前面调研的时候，大家也基本掌握 C 语言、 C++ 和 Python。","speaker":"","sentence_id":null,"words":[]},{"start_ms":603150,"end_ms":609000,"text":"当然，我们说实际的开发工作，肯定还是不够的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":609000,"end_ms":616073,"text":"所以问卷后面我又写了几种别的语言，包括 Java、C++，","speaker":"","sentence_id":null,"words":[]},{"start_ms":616073,"end_ms":624413,"text":"一般做业务后端用得多一些。 还有 JavaScript、TypeScript，","speaker":"","sentence_id":null,"words":[]},{"start_ms":624413,"end_ms":632029,"text":"主要是浏览器前端用得多一点。另外还有 Go 或者 Rust，","speaker":"","sentence_id":null,"words":[]},{"start_ms":632029,"end_ms":639102,"text":"这两种语言发明得比较晚，但是近些年发展得比较快。","speaker":"","sentence_id":null,"words":[]},{"start_ms":639102,"end_ms":645520,"text":"当然也有各自的特点，这边不展开讲。AI 编程，","speaker":"","sentence_id":null,"words":[]},{"start_ms":645520,"end_ms":654208,"text":"尤其要做专业的 AI 编程， 对于个人编程能力，包括系统能力的要求，","speaker":"","sentence_id":null,"words":[]},{"start_ms":654208,"end_ms":660000,"text":"反而可能会更高。咱们后面还会继续说。","speaker":"","sentence_id":null,"words":[]},{"start_ms":660000,"end_ms":667662,"text":"我们课程团队是这样子的。 我是主要的授课教师，叫韩文涛，","speaker":"","sentence_id":null,"words":[]},{"start_ms":667662,"end_ms":672626,"text":"是计算机系的老师。这里有我的主页，","speaker":"","sentence_id":null,"words":[]},{"start_ms":672626,"end_ms":680288,"text":"大家感兴趣可以回头到我主页上看看。 我是教学系列的老师，","speaker":"","sentence_id":null,"words":[]},{"start_ms":680288,"end_ms":687410,"text":"主要做教学工作。除了教学之外，还指导一些科创团队，","speaker":"","sentence_id":null,"words":[]},{"start_ms":687410,"end_ms":693723,"text":"包括学校的超算团队，还有算协，就是算法协会。","speaker":"","sentence_id":null,"words":[]},{"start_ms":693723,"end_ms":701115,"text":"子涵在的天格，我也参与过一点，虽然最近参与得比较少。","speaker":"","sentence_id":null,"words":[]},{"start_ms":701115,"end_ms":705000,"text":"这方面相对做的工作多一些。","speaker":"","sentence_id":null,"words":[]},{"start_ms":705000,"end_ms":711283,"text":"我们课程团队阵容还是挺庞大的，而且都比较资深。","speaker":"","sentence_id":null,"words":[]},{"start_ms":711283,"end_ms":718339,"text":"我这边写了三位助教。一位是陈佳杰，是我们计算机系的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":718339,"end_ms":724622,"text":"现在已经是博士后了。第二位是世博源，国源在这，","speaker":"","sentence_id":null,"words":[]},{"start_ms":724622,"end_ms":730391,"text":"国源是我们计算机系的硕士生。第三位王自强，","speaker":"","sentence_id":null,"words":[]},{"start_ms":730391,"end_ms":738991,"text":"也是我们计算机系的博士后。 另外还有徐晓明老师，在我们教学实验室，","speaker":"","sentence_id":null,"words":[]},{"start_ms":738991,"end_ms":745275,"text":"后面也会一起来参与教学工作。大家选题都不一样，","speaker":"","sentence_id":null,"words":[]},{"start_ms":745275,"end_ms":753000,"text":"后面很多东西需要充分交流， 能够不断迭代，体会在这个过程当中，","speaker":"","sentence_id":null,"words":[]},{"start_ms":753000,"end_ms":761382,"text":"到底怎么样能够指挥好 AI、 使用好它。所以大家看后面的安排，","speaker":"","sentence_id":null,"words":[]},{"start_ms":761382,"end_ms":767798,"text":"和课程团队之间的交流，包括同学相互之间的交流，","speaker":"","sentence_id":null,"words":[]},{"start_ms":767798,"end_ms":775273,"text":"是这门课比较强调的。课程教学目标大概有三个方面。","speaker":"","sentence_id":null,"words":[]},{"start_ms":775273,"end_ms":783195,"text":"第一个方面，是掌握原理和方法。 原理和方法还在不断发展，","speaker":"","sentence_id":null,"words":[]},{"start_ms":783195,"end_ms":792289,"text":"但肯定有一些东西已经成型了。 要掌握 AI 辅助编程的一些基本原理，","speaker":"","sentence_id":null,"words":[]},{"start_ms":792289,"end_ms":798704,"text":"合理使用主流工具，进行代码的生成、理解和优化，","speaker":"","sentence_id":null,"words":[]},{"start_ms":798704,"end_ms":803000,"text":"建立人机协同编程的思维方式。","speaker":"","sentence_id":null,"words":[]},{"start_ms":803000,"end_ms":808110,"text":"第二个，是具备关键环节的能力。","speaker":"","sentence_id":null,"words":[]},{"start_ms":808110,"end_ms":818080,"text":"这可能是大家自己所谓打引号的“瞎搞”， 跟经过训练最大的一个区别：","speaker":"","sentence_id":null,"words":[]},{"start_ms":818080,"end_ms":824000,"text":"咱们要有一些一听起来就觉得比较正式的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":824000,"end_ms":829710,"text":"做法和环节。比如利用 AI 完成需求分析。","speaker":"","sentence_id":null,"words":[]},{"start_ms":829710,"end_ms":837860,"text":"大家自己随便弄一弄的时候， 不太会形成一个正式的、成文的东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":837860,"end_ms":846165,"text":"需求在哪儿？都在我的脑子里面。 但是要跟 AI 把事情交代清楚，","speaker":"","sentence_id":null,"words":[]},{"start_ms":846165,"end_ms":854743,"text":"就不能只在你的脑子里面。 AI 没办法跑到你脑子里面，把需求弄明白，","speaker":"","sentence_id":null,"words":[]},{"start_ms":854743,"end_ms":859000,"text":"所以一定要形成一个成文的东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":859000,"end_ms":866354,"text":"成文的东西怎么来？不见得非得你一个字一个字去码，","speaker":"","sentence_id":null,"words":[]},{"start_ms":866354,"end_ms":874345,"text":"可以通过和 AI 不断对话， 去启发它，它也会反过来问你。","speaker":"","sentence_id":null,"words":[]},{"start_ms":874345,"end_ms":880541,"text":"有些细节没有想清楚，它会问你具体怎么弄。","s 整理成比较符合规范的情况。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1008000,"end_ms":1014542,"text":"还有刚才说到的测试生成。代码重构和测试生成，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1014542,"end_ms":1021083,"text":"是咱们平时比较随意的开发中，做得相对较少的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1021083,"end_ms":1032000,"text":"最后面这一小句，我觉得最重要： 对生成结果进行有效的评估与控制。我自己用 AI，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1032000,"end_ms":1039901,"text":"不管是编程，还是咱们课程的备课，收集到各种素材，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1039901,"end_ms":1047555,"text":"也是用一个 Agent 帮我整理。在这个过程当中，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1047555,"end_ms":1056130,"text":"对人来说最难的部分是什么？AI 吐出一大堆东西之后，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1056130,"end_ms":1064492,"text":"我怎么样检查它的质量是不是过关？文本内容是一种，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1064492,"end_ms":1073841,"text":"程序代码又是另一种。 在这个基础上，比如它有失控的趋势，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1073841,"end_ms":1081544,"text":"我有什么办法让它尽量收敛，在我们的掌控之中？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1081544,"end_ms":1093000,"text":"这是一些非常重要的关键环节的能力。 第三个，就是培养工程实践能力。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1093000,"end_ms":1098512,"text":"我们整个课程，总体上就是一个项目。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1098512,"end_ms":1106659,"text":"希望大家每个人独立完成一个基 于 AI 辅助的完整开发项目，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1106659,"end_ms":1116065,"text":"完成以后，理解里面用到的相关技术的局限性， 包括存在的风险等。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1116065,"end_ms":1121876,"text":"这是我想达到的三个目标。能不能达到，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1121876,"end_ms":1127866,"text":"一方面看我能怎么样讲这些东西，另一方面，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1127866,"end_ms":1137571,"text":"更重要的还是靠大家自己体会。 尤其在做项目的过程当中，不断领悟，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1137571,"end_ms":1145000,"text":"这也是学习和训练的过程。总体安排大概是这样。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1145000,"end_ms":1153221,"text":"接下来的三周，我会先讲三讲。 这三讲是 AI 开发里面比较基础的内容","speaker":"","sentence_id":null,"words":[]},{"start_ms":1153221,"end_ms":1161392,"text":"，其实主要是第二讲和第三讲， 因为今天具体的东西可能讲得少一点。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1161392,"end_ms":1167797,"text":"第四讲，我会请陈佳杰老师来给大家讲。暑假的时候，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1167797,"end_ms":1173951,"text":"计算机系有一门小学期的课，叫《程序设计训练》。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1173951,"end_ms":1179599,"text":"我负责其中一个课堂。我们平行有好几个课堂，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1179599,"end_ms":1188022,"text":"每个课堂都要学习一门新的语言。 计算机系大一的秋季学期和春季学期，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1188022,"end_ms":1194831,"text":"分别学的是《程序设计基础》 和《面向对象程序设计基础》，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1194831,"end_ms":1197000,"text":"用的都是 C++。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1197000,"end_ms":1204982,"text":"到暑假的时候，我们会学一门新的语言。 我负责的课堂，用的是 Rust。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1204982,"end_ms":1210295,"text":"今年我们做了一次非常大的调整，原因大家也知道，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1210295,"end_ms":1215054,"text":"现在 AI 能力太强了。原来的两个大作业，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1215054,"end_ms":1222274,"text":"拿 Agent 几分钟基本就能搞定。 上次试过，我记得好像是八分钟、","speaker":"","sentence_id":null,"words":[]},{"start_ms":1222274,"end_ms":1225000,"text":"九分钟。因为什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1225000,"end_ms":1234046,"text":"因为之前的助教团队太给力了，文档写得实在太完整了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1234046,"end_ms":1244000,"text":"文档一完整，你直接把文档塞给 AI， 它照着基本就能做出来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1244000,"end_ms":1251931,"text":"面对这个情况，我们讨论完以后做了比较大的调整，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1251931,"end_ms":1261586,"text":"把两个固定命题的大作业都去掉了， 甚至其中一个变成小作业，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1261586,"end_ms":1270759,"text":"可以用 AI 去完成。我们又重新设计了一个新的大作业，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1270759,"end_ms":1278000,"text":"是半开放命题的，让大家观察自己平时在使用，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1278000,"end_ms":1284888,"text":"通用 AI Agent 的时候，不管是 Claude Code、Codex，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1284888,"end_ms":1293469,"text":"包括今天主要介绍的 OpenCode， 这种通用 Agent 大家用得多一点。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1293469,"end_ms":1300996,"text":"在这里面，是不是有一些任务， 通用 Agent 其实做得不好？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1300996,"end_ms":1309630,"text":"当然有两种：一种是效果不好； 第二种是虽然能做出来，但步骤很烦，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1309630,"end_ms":1314000,"text":"很多提示词得不停重复地跟它说。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1314000,"end_ms":1322469,"text":"针对某个专用领域，不管是打游戏，还是学某个具体科目，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1322469,"end_ms":1333347,"text":"同学们做了很多很有意思的尝试。 大家感兴趣，从我的主页能链接过去，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1333347,"end_ms":1339992,"text":"看看暑假的优秀作品。有一个我印象很深，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1339992,"end_ms":1348591,"text":"是做《写作与沟通》课选题启发的。它通过跟你的对话，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1348591,"end_ms":1356864,"text":"能够生成一个《写作与沟通》课的选题。这个过程中，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1356864,"end_ms":1366635,"text":"大概有七十多位同学做了这个作业， 我们收集到了一些第一手材料，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1366635,"end_ms":1371000,"text":"后面会整理一下这些东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1371000,"end_ms":1379750,"text":"第四讲给大家讲一讲， 基于这门课的教学，有什么经验和教训，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1379750,"end_ms":1390188,"text":"也看看能给大家什么启示。后面的第五、 六、七讲，是看起来比较严肃、","speaker":"","sentence_id":null,"words":[]},{"start_ms":1390188,"end_ms":1397688,"text":"比较正规的事情，包括复杂任务分解、代码重构优化，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1397688,"end_ms":1407375,"text":"还有测试生成与验证。 没有 AI 的时候，这些是什么课的内容？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1407375,"end_ms":1413750,"text":"咱们有同学叫架桥，架桥是学软件工程的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1413750,"end_ms":1423250,"text":"我们计算机系也学软件工程课。 任务分解、代码重构、测试生成，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1423250,"end_ms":1429000,"text":"这些是传统软件工程非常核心的内容。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1429000,"end_ms":1437872,"text":"可以看到，在有 AI 辅助的阶段， 这些依然是非常重要的内容。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1437872,"end_ms":1446084,"text":"当然，具体的表现形式、具体怎么操作，可能会有些区别。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1446084,"end_ms":1451000,"text":"这是我们后半段课程主要学习的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1451000,"end_ms":1458682,"text":"最后第八讲，我们会留出时间，大概选十个左右，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1458682,"end_ms":1467202,"text":"前面这个阶段总体上感觉比较好的项目，来做展示。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1467202,"end_ms":1475233,"text":"这个展示，对于这十位同学是一方面，更重要的是，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1475233,"end_ms":1485848,"text":"我希望全体同学都参与评价。 包括我们会有一些客观指标的打分，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1485848,"end_ms":1498000,"text":"以及你对这些项目自己的主观评价。 这些都会作为整门课成绩的一部分。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1498000,"end_ms":1507134,"text":"说到考核，咱们就是这一个项目，把它分成六个部分。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1507134,"end_ms":1516988,"text":"分别是今天要做的选题和启动；后面几乎每周有一个迭代，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1516988,"end_ms":1524683,"text":"设置三个阶段的检查点。大概到第六讲左右，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1524683,"end_ms":1534537,"text":"整个项目就有一个相对成型的版本。我们会根据功能实现、","speaker":"","sentence_id":null,"words":[]},{"start_ms":1534537,"end_ms":1541873,"text":"代码质量进行评估，还要写一些相关报告。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1541873,"end_ms":1550000,"text":"当然，所有事情都是在 AI 的支持下来完成的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1550000,"end_ms":1560872,"text":"最后一节课，还会有同伴互评。 好像有个 Bug，鼠标指针移不过去了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1560872,"end_ms":1570913,"text":"我们一般是这样：比如每周二上完课， 当天布置下一个阶段的任务。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1570913,"end_ms":1578076,"text":"如果是一周的任务，就到这一周周日晚上截止；","speaker":"","sentence_id":null,"words":[]},{"start_ms":1578076,"end_ms":1585238,"text":"如果是两周的任务，就到下一周周日晚上截止。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1585238,"end_ms":1592913,"text":"我们会在截止之后的下一次课，根据大家完成的情况，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1592913,"end_ms":1599756,"text":"做一些简单的反馈、点评和讨论。整体来说，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1599756,"end_ms":1605000,"text":"就是一个和课程紧密绑定的项目。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1605000,"end_ms":1611697,"text":"通过项目驱动，设置多个项目检查点，边学边做。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1611697,"end_ms":1618337,"text":"我觉得现在有了 AI 之后，对于同学们的考核方式，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1618337,"end_ms":1626007,"text":"能够说服我自己的只有两种。第一种，还是传统考试。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1626007,"end_ms":1634020,"text":"不管闭卷考试、开卷考试， 还是计算机里面编程序的离线考试，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1634020,"end_ms":1639000,"text":"虽然是在电脑上，但是离线的考试。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1639000,"end_ms":1647874,"text":"考察的是，真正脱离 AI 辅助之后， 你脑子里面还剩多少。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1647874,"end_ms":1657729,"text":"前面学习的过程可以用 AI， 但脱离这些以后，这些学科本身的学理、","speaker":"","sentence_id":null,"words":[]},{"start_ms":1657729,"end_ms":1668274,"text":"思维方式，你还剩多少？这是一种。 还有一种，就是放开自由选题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1668274,"end_ms":1676441,"text":"大家把整个过程完整做一遍。这更像以后大家做科研，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1676441,"end_ms":1683000,"text":"或者走上工作岗位之后，要做的类似项目。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1683000,"end_ms":1690508,"text":"最后做项目的时候，一般来说， 第一，你要对自己的项目有评价、","speaker":"","sentence_id":null,"words":[]},{"start_ms":1690508,"end_ms":1698482,"text":"有展示；第二，很重要的是， 别人觉得你这个东西做得怎么样。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1698482,"end_ms":1704955,"text":"当然，很重要的一点，也是你要跟别人把东西介绍清楚，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1704955,"end_ms":1710236,"text":"到底有什么亮点，有哪些比较出彩的地方。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1710236,"end_ms":1715000,"text":"所以我们的考核大概就是这么设置的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1715000,"end_ms":1722369,"text":"可能有同学关心，要投入多少时间？我自己的评估，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1722369,"end_ms":1728409,"text":"因为每周就上这么两小节课，对应的工作量，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1728409,"end_ms":1738195,"text":"额外至少也要有一个时间段。 比如一个上午、一个下午或者一个晚上，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1738195,"end_ms":1747195,"text":"至少一个时间段肯定要有。 所以大家看一下自己的时间安排。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1747195,"end_ms":1755953,"text":"如果觉得负担太重，或者不合适， 我记得好像还有一次退课机会，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1755953,"end_ms":1760000,"text":"后面退课的时候可以退掉。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1760000,"end_ms":1771572,"text":"课堂上，能够演示、能够实操的过程， 我们也可以一起来试一试。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1771572,"end_ms":1783525,"text":"包括在实操过程中，真实出现了什么问题， 咱们可以及时沟通交流。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1783525,"end_ms":1793802,"text":"所以大家都带上自己的电脑， 每讲由我来讲解、做一些演示，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1793802,"end_ms":1797000,"text":"大家进行实操。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1797000,"end_ms":1804626,"text":"虽然是开放式项目，但是对于 AI 的使用，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1804626,"end_ms":1815509,"text":"也有使用规范和学术诚信方面的要求。经过一段时间实践，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1815509,"end_ms":1827266,"text":"我们觉得主要可以浓缩成两条。 第一条，你跟 AI 交互的过程，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1827266,"end_ms":1831000,"text":"得全程记录下来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1831000,"end_ms":1839937,"text":"每一次检查点，都需要提交你跟 AI 是如何交互的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1839937,"end_ms":1850036,"text":"现在的工具，基本都支持交互记录的导出。这是第一条。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1850036,"end_ms":1857810,"text":"第二条，不要提交没有经过本人审查的代码。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1857810,"end_ms":1868000,"text":"直接跟它说完，AI 一通输出， 我什么都不管，这是不行的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1868000,"end_ms":1874804,"text":"课程的渠道大概有几个。第一个，课程网站已经上线了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1874804,"end_ms":1882485,"text":"现在内容还不算太多， 后面会慢慢完善。第二个是网络学堂。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1882485,"end_ms":1889546,"text":"这两个是课程的正式渠道。所谓正式渠道，就是通知之类，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1889546,"end_ms":1893000,"text":"以这两个地方的内容为准。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1893000,"end_ms":1899345,"text":"第三个，我们还建了课程微信群。这是非正式渠道，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1899345,"end_ms":1904650,"text":"可能有同学还没进来，主要起提醒的作用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1904650,"end_ms":1911515,"text":"大家如果有心得，有什么东西想分享，也可以交流互动。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1911515,"end_ms":1915000,"text":"这是咱们课堂的一个约定。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1915000,"end_ms":1924204,"text":"接下来，简单看一下 AI 编程发展到现在， 是怎么样一步一步过来的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1924204,"end_ms":1931545,"text":"首先是编程方式的变化，从最早一切靠自己手写，到中间，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1931545,"end_ms":1940692,"text":"我相信在座的同学可能还经历过， 刚开始学编程，遇到错误了怎么办？","speaker":"","sentence_id":null,"words":[]},{"start_ms":1940692,"end_ms":1945887,"text":"到处找地方搜一搜，看看是什么问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1945887,"end_ms":1952000,"text":"这里面最著名的网站就是 Stack Overflow。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1952000,"end_ms":1958701,"text":"Stack Overflow 当年几乎收集了编程、运维、","speaker":"","sentence_id":null,"words":[]},{"start_ms":1958701,"end_ms":1966080,"text":"开发过程中可能出现的各种幺蛾子，这上面都有。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1966080,"end_ms":1973648,"text":"它把这些东西都收集起来之后，自己把自己给干废了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1973648,"end_ms":1980333,"text":"因为这些素材是训练 AI 编程能力最好的数据，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1980333,"end_ms":1989036,"text":"相当于自己给自己掘了坟墓。 一直到现在，就是 AI 生成、","speaker":"","sentence_id":null,"words":[]},{"start_ms":1989036,"end_ms":1992000,"text":"人机协同的时代。","speaker":"","sentence_id":null,"words":[]},{"start_ms":1992000,"end_ms":1998081,"text":"开发时间的分配发生了变化。最重要的是，","speaker":"","sentence_id":null,"words":[]},{"start_ms":1998081,"end_ms":2004639,"text":"直接写代码这部分的占比在下降，而评审、规划、","speaker":"","sentence_id":null,"words":[]},{"start_ms":2004639,"end_ms":2014715,"text":"验证所占的比例在上升。为什么？ 一方面，因为写代码的比例下降了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2014715,"end_ms":2024567,"text":"其他比例自然而然就上升了。另外， AI 生成代码太快了，相应的评审、","speaker":"","sentence_id":null,"words":[]},{"start_ms":2024567,"end_ms":2030350,"text":"规划、验证任务量也在变大。很多时候，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2030350,"end_ms":2035000,"text":"很多东西就不能用 AI 去做了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2035000,"end_ms":2043303,"text":"范式从手工编码， 或者现在经常说的“手搓代码”“古法编程”，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2043303,"end_ms":2050690,"text":"走向人机协同。这里大家最担心的是所谓烂尾现象。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2050690,"end_ms":2057390,"text":"如果只追求功能实现，所有问题都是治标不治本。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2057390,"end_ms":2062830,"text":"有个什么问题，就让它给我弄一下，这样，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2062830,"end_ms":2070103,"text":"所谓的“屎山代码”就会越堆越高，最后形成死代码。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2070103,"end_ms":2075657,"text":"专门有个词叫 AI slop，大家可以搜一下，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2075657,"end_ms":2084018,"text":"指 AI 吐出来的一大堆可能没有 那么有价值的东西，不管是代码，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2084018,"end_ms":2089000,"text":"还是文本内容，都有这个词来指代。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2089000,"end_ms":2096930,"text":"因此，在这个过程当中，给 AI 定好规矩、有一个规范，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2096930,"end_ms":2104293,"text":"比真的让它输出代码更加重要。对于开发者来说，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2104293,"end_ms":2112553,"text":"也从原来所谓的“码农”，变成一堆 Agent 的管理者。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2112553,"end_ms":2120546,"text":"大家知道“码农”这个词，现在再这么叫就不合适了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2120546,"end_ms":2126210,"text":"关键技能包括会委托、会评审、会规划，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2126210,"end_ms":2132000,"text":"还有能够用上下文工程管理相关信息。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2132000,"end_ms":2142218,"text":"如果大家还想从事 IT 相关行业，会发现这些能力，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2142218,"end_ms":2149000,"text":"正在成为招聘岗位要求的变化。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2149000,"end_ms":2157283,"text":"这里有一句可能大家在别的地方也听过的话： AI 越来越强，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2157283,"end_ms":2165302,"text":"我会不会被 AI 取代？一般来说，人不会被 AI 取代，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2165302,"end_ms":2175000,"text":"可能会被善用 AI 的其他人取代。 所以还是要掌握 AI 的使用。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2175000,"end_ms":2183308,"text":"我们课程的立场，只能代表到现在为止， 因为 AI 还在发展。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2183308,"end_ms":2191107,"text":"包括大家最近可能看到， OpenAI 抛出了七百多篇数学论文，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2191107,"end_ms":2195000,"text":"估计够数学圈子审好久了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2195000,"end_ms":2201814,"text":"AI 对于能够使用它的人来说，是能力的放大器。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2201814,"end_ms":2209500,"text":"就好比人类当年发明的望远镜之于眼睛，各种车辆之于腿，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2209500,"end_ms":2216121,"text":"但它不是替代品。我们会发现，读代码、调试、","speaker":"","sentence_id":null,"words":[]},{"start_ms":2216121,"end_ms":2222448,"text":"验证这些基本功依然重要，而且可能更重要。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2222448,"end_ms":2227000,"text":"这里会有一个悖论，什么悖论？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2227000,"end_ms":2232096,"text":"以前，高级程序员或者所谓架构师，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2232096,"end_ms":2238911,"text":"是从初级程序员的岗位一点一点磨练出来的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2238911,"end_ms":2247318,"text":"但是现在，这种磨练的机会很少了。除非第一门编程课，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2247318,"end_ms":2257000,"text":"老师硬性要求“古法编程”， 你没办法，只能硬着头皮手敲代码。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2257000,"end_ms":2264434,"text":"但凡不这么要求，人人肯定会偷懒，对不对？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2264434,"end_ms":2276037,"text":"当然，懒惰使人类社会进步，没毛病。 但是相应的锻炼少了，思考少了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2276037,"end_ms":2285000,"text":"你的洞见、思维方式从哪里来？这里就会产生问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2285000,"end_ms":2292228,"text":"还有一个，就是对 AI 要祛魅，或者说要有批判性思维。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2292228,"end_ms":2301848,"text":"在座同学以后可能也会读博士。 大家知道博士的英文叫什么？叫 PhD。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2301848,"end_ms":2310272,"text":"PhD 是什么？Doctor of Philosophy。 读博士，或者研究生，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2310272,"end_ms":2315000,"text":"最大的挑战是什么？你要培养你的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2315000,"end_ms":2325194,"text":"critical thinking。不能人云亦云， 人家说怎么样，你就说这样子。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2325194,"end_ms":2332776,"text":"应该有自己的立场，能够看到他表达里面有什么问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2332776,"end_ms":2340910,"text":"对于 AI 也是同样的。AI 给你一个提示，说“搞完了”，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2340910,"end_ms":2349687,"text":"那就是搞完了吗？你好歹自己先试一试， 再看有没有更自动化、","speaker":"","sentence_id":null,"words":[]},{"start_ms":2349687,"end_ms":2355000,"text":"更好的检验方法。判断始终在人。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2355000,"end_ms":2360981,"text":"包括前一阵陶哲轩在数学家大会上，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2360981,"end_ms":2369299,"text":"谈数学这个 community 在 AI 冲击下何去何从，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2369299,"end_ms":2379617,"text":"我觉得也是这个意思。 现在 AI 能力强了，解题这个过程，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2379617,"end_ms":2390607,"text":"就不像原来那么稀有了。 你要解问题，这样解到底够不够优雅，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2390607,"end_ms":2403617,"text":"能不能给人启示？这些东西， 还是需要整个数学家社区来把控、来品味。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2403617,"end_ms":2409000,"text":"我觉得其他方向也是同样的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2409000,"end_ms":2417588,"text":"具体再看一些简单的大模型工作原理。 第一个是 LLM。LLM 是什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2417588,"end_ms":2424488,"text":"Large Language Model，大语言模型。它做什么事情？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2424488,"end_ms":2430544,"text":"总体来说，就做一件事情：预测下一个词元是什么。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2430544,"end_ms":2437171,"text":"词元就是我们说的 Token。相当于前面已经有一些东西，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2437171,"end_ms":2440000,"text":"要预测下一个是什么。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2440000,"end_ms":2447041,"text":"当然，Attention 可能看的范围更广一些。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2447041,"end_ms":2456946,"text":"它的本质是自回归生成， 逐个词元预测下一个最可能出现的词。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2456946,"end_ms":2468198,"text":"这不但适用于自然语言，也适用于编程语言， 也就是形式化更好的语言。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2468198,"end_ms":2474464,"text":"比如输入一个 def、dot list、左括号，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2474464,"end_ms":2481000,"text":"模型就可以逐词元续写整个完整的程序。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2481000,"end_ms":2487547,"text":"我们先休息五分钟，一会儿再接着往下讲。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2487547,"end_ms":2498396,"text":"词元到底是什么，最有可能出现的词是什么？ 它的预测能力从哪里来？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2498396,"end_ms":2508104,"text":"从训练语料当中，它看过很多代码。 这里当然要归功于 GitHub，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2508104,"end_ms":2518054,"text":"这个网站，传说中的“全球最大的同性社交网站”， 收集了很多代码，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2518054,"end_ms":2524601,"text":"使模型习得语法、惯用法，还有常见模式。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2524601,"end_ms":2535000,"text":"大家仔细想，模型输出的并不是最正确的东西， 而是最有可能的东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2535000,"end_ms":2544552,"text":"所以反过来说， 为什么大模型生成的代码需要审查、测试和验证？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2544552,"end_ms":2551779,"text":"原因就在于它本身的理论基础，是基于概率的预测，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2551779,"end_ms":2558000,"text":"而不是形式化推导之类。这是第一个。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2558000,"end_ms":2566372,"text":"第二个，了解一下现在大语言模型的训练， 大概分三个阶段。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2566372,"end_ms":2574331,"text":"第一个是预训练，用海量文本和代码， 做下一个词元的预测，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2574331,"end_ms":2584000,"text":"从中学到语言知识和代码模式。 之后，会有一个叫监督微调的过程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2584000,"end_ms":2590343,"text":"监督微调要做什么？是给它发指令，然后回答，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2590343,"end_ms":2598598,"text":"就是指令和回答的 pair， 指令回答对。对这种数据进行训练，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2598598,"end_ms":2608000,"text":"实际上学的是什么？听指令做事。 你有什么指令，我怎么样回答。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2608000,"end_ms":2614219,"text":"第三个阶段叫偏好对齐，比较有名的叫 RLHF，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2614219,"end_ms":2619254,"text":"像 OpenAI 这些都用了这个技术。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2619254,"end_ms":2627541,"text":"全称叫 Reinforcement Learning with Human Feedback，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2627541,"end_ms":2633955,"text":"就是有人类反馈的强化学习。这里做的事情，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2633955,"end_ms":2641387,"text":"是基于人类反馈优化它的偏好。实际上想学什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2641387,"end_ms":2649000,"text":"我做出来的东西能够让人满意。通过这样的三个阶段，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2649000,"end_ms":2658059,"text":"解释了为什么模型是听话的。 给它发什么，它回得头头是道，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2658059,"end_ms":2668840,"text":"但仍然会有错。最大的局限是， 知识来自训练数据，数据有时间边界。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2668840,"end_ms":2675984,"text":"这里有两个关键局限点。第一个是上下文窗口，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2675984,"end_ms":2686000,"text":"模型一次能够看见的文本长度有限。 这里会引出上下文工程的概念，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2686000,"end_ms":2691923,"text":"我们下一讲要讲。第二个是刚才说的知识截止，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2691923,"end_ms":2699168,"text":"训练数据只能截取到某一时刻为止，对这些数据进行训练。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2699168,"end_ms":2708000,"text":"对于这个时间以后发生的事情， 或者产生的新知识，它其实是不知道的。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2708000,"end_ms":2715963,"text":"第三个，还是基于概率预测，本质上无法避免幻觉。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2715963,"end_ms":2723601,"text":"它在不确定的时候，仍然会自信地编造一些东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2723601,"end_ms":2733000,"text":"因此，它产生的结果，我们必须验证。这是它的一些原理。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2733000,"end_ms":2743109,"text":"接下来，说一说 AI 编程工具的情况。 首先是演进的几个阶段。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2743109,"end_ms":2752696,"text":"第一个阶段是代码补全。 代码补全跟大模型本身的特征最契合，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2752696,"end_ms":2760978,"text":"它本来就是预测下一个词元，补全无非是多预测一些。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2760978,"end_ms":2766000,"text":"前面有个上文，再多预测一些。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2766000,"end_ms":2775569,"text":"这种方式现在用得相对少了，其实还是人在写代码。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2775569,"end_ms":2787098,"text":"人要开个头，它来续写。 到底续写得怎么样，会不会狗尾续貂，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2787098,"end_ms":2798000,"text":"就得看模型的能力。它是本地同步地写，并且逐行补全。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2798000,"end_ms":2804268,"text":"第二个阶段是 IDE 自动化，代表比如 Cursor。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2804268,"end_ms":2813779,"text":"咱们有没有同学用 Cursor？ Cursor 还是有一些用户群体的。没有？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2813779,"end_ms":2822023,"text":"可能还是过了那个年代了。 Cursor 还是本地同步做生成和补全，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2822023,"end_ms":2829000,"text":"比较好的一点是有 IDE，可以多个文件一起协同编辑。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2829000,"end_ms":2836964,"text":"第三个阶段，就是现在说的 AI Agent，AI 软件工程师。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2836964,"end_ms":2841949,"text":"代表像 Claude Code，包括 Devin，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2841949,"end_ms":2851491,"text":"还有课上会用的开源软件 OpenCode。 最大的特点是，任务拆解之后，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2851491,"end_ms":2857803,"text":"每个任务可以异步执行，它还可以自主规划。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2857803,"end_ms":2865000,"text":"规划可能需要你辅助，给一些启示，还要进行纠正。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2865000,"end_ms":2871019,"text":"这个演化过程，本质是任务颗粒度不断变大。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2871019,"end_ms":2878444,"text":"从最小的几个词、几行，到整个文件，到现在整个项目。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2878444,"end_ms":2884181,"text":"这个过程中，需要的上下文也在不断扩大。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2884181,"end_ms":2891606,"text":"现在很多常用主流模型已经有一兆，甚至更大的上下文。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2891606,"end_ms":2901000,"text":"具体时间关系，就不展开说了， 刚才也基本说到了。第一个是代码补全，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2901000,"end_ms":2908316,"text":"比如 GitHub Copilot， 上下文有限，不能跨文件做大的改动。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2908316,"end_ms":2914089,"text":"对于整个项目的全局，它一无所知，只看了局部。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2914089,"end_ms":2920183,"text":"像 Cursor，主要是仓库级的上下文，有 Agent 模式，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2920183,"end_ms":2925216,"text":"可以多文件编辑，也可以在终端执行命令。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2925216,"end_ms":2931927,"text":"它仍然是同步协作， 人得盯着 AI 干活，中间可能出现问题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2931927,"end_ms":2934000,"text":"人还得再介入。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2934000,"end_ms":2940574,"text":"Agent 模式有工作循环的概念，什么意思？","speaker":"","sentence_id":null,"words":[]},{"start_ms":2940574,"end_ms":2950546,"text":"相当于工作流程是自己驱动的， 能够自驱地做事情，从规划到执行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2950546,"end_ms":2959883,"text":"执行的时候，比如调用工具、 读写文件、运行命令，它都会做。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2959883,"end_ms":2969744,"text":"之后观察结果，结果不对， AI 自己会有初步判断，再想办法调整。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2969744,"end_ms":2974000,"text":"调整完，再回去继续执行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2974000,"end_ms":2981406,"text":"规划一般可能不用动，但执行可以绕着圈不断迭代。","speaker":"","sentence_id":null,"words":[]},{"start_ms":2981406,"end_ms":2991120,"text":"它可以异步，所谓异步， 就是委托到后台运行，有些东西可以并行执行，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2991120,"end_ms":2999740,"text":"几个事情同时开展。 人只要定期验收就好，相当于变成老板，","speaker":"","sentence_id":null,"words":[]},{"start_ms":2999740,"end_ms":3010000,"text":"可以管理多个员工。当然也有挑战， 一个是可控性，一个是验证成本。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3010000,"end_ms":3019350,"text":"有时候看大模型，会觉得它特别傻。 根本不可能的事情，它不断撞墙，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3019350,"end_ms":3027258,"text":"再回来、再撞墙。人可能已经知道，稍微改一句话就好了，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3027258,"end_ms":3034299,"text":"它还在试各种不同方式。还有很要命的长任务漂移，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3034299,"end_ms":3039783,"text":"由于上下文窗口有限，任务特别长的时候，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3039783,"end_ms":3048556,"text":"做后面的事情就忘了前面的事情， 顾头不顾腚，到后面越来越偏。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3048556,"end_ms":3053000,"text":"这实际上形成了一个工具地图。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3053000,"end_ms":3061552,"text":"这个工具地图里面，除了前面说的三类， 现在还有一类线上的、","speaker":"","sentence_id":null,"words":[]},{"start_ms":3061552,"end_ms":3068547,"text":"专门用来构建应用的网站，比如 v0、Lovable。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3068547,"end_ms":3076000,"text":"这些工具从描述生成应用，我理解有点像垂类工具。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3076000,"end_ms":3085862,"text":"工具选型，主要结合任务复杂程度、 上下文需求，还有可控性要求。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3085862,"end_ms":3094657,"text":"如果特别简单， 比如写一个解八皇后问题的代码，直接用对话，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3094657,"end_ms":3104535,"text":"对话框里一扔就完了，根本不需要 Agent， 甚至连 IDE 都用不上。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3104535,"end_ms":3110000,"text":"如果复杂起来，就需要后面的东西。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3110000,"end_ms":3121174,"text":"需要注意，各种工具只是入口， 是让你和大模型交互的一层媒介。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3121174,"end_ms":3129041,"text":"大模型最后出来的东西好不好，取决于什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3129041,"end_ms":3135657,"text":"取决于思维，取决于人给了它什么提示，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3135657,"end_ms":3142053,"text":"也取决于模型本身能做多深的思考。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3142053,"end_ms":3149000,"text":"我们课上以 OpenCode 为主进行实践。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3149000,"end_ms":3159722,"text":"我挑这个软件的主要原因， 是觉得 OpenCode 在现在开源的 AI Agent","speaker":"","sentence_id":null,"words":[]},{"start_ms":3159722,"end_ms":3167682,"text":"里面，做得相对最完善。为什么要用开源的？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3167682,"end_ms":3176000,"text":"很多闭源软件，里面还是藏着一些不为人知的问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3176000,"end_ms":3186146,"text":"前一阵大家会看到， 好几款不开源的 Agent 出了一些问题。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3186146,"end_ms":3194191,"text":"比如把本地不涉及的文件也上传到服务器上去。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3194191,"end_ms":3205110,"text":"开源的话，可以审查代码。当然， 太复杂了也不一定真能看清楚，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3205110,"end_ms":3211000,"text":"好歹它是开源的，有审查的机会。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3211000,"end_ms":3217074,"text":"另外，它支持多种模型后端，都可以配置。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3217074,"end_ms":3225783,"text":"交互界面既有终端的，叫 TUI， Terminal User Interface；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3225783,"end_ms":3233643,"text":"也有图形化界面，叫 GUI， Graphical User Interface，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3233643,"end_ms":3240759,"text":"还是比较友好的。另外，它原生支持 AGENTS.md，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3240759,"end_ms":3250555,"text":"就是智能体的规范文档。 我们会用 OpenCode 做课程的全部演示和项目","speaker":"","sentence_id":null,"words":[]},{"start_ms":3250555,"end_ms":3258117,"text":"实践。辅助也会用一些聊天类的，比如网页版大模型，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3258117,"end_ms":3263000,"text":"可以快速回答问题，或者做探索。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3263000,"end_ms":3267378,"text":"备选也可以用 Cursor、Claude Code。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3267378,"end_ms":3273014,"text":"如果大家已经有用得比较熟的 Agent 软件，也都可以，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3273014,"end_ms":3280000,"text":"只要支持交互记录导出就行。 一般现在成熟的软件都支持导出。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3280000,"end_ms":3290256,"text":"今天的任务，大家可以尝试 OpenCode， 把 OpenCode 环境配好。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3290256,"end_ms":3299730,"text":"课程网站已经有一个文档， 里面一是 OpenCode 最基本的安装，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3299730,"end_ms":3310501,"text":"二是并行科技给清华捐了一笔算力， 每个同学有一千元额度的算力券。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3310501,"end_ms":3317000,"text":"里面有 Kimi、Kimi K3 等一系列模型。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3317000,"end_ms":3325374,"text":"前面课程团队尝试过，是可以用的， 但配置稍微有一点麻烦，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3325374,"end_ms":3333918,"text":"因为是第三方大模型接口。 OpenCode 现在新的 V2 版本，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3333918,"end_ms":3341175,"text":"配置时稍微有一点小毛病，我们已经把坑趟过了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3341175,"end_ms":3347812,"text":"最麻烦的一步，是要编辑一个文本配置文件。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3347812,"end_ms":3356000,"text":"只要配置文件编好了，后面在图形界面里面都可以操作。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3356000,"end_ms":3366605,"text":"另外，开发软件的过程中， 版本控制也非常重要。什么叫版本控制？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3366605,"end_ms":3375464,"text":"软件编写过程中，比如实现完一部分内容，这是一个状态；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3375464,"end_ms":3384000,"text":"在这个基础上，再实现一个新功能，又变成一个新版本。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3384000,"end_ms":3391564,"text":"没有版本控制软件之前，版本控制是很灾难性的事情。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3391564,"end_ms":3400885,"text":"我没在这儿贴截图，大家经常看到， 比如一个项目报告，V1、V2、V3，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3400885,"end_ms":3409223,"text":"最终版、最最最终版、 “打死我也不改了”“再改我就是狗”，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3409223,"end_ms":3415000,"text":"最后“汪汪”，版本一路就这么下来了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3415000,"end_ms":3422269,"text":"有了版本控制软件之后，它有自己的一套规范，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3422269,"end_ms":3433000,"text":"让你不断跟进项目演化过程当中的每一个重要时刻， 使你可以在后面，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3433000,"end_ms":3442066,"text":"比如出问题了，想往回回溯，到底问题在哪个版本引入的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3442066,"end_ms":3452666,"text":"在版本控制的协助下，都可以做到。 我们会从第二个检查点开始，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3452666,"end_ms":3464451,"text":"让大家提交含有版本历史的代码仓库。 我想回头放在清华托管上就行。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3464451,"end_ms":3472611,"text":"评分也会跟版本历史有关系。你是只有一个版本，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3472611,"end_ms":3480282,"text":"或者前面基本没干什么，突然来一个很大的脉冲，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3480282,"end_ms":3486000,"text":"都属于不太合理的软件开发过程。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3486000,"end_ms":3494737,"text":"好的习惯叫小步提交。你做了一件相对完整的事情，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3494737,"end_ms":3502041,"text":"就可以对应版本控制系统里面的一个提交。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3502041,"end_ms":3514000,"text":"比如开发了一个小的新功能， 修复了某个问题等，都可以作为一次提交。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3514000,"end_ms":3519814,"text":"另外，提交的时候会伴有一个 commit log。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3519814,"end_ms":3528554,"text":"提交叫 commit，提交时会伴有一条信息。 我们一般用比较精简的话，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3528554,"end_ms":3534897,"text":"用一行话把这次提交说清楚。这是存档点的思维，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3534897,"end_ms":3538000,"text":"也就是 checkpoint。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3538000,"end_ms":3547121,"text":"大家以前打单机游戏，打 Boss 之前， 是不是会找一个存档点，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3547121,"end_ms":3558110,"text":"先存下来？打 Boss 挂了， 至少不用从头再来，从它前面继续就可以。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3558110,"end_ms":3565394,"text":"让 AI 大改之前，要先确认有稳定的提交版本。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3565394,"end_ms":3573902,"text":"即使改坏了，还可以回退到这个版本。一般提交的时候，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3573902,"end_ms":3584715,"text":"要保证骨架能跑。比如网站首页能打开， 里面的 API 接口能够响应。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3584715,"end_ms":3590000,"text":"每一个可运行阶段，就提交一次。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3590000,"end_ms":3596602,"text":"另外需要注意，现在的版本控制系统，基本都用 Git。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3596602,"end_ms":3603991,"text":"Git 有一个特殊文件， 在仓库主目录底下，叫 .gitignore。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3603991,"end_ms":3608736,"text":"它是一个规则文件，里面放的是什么？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3608736,"end_ms":3613739,"text":"哪些文件不要保存在版本历史系统里面。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3613739,"end_ms":3619000,"text":"哪些文件一般不建议保存在版本历史里面？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3619000,"end_ms":3626996,"text":"第一个，密钥。现在有很多 API Key， 一旦放进版本系统，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3626996,"end_ms":3635222,"text":"就有可能上网。它一旦上网， API 调用额度就可能被人用走，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3635222,"end_ms":3642356,"text":"一定要注意。还有密码，这种东西也不能进历史。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3642356,"end_ms":3651675,"text":"还有各种环境配置，这跟具体技术有关。 现在见得最多的可能是两种，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3651675,"end_ms":3658664,"text":"一是 Python 的环境，一般叫 venv、.env 之类；","speaker":"","sentence_id":null,"words":[]},{"start_ms":3658664,"end_ms":3664000,"text":"还有 node_modules，这是谁的环境？","speaker":"","sentence_id":null,"words":[]},{"start_ms":3664000,"end_ms":3671806,"text":"前端，这是 Node.js， 就是 JavaScript 的一个后端版本。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3671806,"end_ms":3680051,"text":"这些东西，都是程序运行起来之后， 包管理器会自动从网上下载的，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3680051,"end_ms":3689342,"text":"不需要存在版本控制里面。 最重要的几条命令，就是这里列出的五条。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3689342,"end_ms":3697972,"text":"git init 是创建一个带历史的库； git status 是显示当前状态，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3697972,"end_ms":3704019,"text":"比如上一个提交版本之后，有没有文件被修改过，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3704019,"end_ms":3711000,"text":"跟版本历史里面最新的版本已经不一样了，都可以看。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3711000,"end_ms":3719466,"text":"git add，是把某些已经修改过的文件， 放到一个叫暂存区的地方。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3719466,"end_ms":3728055,"text":"放到暂存区以后，再通过 git commit， 也就是提交命令，加一个 -m，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3728055,"end_ms":3736697,"text":"m 就是 message，说明要携带的信息， 就可以正式提交到版本里面。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3736697,"end_ms":3744500,"text":"想查看版本历史，叫 git log。 如果想让每个提交显示一行，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3744500,"end_ms":3750000,"text":"就加 --oneline。这都是命令行操作。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3750000,"end_ms":3757132,"text":"命令行操作不见得适用于每个人，还是稍微有点麻烦。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3757132,"end_ms":3765275,"text":"现在有了大模型，最大的好处是， 可以用自然语言把意图告诉它，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3765275,"end_ms":3771284,"text":"让它通过具体指令、命令去执行。一般来说，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3771284,"end_ms":3780199,"text":"“给我初始化一个 Git 仓库”“现 在有哪几个文件被修改了”“请帮我","speaker":"","sentence_id":null,"words":[]},{"start_ms":3780199,"end_ms":3786026,"text":"提交到 Git 仓库里面去”，跟大模型这么说，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3786026,"end_ms":3794000,"text":"它就能自动帮你做好版本管理。 刚才说到最流行的代码托管，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3794000,"end_ms":3803008,"text":"网站就是 GitHub。当然， 访问 GitHub 的时候可能有点问题，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3803008,"end_ms":3810420,"text":"有时候好，有时候不好，具体大家自行研究怎么办。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3810420,"end_ms":3820142,"text":"我们这门课，后面每位同学的项目， 会指定放在清华自己部署的网站上，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3820142,"end_ms":3830106,"text":"叫 git.tsinghua.edu.cn。 这是清华用一套开源软件 GitLab 部署的","speaker":"","sentence_id":null,"words":[]},{"start_ms":3830106,"end_ms":3836000,"text":"、校内用起来非常方便的代码托管平台。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3836000,"end_ms":3846947,"text":"接下来，做一些简单演示。我随便举一个例子，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3846947,"end_ms":3863343,"text":"写一个命令行待办事项工具， 就是 Todo。给大家演示两种不同方式。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3863343,"end_ms":3875927,"text":"Todo 这件事情本身不算特别麻烦，在网页版聊天框里面，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3875927,"end_ms":3889000,"text":"基本也能做出来。我们来看一下，我就用 DeepSeek。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3889000,"end_ms":3904046,"text":"写一个命令行待办事项工具。 想多说一点，可以要求支持增、删、列出、","speaker":"","sentence_id":null,"words":[]},{"start_ms":3904046,"end_ms":3915668,"text":"完成这些功能。只要这么一说，它就可以生成代码。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3915668,"end_ms":3926277,"text":"但是大家发现，生成的是什么代码？是 HTML。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3926277,"end_ms":3936818,"text":"可能有点小，我放大一点。因为你说的是命令行，","speaker":"","sentence_id":null,"words":[]},{"start_ms":3936818,"end_ms":3951414,"text":"没有说一定是终端下的命令行， 所以它自作主张生成了这样一段代码。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3951414,"end_ms":3957000,"text":"到这儿，已经生成完了。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3957000,"end_ms":3964834,"text":"那怎么办？因为是聊天对话框，我只能下载或者复制下来。","speaker":"","sentence_id":null,"words":[]},{"start_ms":3964834,"end_ms":3972016,"text":"我这儿直接下载，下载之后打开。你看，就是这个样子，"
